      - name: Validate sequential patch order across all 17 exact replacement anchors
        shell: bash
        run: python /tmp/blue_r15104_patch_anchor_selftest.py
      - name: Test real SQLite JSON historical setup matching without network or D1
        shell: bash
        run: python /tmp/blue_r15104_sql_offline_test.py
      - name: Preflight all patch anchors on REAL checked-out sources (no repository edits)
        shell: bash
        run: |
          python - <<'PY_R15104_REAL_SOURCE'
          from pathlib import Path
          import tempfile,shutil,subprocess,sys
          source_files=['worker/src/index.ts','web/src/main.tsx','web/src/SmartBasket.tsx','web/src/r1599-pattern-filters.css']
          with tempfile.TemporaryDirectory(prefix='blue_r15104_real_') as temp:
              root=Path(temp)
              for name in source_files:
                  original=Path(name)
                  if not original.is_file():raise RuntimeError('MISSING_REAL_SOURCE: '+name)
                  dest=root/name;dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(original,dest)
              run=subprocess.run([sys.executable,'/tmp/blue_r15104_patch.py'],cwd=root,capture_output=True,text=True)
              if run.returncode:
                  print(run.stdout,flush=True)
                  print(run.stderr,flush=True)
                  raise RuntimeError('REAL_CHECKOUT_PATCH_PREFLIGHT_FAILED')
              assert 'R15104_PATCH_SCOPE' in run.stdout
              for name in source_files:
                  assert (root/name).read_bytes()!=Path(name).read_bytes(),('PATCH_MUST_CHANGE_FILE',name)
              print('BLUE_R15104_FIX2_REAL_CHECKOUT_PREFLIGHT_PASS all 17 source anchors, 4 files',flush=True)
          PY_R15104_REAL_SOURCE
      - name: Apply small, anchor-checked source-only changes to temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/blue_r15104_patch.py
          printf '\n__pycache__/\n*.pyc\n*.tsbuildinfo\ndist/\nnode_modules/\n' >> .git/info/exclude
          git diff --check
      - name: Check exact 4-file change scope and key regression anchors
        shell: bash
        run: |
          python - <<'PY_R15104_CHECK'
          from pathlib import Path
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={"worker/src/index.ts","web/src/main.tsx","web/src/SmartBasket.tsx","web/src/r1599-pattern-filters.css"}
          assert changed==allowed,('R15104_UNAPPROVED_FILES',sorted(changed))
          api=Path("worker/src/index.ts").read_text()
          main=Path("web/src/main.tsx").read_text()
          basket=Path("web/src/SmartBasket.tsx").read_text()
          css=Path("web/src/r1599-pattern-filters.css").read_text()
          assert "verified_pattern_setup_json" in api and "chart_snapshots cs" in api
          assert "EXISTS (SELECT 1 FROM" in api and "sampleFloor" in api
          assert "setAppliedAmountEok(queryAmountEok)" in main
          assert "min_pattern_n" in main and "patternSampleMin" in main
          assert "patternHighlightMin={highlightMin} patternSampleMin={patternSampleMin}" in main
          assert "r159-tomato-stock" in main and "patternSampleMin" in basket
          assert "r151-mobile-row.r159-tomato-stock>.stock-card" in css
          assert all(not p.startswith(".github/workflows/") for p in changed)
          print("BLUE_R15104_SOURCE_SCOPE_AND_ANCHORS_PASS")
          PY_R15104_CHECK
          git diff --check
      - name: Existing price/search regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/test_r1593_compare.mjs
          node --experimental-strip-types --test tests/test_r1595_grouping.mjs
      - name: React TypeScript production build
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          echo BLUE_R15104_WEB_BUILD_PASS
      - name: Cloudflare API Worker compile dry-run (NOT a deployment)
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/blue-r15104-api-dryrun
          echo BLUE_R15104_API_DRYRUN_PASS
      - name: Final check of changed files after builds
        shell: bash
        run: |
          python - <<'PY_R15104_FINAL'
          import subprocess
          expected={"worker/src/index.ts","web/src/main.tsx","web/src/SmartBasket.tsx","web/src/r1599-pattern-filters.css"}
          actual={line[3:] for line in subprocess.check_output(["git","status","--porcelain","-uall"],text=True).splitlines() if line.strip()}
          assert actual==expected,('R15104_UNEXPECTED_BUILD_FILES',sorted(actual))
          print("BLUE_R15104_FINAL_SCOPE_PASS")
          PY_R15104_FINAL
          git diff --check
      - name: Commit only approved source after successful tests
        if: inputs.apply_changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.ts web/src/main.tsx web/src/SmartBasket.tsx web/src/r1599-pattern-filters.css
          git diff --cached --check
          git diff --cached --quiet || {
            git commit -m 'BLUE R1.5.10.4: align list and basket with verified chart evidence'
            git push origin HEAD:main
          }
          echo BLUE_R15104_SOURCE_COMMITTED
      - name: State strict non-deployment safety boundary
        shell: bash
        run: |
          echo 'BLUE_R15104_ALL_CHECKS_PASS'
          echo 'No remote D1 writes, no KIS requests/tokens, no Collector changes, no orders.'
          echo 'API Worker and frontend require separate deployment verification after apply_changes=true.'
