name: BLUE R1.5 AI Smart Basket Safe Install (MANUAL)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE tests integration only; TRUE commits two isolated integration changes.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r15-basket-install
  cancel-in-progress: false
jobs:
  test_then_optional_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard repo and branch
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline isolated AI candidate tests
        run: node --experimental-strip-types --test tests/test_basket_r15.mjs
      - name: Apply safe integration in runner workspace
        run: python scripts/blue_r15_basket_install.py --apply
      - name: Build existing web + new basket
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Compile existing API + new AI basket (dry-run)
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r15-worker-build
      - name: Commit only two integration changes (explicit opt in)
        if: inputs.apply_changes
        run: |
          test -f web/src/SmartBasket.tsx
          test -f worker/src/basket.ts
          git add web/src/main.tsx worker/src/index.ts
          if git diff --cached --quiet; then
            echo 'R15_ALREADY_INSTALLED'
          else
            git config user.name 'BLUE R1.5 safe installer'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'BLUE R1.5: add isolated AI smart basket UI and API routes'
            git push origin HEAD:main
          fi
