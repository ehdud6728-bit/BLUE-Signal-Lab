      - name: Patch only reviewed search, basket, tracking and protected server modules
        run: |
          python scripts/blue_r1594_install.py --check
          python scripts/blue_r1594_install.py --apply
          python scripts/blue_r1594_install.py --check
          python -m py_compile scripts/blue_r1594_install.py
      - name: R1594 strict-source and installer tests
        run: python -m unittest discover -s tests -p 'test_r1594_install.py' -v
      - name: R1594 authenticated queue and collector tests
        run: |
          node --experimental-strip-types --test tests/test_r1594_priority.mjs
          node --test tests/test_r1594_collector.mjs
      - name: Preserve existing price comparison and AI basket regressions
        run: |
          node --experimental-strip-types --test tests/test_r1593_compare.mjs
          node --experimental-strip-types --test tests/test_basket_r15.mjs
      - name: Install existing Python regression dependencies
        run: python -m pip install pandas numpy pyarrow requests 'pykrx==1.2.9' 'cryptography>=43,<48'
      - name: Run existing repository Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Build React TypeScript frontend
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Compile-check API Worker without deploying
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r1594-api-build
      - name: Test existing collector and compile-check without deploying
        working-directory: collector
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run build:check
      - name: Validate exact changed source scope and no collector secret changes
        run: |
          python - <<'PYSCOPE'
          import subprocess
          from pathlib import Path
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'web/src/main.tsx','web/src/SmartBasket.tsx','web/src/LiveMarket.tsx',
            'web/src/price-compare.ts','worker/src/index.ts','worker/src/price-compare.ts','collector/src/index.mjs'}
          assert modified==expected,('R1594_UNEXPECTED_CHANGED_FILES',sorted(modified))
          required={'collector/src/search-quote-priority.mjs','scripts/blue_r1594_install.py','tests/test_r1594_collector.mjs','tests/test_r1594_install.py','tests/test_r1594_priority.mjs','web/src/r1594-refresh.css','web/src/search-priority.ts','worker/src/search-quote-priority.ts'}
          assert all(Path(p).is_file() for p in required),'R1594_REQUIRED_FILE_MISSING'
          assert 'requestSearchQuotes(request,env.DB)' in Path('worker/src/index.ts').read_text()
          assert 'if (!access)' in Path('worker/src/index.ts').read_text()
          assert 'collectSearchPriority(env)' in Path('collector/src/index.mjs').read_text()
          assert 'requestSearchPriority(priority,ctrl.signal)' in Path('web/src/main.tsx').read_text()
          print('R1594_SCOPE_OK',sorted(modified))
          PYSCOPE
      - name: Commit only after approval and all tests pass
        if: inputs.apply_changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/main.tsx web/src/SmartBasket.tsx web/src/LiveMarket.tsx web/src/price-compare.ts \
            worker/src/index.ts worker/src/price-compare.ts collector/src/index.mjs \
            web/src/search-priority.ts web/src/r1594-refresh.css worker/src/search-quote-priority.ts \
            collector/src/search-quote-priority.mjs scripts/blue_r1594_install.py \
            tests/test_r1594_priority.mjs tests/test_r1594_collector.mjs tests/test_r1594_install.py
          git diff --cached --quiet || {
            git commit -m 'BLUE R1.5.9.4: refresh tabs and bounded search-triggered KIS quote queue'
            git push origin HEAD:main
          }
      - name: Report deployment boundary
        run: |
          echo 'R1594_ALL_TESTS_PASS'
          echo 'If apply_changes=false, no commit. Rerun with true for reviewed source commit.'
          echo 'Three separate deploy targets: API Worker, KIS collector, frontend.'
          echo 'Existing KIS credentials stay server-only; no browser direct KIS calls.'
