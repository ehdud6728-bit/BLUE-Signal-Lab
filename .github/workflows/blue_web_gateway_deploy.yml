name: BLUE iOS Same Origin Gateway Deploy (EXPLICIT)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify_only, deploy_web, deploy_api, deploy_api_and_web]
        default: verify_only
        required: true
      access_team:
        description: 'KEEP_EXISTING (default), or exact new Access team domain for an intentional auth change'
        type: string
        default: KEEP_EXISTING
        required: false
      access_aud:
        description: 'KEEP_EXISTING (default), or exact new Access Application Audience'
        type: string
        default: KEEP_EXISTING
        required: false
      confirm_policy:
        description: 'KEEP_EXISTING for routine releases; WEB_API_ACCESS_POLICY_VERIFIED only after intentional Access policy review'
        type: string
        default: KEEP_EXISTING
        required: false
permissions:
  contents: read
concurrency:
  group: blue-web-manual-production-deploy
  cancel-in-progress: false
jobs:
  verify_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scope and explicit authorization
        env:
          MODE: ${{ inputs.mode }}
          TEAM: ${{ inputs.access_team }}
          AUD: ${{ inputs.access_aud }}
          CONFIRM: ${{ inputs.confirm_policy }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ehdud6728-bit/BLUE-Signal-Lab
          case "$MODE" in verify_only|deploy_web|deploy_api|deploy_api_and_web) ;; *) exit 1;; esac
          if [[ "$MODE" != verify_only ]]; then
            test "$GITHUB_REF" = refs/heads/main
            if [[ "$TEAM" = KEEP_EXISTING && "$AUD" = KEEP_EXISTING ]]; then
              test "$CONFIRM" = KEEP_EXISTING
              echo 'Routine deploy: preserve existing Access variables; does not independently audit Access policies.'
            else
              test "$MODE" = deploy_api_and_web
              test "$CONFIRM" = WEB_API_ACCESS_POLICY_VERIFIED
              [[ "$TEAM" =~ ^[a-z0-9-]+\.cloudflareaccess\.com$ ]]
              [[ "$AUD" =~ ^[a-f0-9]{64}$ ]]
              echo 'Operator confirmed Access configuration change and policy review.'
            fi
          fi
      - name: Offline gateway authentication tests
        run: |
          node --test tests/test_web_gateway.mjs tests/test_gateway_deploy_defaults.mjs
          python3 -m unittest discover -s tests -p 'test_gateway_binding_preflight.py'
      - working-directory: worker
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Dry-run API Worker
        working-directory: worker
        run: npx wrangler deploy --dry-run
      - working-directory: web
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build same-origin web bundle
        working-directory: web
        env:
          VITE_API_BASE: https://blue-signal-lab.ehdud6728.workers.dev
        run: npm run build
      - name: Dry-run gateway Worker
        working-directory: web
        run: npx --yes wrangler@4 deploy --config wrangler.gateway.jsonc --dry-run
      - name: Read existing Worker settings and rollback versions
        if: inputs.mode != 'verify_only'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEAM: ${{ inputs.access_team }}
          AUD: ${{ inputs.access_aud }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          for worker in blue-signal-lab-api-v2 blue-signal-lab; do
            for endpoint in settings deployments; do
              curl --fail --silent --show-error --max-time 30 \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/$endpoint" \
                -o "$RUNNER_TEMP/$worker-$endpoint.json"
            done
          done
          python - <<'PY'
          import json,os,re,urllib.request
          from pathlib import Path
          from tools.gateway_binding_preflight import frontend_state,routine_decision
          root=Path(os.environ['RUNNER_TEMP'])
          def read(worker,endpoint):
              body=json.loads((root/f'{worker}-{endpoint}.json').read_text())
              if body.get('success') is not True or not isinstance(body.get('result'),dict):
                  raise SystemExit('BLOCKED: invalid Worker metadata')
              return body['result']
          for worker in ('blue-signal-lab-api-v2','blue-signal-lab'):
              settings=read(worker,'settings')
              bindings=settings.get('bindings')
              if not isinstance(bindings,list) or any(not isinstance(b,dict) for b in bindings):
                  raise SystemExit('BLOCKED: invalid Worker bindings')
              if worker=='blue-signal-lab':
                  try:
                      front_state=frontend_state(bindings)
                  except ValueError as e:
                      raise SystemExit(str(e)) from None
              else:
                  names={b.get('name'):b.get('type') for b in bindings}
                  if names.get('DB')!='d1' or names.get('KIS_COLLECTOR')!='service':
                      raise SystemExit('BLOCKED: expected API bindings missing')
                  if os.environ['TEAM']=='KEEP_EXISTING':
                      values={b.get('name'):b.get('text','') for b in bindings if b.get('type')=='plain_text'}
                      team=values.get('BLUE_WEB_ACCESS_TEAM','')
                      aud=values.get('BLUE_WEB_ACCESS_AUD','')
                      if not isinstance(team,str) or not isinstance(aud,str) or not re.fullmatch(r'[a-z0-9-]+\.cloudflareaccess\.com',team) or not re.fullmatch(r'[a-f0-9]{64}',aud):
                          raise SystemExit('BLOCKED: existing gateway Access variables missing or invalid')
                      print('BLUE_EXISTING_ACCESS_CONFIG_VERIFIED_FORMAT_ONLY')
              deployments=read(worker,'deployments').get('deployments')
              if not isinstance(deployments,list) or not deployments:
                  raise SystemExit('BLOCKED: no rollback deployment')
              latest=max(deployments,key=lambda d:d.get('created_on',''))
              versions=latest.get('versions',[])
              if len(versions)!=1 or versions[0].get('percentage')!=100:
                  raise SystemExit('BLOCKED: existing gradual deployment')
              version=versions[0].get('version_id','')
              if not re.fullmatch(r'[a-f0-9-]{36}',version):
                  raise SystemExit('BLOCKED: invalid rollback version')
              print(f'BLUE_ROLLBACK_VERSION {worker} {version}')
              if worker=='blue-signal-lab' and os.environ['TEAM']=='KEEP_EXISTING':
                  # /settings can omit the named binding. Check the exact active deployment version.
                  # BLOCKED: routine deployment requires existing same-origin service binding
                  active_bindings=None
                  if front_state!='EXACT':
                      url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/scripts/{worker}/versions/{version}"
                      try:
                          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              doc=json.load(response)
                          result=doc.get('result')
                          if doc.get('success') is not True or not isinstance(result,dict) or result.get('id')!=version:
                              raise ValueError()
                          resources=result.get('resources')
                          if not isinstance(resources,dict) or not isinstance(resources.get('bindings'),list):
                              raise ValueError()
                          active_bindings=resources['bindings']
                      except Exception:
                          raise SystemExit('BLOCKED: cannot verify exact deployed version binding metadata') from None
                  try:
                      decision=routine_decision(bindings,active_bindings,os.environ['MODE'])
                  except ValueError as e:
                      raise SystemExit(str(e)) from None
                  print(f'BLUE_FRONTEND_BINDING_PREFLIGHT {front_state} {decision}')
                  if decision=='REBUILD_FULL_DEPLOY':
                      # Explicit full deployment restores the exact named service, never a default/public API route.
                      cfg=json.loads(Path('web/wrangler.gateway.jsonc').read_text())
                      expected=[{'binding':'BLUE_API','service':'blue-signal-lab-api-v2','entrypoint':'BlueWebGateway'}]
                      if cfg.get('name')!='blue-signal-lab' or cfg.get('main')!='gateway.mjs' or cfg.get('services')!=expected or cfg.get('assets',{}).get('run_worker_first')!=['/api/*']:
                          raise SystemExit('BLOCKED: repository gateway config does not match expected repair')
                      print('BLUE_RESTORE_NAMED_BINDING_BY_FULL_DEPLOY (not proof of existing binding)')
          PY
      - name: Deploy existing API with verified gateway configuration
        if: inputs.mode == 'deploy_api' || inputs.mode == 'deploy_api_and_web'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEAM: ${{ inputs.access_team }}
          AUD: ${{ inputs.access_aud }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TEAM" = KEEP_EXISTING ]]; then
            npx wrangler deploy --keep-vars
          else
            npx wrangler deploy --keep-vars --var "BLUE_WEB_ACCESS_TEAM:$TEAM" "BLUE_WEB_ACCESS_AUD:$AUD"
          fi
          echo BLUE_GATEWAY_API_DEPLOYED
      - name: Deploy same-origin frontend to existing URL
        if: inputs.mode == 'deploy_web' || inputs.mode == 'deploy_api_and_web'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.gateway.jsonc
          echo BLUE_SAME_ORIGIN_WEB_DEPLOYED
          echo 'Authenticated Safari/PWA and unauthorized-account checks still required.'
      - name: Verify-only summary
        if: inputs.mode == 'verify_only'
        run: echo 'BLUE_GATEWAY_VERIFY_ONLY - no production changes'
