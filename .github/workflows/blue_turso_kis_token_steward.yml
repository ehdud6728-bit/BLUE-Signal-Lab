name: BLUE Shared KIS Token Steward (Turso + D1, CUTOVER-GATED)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check is read-only token metadata; issue needs explicit cutover flags and confirmation'
        type: choice
        required: true
        default: check
        options: [check, sync, issue]
      confirm_cutover:
        description: 'For issue/sync enter exactly blue-turso-kis-cutover (normal or audited early cutover)'
        type: string
        required: false
        default: ''
      allow_early_cutover:
        description: 'Manual-only exception: D1 issuer paused and last issue >24h verified'
        type: boolean
        required: true
        default: false
      confirm_early_cutover:
        description: 'If early, enter exactly blue-early-cutover-verified (and attest no outside tokenP)'
        type: string
        required: false
        default: ''
  # Use a single issuer after cutover; old D1 scheduling must be paused.
  # Always check at 06:00 and 06:30 KST, then twice/hour on weekdays.
  # tokenP is called only when renewal is due, guarded by the persisted ledger.
  schedule:
    - cron: '0,30 21 * * *'
    - cron: '0,30 22,23 * * 0-4'
    - cron: '0,30 0-10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: blue-turso-single-kis-token-issuer
  cancel-in-progress: false

jobs:
  steward:
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.BLUE_KIS_TURSO_CUTOVER_APPROVED == 'true' && vars.BLUE_KIS_TOKEN_AUTO_PAUSED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only Turso client
        working-directory: tools/turso
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Verify cutover, encryption and timestamp safety locally
        run: node --test tools/turso/kis-token-steward.test.mjs
      - name: Read-only metadata check or guarded dual-vault token operation
        env:
          MODE: ${{ github.event_name == 'schedule' && 'issue' || inputs.mode }}
          CONFIRM: ${{ inputs.confirm_cutover }}
          ALLOW_EARLY: ${{ inputs.allow_early_cutover }}
          CONFIRM_EARLY: ${{ inputs.confirm_early_cutover }}
          BLUE_KIS_TOKEN_AUTO_PAUSED: ${{ vars.BLUE_KIS_TOKEN_AUTO_PAUSED }}
          BLUE_KIS_TURSO_CUTOVER_APPROVED: ${{ vars.BLUE_KIS_TURSO_CUTOVER_APPROVED }}
          BLUE_KIS_D1_DISABLED_AT_UTC: ${{ vars.BLUE_KIS_D1_DISABLED_AT_UTC }}
          BLUE_KIS_EARLY_CUTOVER_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_early_cutover && vars.BLUE_KIS_EARLY_CUTOVER_APPROVED == 'true' && 'true' || 'false' }}
          BLUE_KIS_DUAL_VAULT_ENABLED: ${{ vars.BLUE_KIS_DUAL_VAULT_ENABLED }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          if [[ "$MODE" == 'issue' || "$MODE" == 'sync' ]]; then
            if [[ "${{ github.event_name }}" != 'schedule' && "$CONFIRM" != 'blue-turso-kis-cutover' ]]; then
              echo 'ISSUE_BLOCKED: explicit manual confirmation missing'; exit 1
            fi
            if [[ "$BLUE_KIS_TOKEN_AUTO_PAUSED" != 'true' || "$BLUE_KIS_TURSO_CUTOVER_APPROVED" != 'true' ]]; then
              echo 'ISSUE_BLOCKED: pause legacy D1 issuer and approve Turso cutover first'; exit 1
            fi
            if [[ "$BLUE_KIS_DUAL_VAULT_ENABLED" != 'true' ]]; then
              echo 'DUAL_VAULT_DISABLED: enable only after tests and cutover review'; exit 1
            fi
            if [[ "$ALLOW_EARLY" == 'true' ]]; then
              if [[ "${{ github.event_name }}" != 'workflow_dispatch' || "$CONFIRM_EARLY" != 'blue-early-cutover-verified' || "$BLUE_KIS_EARLY_CUTOVER_APPROVED" != 'true' ]]; then
                echo 'EARLY_CUTOVER_BLOCKED: manual attestation and repo approval required'; exit 1
              fi
            fi
            if [[ "$MODE" == 'sync' ]]; then
              node tools/turso/kis-token-steward.mjs --sync
            else
              node tools/turso/kis-token-steward.mjs --issue
            fi
          else
            node tools/turso/kis-token-steward.mjs --check
          fi
