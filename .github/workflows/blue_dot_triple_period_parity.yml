name: BLUE Dotted 20-30-40 Parity (MANUAL / READ ONLY)

on:
  pull_request:
    paths:
      - 'scripts/blue_dot_triple_period_parity.py'
      - 'tests/test_blue_dot_triple_period_parity.py'
      - 'research/blue_dot_speko_30_2_26_observations.json'
      - '.github/workflows/blue_dot_triple_period_parity.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan (no downloads) or study (pinned public MARCAP source)'
        type: choice
        options: [plan, study]
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: blue-dot-triple-parity
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'plan' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic offline analysis dependencies
        run: |
          python -m pip install 'pandas>=2,<3' 'numpy>=1.24,<3' 'pyarrow>=17,<24'
      - name: Check all 20 30 40 variants and causal line invariants
        run: |
          python -m unittest tests.test_blue_dot_triple_period_parity -v
          python -m unittest tests.test_blue_dot_broker_parity -v
      - name: Offline plan with no network calls or secrets
        if: env.MODE == 'plan'
        run: python scripts/blue_dot_triple_period_parity.py --mode=plan
      - name: Permit manual study only on repository main
        if: env.MODE == 'study'
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
      - name: Download pinned public unadjusted 2025 and 2026 EOD snapshots
        if: env.MODE == 'study'
        run: |
          set -euo pipefail
          mkdir -p output/blue_dot_triple/sources
          for YEAR in 2025 2026; do
            curl --fail --location --retry 2 --silent --show-error \
              --output "output/blue_dot_triple/sources/marcap-$YEAR.parquet" \
              "https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-$YEAR.parquet"
          done
      - name: Audit 20 30 40 lower and upper shifted lines
        if: env.MODE == 'study'
        run: |
          python scripts/blue_dot_triple_period_parity.py --mode=study \
            --source-dir output/blue_dot_triple/sources \
            --out output/blue_dot_triple/report.json
      - name: Archive numeric parity diagnostic (never trading signals)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_DOT_TRIPLE_${{ github.run_id }}
          path: output/blue_dot_triple/report.json
          if-no-files-found: ignore
          retention-days: 14
