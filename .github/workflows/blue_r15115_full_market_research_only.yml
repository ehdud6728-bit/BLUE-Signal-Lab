name: BLUE R1.5.10.15 Full Observed Market EOD Strategy Lab (VERIFIED PROVIDER - READ ONLY)

on:
  workflow_dispatch:
    inputs:
      asof_date:
        description: 'Completed KRX EOD date YYYY-MM-DD, independently verified.'
        type: string
        required: true
        default: '2026-11-13'
      research_scope:
        description: 'FULL_MARKET all observed eligible symbols; SMOKE_40 quick diagnostic.'
        type: choice
        required: true
        default: SMOKE_40
        options:
          - SMOKE_40
          - FULL_MARKET
      eod_provider:
        description: 'auto: pykrx then OpenAPI on source failure; explicit provider: no fallback.'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - openapi
          - pykrx
      confirm_research_only:
        description: 'Type RESEARCH_ONLY. Never write to D1 or deploy the app.'
        type: string
        required: true
        default: RESEARCH_ONLY

permissions:
  contents: read

concurrency:
  group: blue-r15115-verified-${{ inputs.asof_date }}
  cancel-in-progress: false

jobs:
  full_market_research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Guard repo, branch, date, scope, provider and explicit research-only consent
        env:
          ASOF: ${{ inputs.asof_date }}
          SCOPE: ${{ inputs.research_scope }}
          PROVIDER: ${{ inputs.eod_provider }}
          APPROVAL: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$APPROVAL" = 'RESEARCH_ONLY'
          [[ "$ASOF" =~ ^202[56]-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$SCOPE" = FULL_MARKET || "$SCOPE" = SMOKE_40 ]]
          [[ "$PROVIDER" = auto || "$PROVIDER" = openapi || "$PROVIDER" = pykrx ]]

      - name: Checkout project with immutable original research-source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify read-only research dependencies
        run: |
          set -euo pipefail
          test -f research/strategy_lab_r15114/daily.py
          test -f scripts/market_scan.py
          test -f scripts/market_scan_r11.py
          test -f scripts/market_scan_r08.py
          test -f scripts/supply_profile_r15110.py
          test -f tests/test_strategy_lab_r15114.py
          test -f tests/test_supply_profile_r15110.py

      - name: Restore immutable SHA256-pinned original strategy runner to temporary folder
        env:
          ORIGINAL_COMMIT: 2408de5bd899b6768e528de09956b5b005ee0eb6
          ORIGINAL_WORKFLOW: .github/workflows/blue_r15115_full_market_research_only.yml
          BUNDLE_SHA256: 60f4b7428b438ed7d34e4a9198c399a7255b4a8210f592ee1d2653708ba2ad1e
        run: |
          set -euo pipefail
          python -B - <<'PY_RESTORE'
          import base64
          import hashlib
          import io
          import os
          from pathlib import Path
          import re
          import subprocess
          import tarfile

          # The exact original workflow commit holds the previously-tested
          # source archive. No network-download of unpinned application code.
          src = subprocess.check_output([
              'git', 'show',
              os.environ['ORIGINAL_COMMIT'] + ':' + os.environ['ORIGINAL_WORKFLOW'],
          ], text=True)
          found = re.findall(
              r"cat <<'BLUE_RESEARCH_ARCHIVE' \| base64 -d >[^\n]*\n(.*?)\n\s*BLUE_RESEARCH_ARCHIVE",
              src, flags=re.S)
          if len(found) != 1:
              raise SystemExit('PINNED_ORIGINAL_ARCHIVE_NOT_FOUND')
          blob = base64.b64decode(''.join(found[0].split()), validate=True)
          actual = hashlib.sha256(blob).hexdigest()
          if actual != os.environ['BUNDLE_SHA256']:
              raise SystemExit('PINNED_ORIGINAL_ARCHIVE_SHA_MISMATCH')
          dest = Path(os.environ['RUNNER_TEMP']) / 'blue_r15115'
          dest.mkdir(parents=True, exist_ok=True)
          expected = {'analysis.py', 'test_analysis.py', 'run_full_market.py', 'README.md'}
          with tarfile.open(fileobj=io.BytesIO(blob), mode='r:gz') as arc:
              entries = arc.getmembers()
              if {m.name for m in entries} != expected or any(not m.isfile() for m in entries):
                  raise SystemExit('UNEXPECTED_PINNED_ARCHIVE_ENTRIES')
              for entry in entries:
                  (dest / entry.name).write_bytes(arc.extractfile(entry).read())
          print('BLUE_R15115_ORIGINAL_RESEARCH_SOURCE_SHA256_OK', actual)
          PY_RESTORE

      - name: Install research Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas numpy pyarrow requests 'pykrx==1.2.9'

      - name: Unit-test existing research, historical guards and supply analysis
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/blue_r15115:$PWD:$PWD/scripts"
          python -B -m unittest discover -s "$RUNNER_TEMP/blue_r15115" -p 'test_analysis.py' -v
          python -B -m unittest discover -s tests -p 'test_strategy_lab_r15114.py' -v
          python -B -m unittest discover -s tests -p 'test_supply_profile_r15110.py' -v

      - name: Run actual EOD study with independently verified provider selection (NO WRITES)
        env:
          ASOF: ${{ inputs.asof_date }}
          SCOPE: ${{ inputs.research_scope }}
          EOD_PROVIDER: ${{ inputs.eod_provider }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_DATA_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_DATA_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/blue_r15115:$PWD:$PWD/scripts"
          python -B - <<'PY_VERIFIED_EOD'
          import json
          import os
          from pathlib import Path
          import runpy
          import sys
          from market_scan_r08 import SourcePending
          import market_scan_r11 as source_adapter

          choice = os.environ['EOD_PROVIDER']
          if choice not in {'auto', 'openapi', 'pykrx'}:
              raise SystemExit('INVALID_RESEARCH_PROVIDER')
          path = Path(os.environ['RUNNER_TEMP']) / 'blue_r15115' / 'run_full_market.py'
          if not path.is_file():
              raise SystemExit('PINNED_RESEARCH_RUNNER_NOT_FOUND')

          # The pinned run_full_market.py imports the provider functions INSIDE
          # run(), from market_scan_r11. Patch the actual source module before
          # running that original, unchanged SHA256-verified code.
          if not callable(getattr(source_adapter, 'selected_provider', None)):
              raise SystemExit('SOURCE_ADAPTER_SELECTOR_MISSING')
          if not callable(getattr(source_adapter, 'upgraded_history', None)):
              raise SystemExit('SOURCE_ADAPTER_HISTORY_MISSING')
          original_select = source_adapter.selected_provider
          original_history = source_adapter.upgraded_history
          evidence = {'requested': choice, 'used': None, 'fallback': False}

          def choose_provider(_auto, key, has_account):
              return original_select(choice, key, has_account)

          def verified_history(raw, target, today, provider, key, *args, **kwargs):
              try:
                  result = original_history(raw, target, today, provider, key,
                                            *args, **kwargs)
                  evidence['used'] = provider
                  return result
              except SourcePending as exc:
                  # Only a provider outage/schema-unavailable response is eligible.
                  # Invalid prices, date mismatches, and independent index/ticker
                  # proof mismatches remain hard failures.
                  retryable = (
                      'KRX_PROVIDER_UNAVAILABLE:', 'PYKRX_UNAVAILABLE:',
                      'KRX_SCHEMA_INVALID:', 'KRX_DATE_NOT_AVAILABLE:',
                  )
                  if not (choice == 'auto' and provider == 'pykrx'
                          and bool(key) and str(exc).startswith(retryable)):
                      raise
                  print('BLUE_R15115_PYKRX_SOURCE_UNAVAILABLE; '
                        'VERIFYING_KRX_OPENAPI_EXACT_DATE', flush=True)
                  result = original_history(raw, target, today, 'openapi', key,
                                            *args, **kwargs)
                  evidence['used'] = 'openapi'
                  evidence['fallback'] = True
                  return result

          source_adapter.selected_provider = choose_provider
          source_adapter.upgraded_history = verified_history
          out = Path('output/strategy_lab_r15115_fullmarket')
          sys.argv = [str(path), '--asof', os.environ['ASOF'],
                      '--mode', os.environ['SCOPE'], '--out', str(out)]
          try:
              # runpy executes the original entry point; inside run(), the
              # locally imported adapter resolves to the wrappers above.
              runpy.run_path(str(path), run_name='__main__')
          finally:
              source_adapter.selected_provider = original_select
              source_adapter.upgraded_history = original_history

          audit_path = out / 'SOURCE_AUDIT.json'
          if evidence['used'] not in {'pykrx', 'openapi'} or not audit_path.is_file():
              raise SystemExit('VERIFIED_PROVIDER_AUDIT_UNAVAILABLE')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          if audit.get('source_target_verified') != 'KRX_EXACT_DATE_WITH_TICKER_INDEX_PARITY':
              raise SystemExit('UNEXPECTED_ORIGINAL_SOURCE_PROOF')
          if evidence['used'] == 'openapi':
              # Exact BAS_DD and KOSPI/KOSDAQ coverage do NOT imply independent
              # ticker/index parity; accurately record the lower proof level.
              audit['source_target_verified'] = 'KRX_OPENAPI_EXACT_BAS_DD_AND_MARKET_COVERAGE'
              audit['independent_ticker_index_parity_verified'] = False
          else:
              audit['independent_ticker_index_parity_verified'] = True
          audit['verified_eod_provider'] = evidence['used']
          audit['requested_eod_provider'] = choice
          audit['provider_fallback_used'] = evidence['fallback']
          audit_path.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2, allow_nan=False),
              encoding='utf-8')
          print('BLUE_R15115_VERIFIED_EOD', evidence['used'],
                'fallback', evidence['fallback'], flush=True)
          PY_VERIFIED_EOD

      - name: Audit real results and strict research-only boundary
        run: |
          set -euo pipefail
          python -B - <<'PY_AUDIT'
          import json
          import subprocess
          from pathlib import Path
          out = Path('output/strategy_lab_r15115_fullmarket')
          required = {
              'summary_overall.csv', 'summary_by_year.csv',
              'summary_by_market.csv', 'summary_early_vs_late.csv',
              'summary_year_market_10d.csv', 'success_failure_factors.csv',
              'research_events.csv', 'SOURCE_AUDIT.json',
          }
          missing = {p for p in required if not (out / p).is_file() or
                     (out / p).stat().st_size == 0}
          if missing:
              raise SystemExit('R15115_MISSING_RESULTS ' + str(sorted(missing)))
          audit = json.loads((out / 'SOURCE_AUDIT.json').read_text(encoding='utf-8'))
          if not audit['read_only'] or not audit['no_d1_write'] or not audit['no_worker_deploy']:
              raise SystemExit('WRONG_RESEARCH_MODE')
          proof = {
              'pykrx': 'KRX_EXACT_DATE_WITH_TICKER_INDEX_PARITY',
              'openapi': 'KRX_OPENAPI_EXACT_BAS_DD_AND_MARKET_COVERAGE',
          }
          provider = audit.get('verified_eod_provider')
          if provider not in proof or audit.get('source_target_verified') != proof[provider]:
              raise SystemExit('MISSING_OR_MISLABELED_KRX_DATE_PROOF')
          if audit.get('independent_ticker_index_parity_verified') != (provider == 'pykrx'):
              raise SystemExit('FALSE_INDEPENDENT_SOURCE_PARITY_CLAIM')
          if audit['mode'] == 'FULL_MARKET' and audit['analyzed_symbols'] < 1700:
              raise SystemExit('INCOMPLETE_FULL_MARKET_UNIVERSE')
          modified = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          untracked = subprocess.check_output([
              'git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          outside = [p for p in untracked if not p.startswith('output/strategy_lab_r15115_fullmarket/')]
          if modified or outside:
              raise SystemExit(f'SOURCE_SCOPE_BLOCKED modified={modified} new={outside}')
          print('BLUE_R15115_RESEARCH_ONLY_AUDIT_OK',
                audit['analyzed_symbols'], audit['total_events_including_baseline'], provider)
          PY_AUDIT

      - name: Upload research CSV and audit artifacts only (no D1 or deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15115_VERIFIED_EOD_${{ github.run_id }}
          path: output/strategy_lab_r15115_fullmarket/
          if-no-files-found: warn
          retention-days: 14
