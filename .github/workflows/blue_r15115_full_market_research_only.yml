          import hashlib,os,tarfile
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'blue_r15115.tar.gz'
          actual=hashlib.sha256(src.read_bytes()).hexdigest()
          if actual!=os.environ['BUNDLE_SHA256']:raise SystemExit('R15115_SOURCE_BUNDLE_SHA_MISMATCH')
          with tarfile.open(src,mode='r:gz') as archive:
              expected={'analysis.py','test_analysis.py','run_full_market.py','README.md'}
              got={m.name for m in archive.getmembers()}
              if got!=expected or any(not m.isfile() for m in archive.getmembers()):
                  raise SystemExit('R15115_UNEXPECTED_BUNDLE_FILES')
              archive.extractall(Path(os.environ['RUNNER_TEMP'])/'blue_r15115',filter='data')
