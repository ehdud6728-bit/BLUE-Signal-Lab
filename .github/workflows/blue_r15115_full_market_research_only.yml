      - name: Install offline analysis and verified KRX research dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas numpy pyarrow requests 'pykrx==1.2.9'

      - name: Run full-market research unit tests and previous strategy regressions
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/blue_r15115:$PWD"
          python -B -m unittest discover -s "$RUNNER_TEMP/blue_r15115" -p 'test_analysis.py' -v
          python -B -m unittest discover -s tests -p 'test_strategy_lab_r15114.py' -v
          python -B -m unittest discover -s tests -p 'test_supply_profile_r15110.py' -v

      - name: Run actual all-observed-market EOD and success-failure research (NO D1 WRITE)
        env:
          ASOF: ${{ inputs.asof_date }}
          SCOPE: ${{ inputs.research_scope }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_DATA_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_DATA_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/blue_r15115:$PWD"
          python -B "$RUNNER_TEMP/blue_r15115/run_full_market.py" \
            --asof "$ASOF" --mode "$SCOPE" --out output/strategy_lab_r15115_fullmarket

      - name: Validate real results, target KRX provenance, output & read-only boundaries
        run: |
          set -euo pipefail
          python - <<'PY_AUDIT'
          import json,subprocess
          from pathlib import Path
          out=Path('output/strategy_lab_r15115_fullmarket')
          required={'summary_overall.csv','summary_by_year.csv','summary_by_market.csv',
            'summary_early_vs_late.csv','summary_year_market_10d.csv',
            'success_failure_factors.csv','research_events.csv','SOURCE_AUDIT.json'}
          missing={x for x in required if not (out/x).exists() or (out/x).stat().st_size==0}
          if missing:raise SystemExit('R15115_MISSING_RESULTS '+str(sorted(missing)))
          audit=json.loads((out/'SOURCE_AUDIT.json').read_text(encoding='utf-8'))
          if not audit['read_only'] or not audit['no_d1_write'] or not audit['no_worker_deploy']:
              raise SystemExit('R15115_WRONG_RESEARCH_MODE')
          if audit['source_target_verified']!='KRX_EXACT_DATE_WITH_TICKER_INDEX_PARITY':
              raise SystemExit('R15115_MISSING_KRX_PROOF')
          if audit['mode']=='FULL_MARKET' and audit['analyzed_symbols']<1700:
              raise SystemExit('R15115_INCOMPLETE_MARKET_STUDY')
          modified=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          others=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          outside=[p for p in others if not p.startswith('output/strategy_lab_r15115_fullmarket/')]
          if modified or outside:raise SystemExit(f'R15115_SOURCE_SCOPE_BLOCKED modified={modified} new={outside}')
          print('BLUE_R15115_ALL_RESEARCH_AUDITS_OK',audit['analyzed_symbols'],audit['total_events_including_baseline'])
          PY_AUDIT

      - name: Upload research CSV and audit only (no source changes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15115_FULL_MARKET_RESEARCH_${{ github.run_id }}
          path: output/strategy_lab_r15115_fullmarket/
          if-no-files-found: warn
          retention-days: 14
