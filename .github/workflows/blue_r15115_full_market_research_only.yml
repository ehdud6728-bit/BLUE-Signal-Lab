name: BLUE R1.5.10.15 Full Observed Market EOD Strategy Lab (READ ONLY)

on:
  workflow_dispatch:
    inputs:
      asof_date:
        description: 'Completed KRX EOD date YYYY-MM-DD, independently verified. Default 2026-11-13.'
        type: string
        required: true
        default: '2026-11-13'
      research_scope:
        description: 'FULL_MARKET analyzes all historically observed eligible numeric KRX codes; SMOKE_40 is a quick validation.'
        type: choice
        required: true
        default: FULL_MARKET
        options:
          - FULL_MARKET
          - SMOKE_40
      confirm_research_only:
        description: 'Explicitly type RESEARCH_ONLY. No production search, D1 writes, API deploy, orders or KIS calls.'
        type: string
        required: true
        default: RESEARCH_ONLY

permissions:
  contents: read

concurrency:
  group: blue-r15115-fullmarket-${{ inputs.asof_date }}
  cancel-in-progress: false

jobs:
  full_market_research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Guard exact repository, branch, supported date and research-only consent
        env:
          ASOF: ${{ inputs.asof_date }}
          SCOPE: ${{ inputs.research_scope }}
          APPROVAL: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$APPROVAL" = 'RESEARCH_ONLY'
          [[ "$ASOF" =~ ^202[56]-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$SCOPE" = FULL_MARKET || "$SCOPE" = SMOKE_40 ]]

      - name: Checkout existing research and verified KRX adapters
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify previous strategy and data-source files exist (no writes)
        run: |
          set -euo pipefail
          test -f research/strategy_lab_r15114/daily.py
          test -f scripts/supply_profile_r15110.py
          test -f scripts/market_scan.py
          test -f scripts/market_scan_r11.py

      - name: Restore SHA256-pinned independent research scripts to runner TEMP only
        env:
          BUNDLE_SHA256: '60f4b7428b438ed7d34e4a9198c399a7255b4a8210f592ee1d2653708ba2ad1e'
