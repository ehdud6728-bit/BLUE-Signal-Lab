      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned data research libraries
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'requests==2.32.5'

      - name: Test stop-menu no-lookahead trailing and t3 execution order
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15126" -p test_study.py -v

      - name: Calculate full-market eight-stop paired scenarios without production writes
        run: |
          python -B "$RUNNER_TEMP/r15126/study.py" \
            --input "$RUNNER_TEMP/r15126" \
            --output output/r15126_stop_menu

      - name: Verify output baseline population paired DBH and audit flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=Path('output/r15126_stop_menu')
          files=('EIGHT_STOP_TP_T3_SUMMARY.csv',
                 'ENV6_500EOK_EIGHT_STOP_COMMON_VALID.csv',
                 'ENV6_500EOK_EIGHT_STOP_CASES.csv',
                 'DBH_2026-05-21_EIGHT_STOP_CASES.csv',
                 'AUDIT.json', 'README_KO.md')
          if any(not (o/f).is_file() or (o/f).stat().st_size < 80 for f in files):
              raise SystemExit('R15126_MISSING_RESULT_FILE')
          a=json.loads((o/'AUDIT.json').read_text(encoding='utf-8'))
          if not (a['version'].startswith('R15126_') and a['read_only']
                  and a['no_d1_write'] and a['no_deploy']
                  and a['no_live_or_search_modification']
                  and a['r15121_population_identical']
                  and a['signal_rows'] == 63712
                  and a['state_rows'] == 190759
                  and a['paired_500eok_env6_rows'] > 80000
                  and a['paired_500eok_env6_all8_valid_events'] > 2500
                  and len(a['stop_modes']) == 8
                  and abs(a['dbh_anchor']['signal_peak_high_pct']-28.9149888143)<.02
                  and abs(a['dbh_anchor']['signal_final_pct']+11.1856823266)<.02):
              raise SystemExit('R15126_PINNED_POPULATION_OR_DBH_FAILURE')
          print('R15126_EIGHT_STOP_AND_TRAILING_CONFIRMED')
          PY

      - name: Upload isolated research artifact for 30 days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15126_EIGHT_STOP_${{ github.run_id }}
          path: output/r15126_stop_menu/
          if-no-files-found: error
          retention-days: 30
