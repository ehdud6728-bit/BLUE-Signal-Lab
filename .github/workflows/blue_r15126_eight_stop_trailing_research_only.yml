# R15126 RESEARCH ONLY — eight paired stops and NEXT-session trailing.
# Upload to .github/workflows/ as one new YAML; do not replace earlier jobs.
# No checkout, KIS/API live calls, deploy, D1 or other production writes.
name: BLUE R1.5.10.26 Eight Stop Trailing Research (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Enter RESEARCH_ONLY to run the isolated study.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blue-r15126-stop-menu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eight_stop_research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Require pinned main branch repository and research-only confirmation
        env:
          CONFIRM: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM" = 'RESEARCH_ONLY'
          echo 'R15126_READ_ONLY_GUARD_OK'

