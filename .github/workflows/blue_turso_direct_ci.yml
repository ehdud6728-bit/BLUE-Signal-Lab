name: BLUE Turso Direct KIS Safety Tests (NO SECRETS)

on:
  pull_request:
    paths:
      - 'collector/src/turso-direct.mjs'
      - 'collector/src/turso-mirror.mjs'
      - 'collector/test/turso-mirror.test.mjs'
      - 'collector/src/handler.mjs'
      - 'collector/turso-direct.test.mjs'
      - 'scripts/blue_kis_cutover_audit.py'
      - 'tests/test_blue_kis_cutover_audit.py'
      - '.github/workflows/blue_kis_cutover_audit.yml'
      - 'scripts/blue_kis_daily_token_r1597.py'
      - 'tests/test_blue_kis_daily_token_r1597.py'
      - '.github/workflows/blue_kis_daily_token_r1597.yml'
      - 'tools/turso/kis-token-steward.mjs'
      - 'tools/turso/kis-token-steward.test.mjs'
      - 'tools/turso/d1-token-backup.mjs'
      - 'tools/turso/d1-token-backup.test.mjs'
      - '.github/workflows/blue_turso_direct_ci.yml'
      - '.github/workflows/blue_turso_kis_token_steward.yml'
      - '.github/workflows/blue_turso_direct_quotes_pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install D1 token vault cryptography
        run: python -m pip install 'cryptography>=43,<48'
      - name: Test legacy D1 token vault and automatic renewal
        run: |
          python -m unittest discover -s tests -p 'test_blue_kis_token_vault_r131.py' -v
          python -m unittest discover -s tests -p 'test_blue_kis_daily_token_r1597.py' -v
          python -m unittest discover -s tests -p 'test_blue_kis_cutover_audit.py' -v
      - name: Install collector dependencies
        working-directory: collector
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Turso steward dependencies
        working-directory: tools/turso
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Test shared token vault, D1 fallback and collector safety
        run: node --test collector/turso-direct.test.mjs collector/test/turso-mirror.test.mjs tools/turso/kis-token-steward.test.mjs tools/turso/d1-token-backup.test.mjs
      - name: Bundle collector without deployment
        working-directory: collector
        run: npx wrangler deploy --dry-run --outdir ../.blue-turso-direct-test-build
