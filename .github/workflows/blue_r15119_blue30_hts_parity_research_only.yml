      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen analysis-only dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'pandas==2.3.3' 'matplotlib==3.10.7'

      - name: Test delayed lower-band calculation and point-in-time behavior
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15119_src" -p test_study.py -v

      - name: Render LNF HTS chart and verify 8-07 then 8-10 signal
        run: |
          python -B "$RUNNER_TEMP/r15119_src/study.py" \
            --input "$RUNNER_TEMP/r15119_src" \
            --output output/r15119_blue30_hts_parity

      - name: Audit key dates and prevent false parity claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out = Path('output/r15119_blue30_hts_parity')
          expected = ('AUDIT.json', 'README_KO.md',
                      'LNF_BLUE30_ACTUAL_CHART_PARITY.csv',
                      'LNF_BLUE30_DAILY_LINE_VALUES.csv',
                      'LNF_ENV6_BLUE30_LOWER_CHART.png')
          if any(not (out/x).is_file() or (out/x).stat().st_size < 40 for x in expected):
              raise SystemExit('MISSING_PARITY_OUTPUT')
          info=json.loads((out/'AUDIT.json').read_text(encoding='utf-8'))
          a=pd.read_csv(out/'LNF_BLUE30_ACTUAL_CHART_PARITY.csv')
          a=a.set_index('date')
          t7=a.loc['2026-08-07']
          t10=a.loc['2026-08-10']
          if not (info['read_only'] and info['no_d1_write'] and info['no_deploy']
                  and info['live_search_watch_unchanged']
                  and info['blue30_status'].startswith('VISUAL_AND_EVENT_DATE_ALIGNED')
                  and bool(t7.ENV6_CLOSE_CROSS) and not bool(t7.BLUE30_CLOSE_CROSS)
                  and bool(t10.BLUE30_BODY_CROSS_20PCT)
                  and abs(t10.BB30_26_LOWER_HTS_CANDIDATE - 96082.436)<0.1
                  and abs(t10.BB30_26_UPPER_LEGACY - 172390.897)<0.1):
              raise SystemExit('R15119_PARITY_AUDIT_FAILED')
          print('8/07_ENV6_AND_8/10_BLUE30_LOWER_REPRODUCED')
          PY

      - name: Upload study chart and independent audit (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15119_HTS_BLUE30_PARITY_${{ github.run_id }}
          path: output/r15119_blue30_hts_parity/
          if-no-files-found: warn
          retention-days: 30
