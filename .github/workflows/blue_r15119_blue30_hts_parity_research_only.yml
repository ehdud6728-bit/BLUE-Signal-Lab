# BLUE R1.5.10.19 HTS parity: upload only this file to .github/workflows/.
# Contains frozen independent 066970 daily EOD data, no expiring artifact dependency.
# The user's blue dotted settings are 30 / 2 / 26.
# Research only. LIVE, SEARCH, WATCH, D1 and deployment remain untouched.
name: BLUE R1.5.10.19 HTS Blue30 Lower Parity (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Type RESEARCH_ONLY. No production changes or orders.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: blue-r15119-hts-${{ github.ref }}
  cancel-in-progress: false

