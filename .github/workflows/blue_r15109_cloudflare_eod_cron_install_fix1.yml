      - name: Install offline chart-analysis test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.0,<3'
      - name: Test lossless D1 SQL for large JSON, Hangul and reimports
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_chart_sql_chunks_r15109.py' -v
          python -m unittest discover -s tests -p 'test_chart_research_r159.py' -v
      - name: Build web app TypeScript and Vite
        shell: bash
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Cloudflare API Worker deploy dry-run only
        working-directory: worker
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/blue-r15109-worker-check
      - name: Confirm restricted changed-file scope
        shell: bash
        run: |
          python - <<'PY_SCOPE'
          import subprocess
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed={'scripts/append_chart_sql_r10.py','worker/src/index.ts','worker/wrangler.jsonc',
                   'worker/src/eod-cron.ts','web/src/main.tsx','web/src/StockChart.tsx',
                   'tests/test_chart_sql_chunks_r15109.py'}
          assert modified|untracked==allowed,(modified,untracked,allowed)
          print('BLUE_R15109_SCOPE_OK',sorted(allowed))
          PY_SCOPE
      - name: Commit source patch if explicitly requested (never deploy)
        if: ${{ inputs.apply_changes == true }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/append_chart_sql_r10.py worker/src/index.ts worker/wrangler.jsonc worker/src/eod-cron.ts web/src/main.tsx web/src/StockChart.tsx tests/test_chart_sql_chunks_r15109.py
          git commit -m 'BLUE R1.5.10.9: lossless D1 EOD chart chunks and Cloudflare scheduled checks'
          git push origin HEAD:main
          echo BLUE_R15109_SOURCE_COMMITTED_NO_DEPLOY
      - name: Verify-only result
        if: ${{ inputs.apply_changes != true }}
        run: echo BLUE_R15109_VERIFIED_ONLY_NO_SOURCE_CHANGE_NO_DEPLOY
