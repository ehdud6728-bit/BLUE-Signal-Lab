name: BLUE R1.5.10.9 FIX1 Cloudflare Cron EOD + D1 Chart Chunk Fix (SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE checks only. TRUE commits source. No Cloudflare deploy or live D1 change.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r15109-install
  cancel-in-progress: false

jobs:
  source_only_install:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Guard target repository and main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'
      - name: Checkout latest BLUE main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ignore generated build caches in scope validation
        shell: bash
        run: |
          cat >> .git/info/exclude <<'GIT_EXCLUDES'
          **/node_modules/
          **/dist/
          **/build/
          **/__pycache__/
          **/*.pyc
          **/*.tsbuildinfo
          GIT_EXCLUDES
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
