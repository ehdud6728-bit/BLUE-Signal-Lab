    inputs:
      apply_changes:
        type: boolean
        required: true
        default: false
        description: 'FALSE validates only. TRUE commits reviewed additive research/UI changes to main.'

permissions:
  contents: write

concurrency:
  group: blue-r159-pattern-evidence
  cancel-in-progress: false

