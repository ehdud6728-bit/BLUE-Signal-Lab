      - name: Validate exact original anchors and apply additive patch
        run: |
          python scripts/blue_r159_apply.py --check
          python scripts/blue_r159_apply.py --apply
          python -m py_compile scripts/blue_r159_apply.py scripts/chart_research_r10.py scripts/csv_to_d1.py scripts/market_scan_r08_diagnostics.py
          python - <<'PYASSERT'
          from pathlib import Path
          s=Path('scripts/chart_research_r10.py').read_text()
          c=Path('web/src/StockChart.tsx').read_text()
          m=Path('web/src/main.tsx').read_text()
          assert all(x in s for x in ['MA112_CROSS','MA224_CROSS','MA_TO_UP','_case_examples'])
          assert all(x in c for x in ['r159-pattern-card','signal_day','ma112','ma224'])
          assert all(x in m for x in ['r159-ma-evidence.css','r159-prob-chip','ma112_cross'])
          print('R159_STATIC_ASSERT_PASS')
          PYASSERT
      - name: Install offline Python test requirements
        run: python -m pip install pandas numpy pyarrow requests 'pykrx==1.2.9' 'cryptography>=43,<48'
      - name: Full Python regression tests including new moving averages and dated evidence
        run: python -m unittest discover -s tests -v
      - name: Run existing AI basket regression tests
        run: node --test tests/test_basket_r15.mjs
      - name: Build React TypeScript frontend
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Verify no other tracked files were modified
        run: |
          python - <<'PYCHECK'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          approved={'scripts/market_scan_r08_diagnostics.py','scripts/chart_research_r10.py',
                    'scripts/csv_to_d1.py','web/src/StockChart.tsx','web/src/main.tsx'}
          assert changed==approved,f'R159_CHANGE_SCOPE_MISMATCH {sorted(changed)}'
          print('R159_SCOPE_OK',sorted(changed))
          PYCHECK
      - name: Commit verified changes only when approved
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/market_scan_r08_diagnostics.py scripts/chart_research_r10.py scripts/csv_to_d1.py web/src/StockChart.tsx web/src/main.tsx scripts/blue_r159_apply.py web/src/r159-ma-evidence.css tests/test_chart_research_r159.py
          if git diff --cached --quiet; then
            echo 'R159_ALREADY_INSTALLED'
          else
            git commit -m 'BLUE R1.5.9: MA event diagnostics, ranked patterns and dated evidence'
            git push origin HEAD:main
          fi
      - name: Next steps
        run: |
          echo 'R159_ALL_TESTS_PASS'
          echo 'If apply_changes=false, rerun with true after reviewing logs.'
          echo 'No KRX scan nor D1 import has happened in this workflow.'
          echo 'After successful commit: verify frontend deploy; run verified EOD date again with publish_to_d1=true to populate updated historical evidence.'
