name: BLUE Turso Web Read-Only Safety Tests (NO SECRETS)

on:
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/package*.json'
      - 'web/tsconfig*.json'
      - 'web/src/turso-research-reader.ts'
      - 'web/src/SmartBasket.tsx'
      - 'web/src/basket-rank.ts'
      - 'web/src/r157-ui.css'
      - 'web/src/r15116-basket-priority.css'
      - 'web/src/StopLossRow.tsx'
      - 'web/src/basket-supply-record.ts'
      - 'web/src/price-compare.ts'
      - 'worker/src/turso-eod.ts'
      - 'worker/src/turso-market-rotation.ts'
      - 'worker/src/turso-market-trends.ts'
      - 'tests/test_turso_market_trends.mjs'
      - 'tests/test_turso_market_rotation.mjs'
      - 'worker/src/index.ts'
      - 'worker/src/turso-research.ts'
      - 'worker/src/turso-research-request.ts'
      - 'worker/src/turso-provisional-search.ts'
      - 'worker/src/turso-research-request.ts'
      - 'tests/test_turso_provisional_search.mjs'
      - 'tests/test_turso_research_request.mjs'
      - 'web/src/TursoProvisionalToday.tsx'
      - 'web/src/turso-provisional-today.css'
      - 'tests/test_turso_research_api.mjs'
      - 'tests/test_turso_basket_prices.mjs'
      - 'tests/test_turso_research_reader.mjs'
      - 'tests/test_turso_research_request.mjs'
      - 'tests/test_turso_research_request_route.mjs'
      - 'tests/test_turso_basket_browser.mjs'
      - 'tests/test_basket_top_basis.mjs'
      - 'tests/test_basket_observed_low.mjs'
      - 'web/src/main.tsx'
      - 'web/src/research-gold-highlight.ts'
      - 'web/src/r-research-gold-outline.css'
      - 'tests/test_research_gold_highlight.mjs'
      - 'web/src/TursoAiReadiness.tsx'
      - 'web/src/TursoPatternPulse.tsx'
      - 'web/src/turso-pattern-pulse.css'
      - 'web/src/TursoExitStudy.tsx'
      - 'web/src/turso-exit-study.css'
      - 'web/src/turso-ai-readiness.css'
      - 'web/src/TursoResearchProgress.tsx'
      - 'web/src/turso-research-progress.ts'
      - 'web/src/turso-research-progress.css'
      - 'tests/test_turso_research_progress.mjs'
      - '.github/workflows/blue_turso_web_readonly_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline-test TypeScript dependencies
        working-directory: worker
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify Turso-first browser API read contracts (no credentials)
        run: node --experimental-strip-types --test tests/test_research_gold_highlight.mjs tests/test_turso_research_reader.mjs tests/test_turso_research_api.mjs tests/test_turso_research_request.mjs tests/test_turso_research_request_route.mjs tests/test_turso_research_progress.mjs tests/test_turso_basket_browser.mjs tests/test_turso_basket_prices.mjs tests/test_turso_provisional_search.mjs tests/test_turso_market_rotation.mjs tests/test_basket_top_basis.mjs tests/test_basket_observed_low.mjs
      - name: Install browser build dependencies
        working-directory: web
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck and bundle PWA (no deployment)
        working-directory: web
        run: npm run build
