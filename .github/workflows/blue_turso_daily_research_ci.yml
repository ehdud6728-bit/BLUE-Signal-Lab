name: BLUE Turso Research Auto Safety CI (NO SECRETS)

on:
  pull_request:
    paths:
      - '.github/workflows/blue_turso_daily_research.yml'
      - '.github/workflows/blue_turso_daily_research_ci.yml'
      - 'scripts/turso_research_day_guard.py'
      - 'tests/test_turso_daily_research_workflow.py'
      - '.github/workflows/blue_turso_daily_verified_eod_auto.yml'
      - 'scripts/turso_unified_day_guard.py'
      - 'tests/test_turso_unified_pipeline.py'
      - 'scripts/export_turso_signal_snapshot.py'
      - 'tests/test_turso_signal_snapshot_export.py'
      - 'tools/turso/signal-snapshot-import.mjs'
      - 'tools/turso/signal-snapshot-import.test.mjs'
      - 'tools/turso/krx-kis-fallback-collect.mjs'
      - 'tools/turso/krx-kis-fallback-collect.test.mjs'
      - 'collector/src/turso-provisional.mjs'
      - 'collector/src/turso-direct.mjs'
      - 'collector/package.json'
      - 'scripts/market_scan.py'
      - 'scripts/market_scan_r06.py'
      - 'scripts/market_scan_r08_diagnostics.py'
      - 'scripts/market_scan_r11.py'
      - 'scripts/daily_global_history_scope.py'
      - 'tests/test_daily_global_history_scope.py'
      - 'scripts/turso_history_replay_source.py'
      - 'scripts/turso_verified_eod_range.py'
      - 'tests/test_market_scan.py'
      - 'tests/test_market_scan_r11.py'
      - 'tests/test_turso_history_replay_source.py'
      - 'tests/test_turso_verified_eod_range.py'
      - '.github/workflows/blue_turso_history_research_batch.yml'
      - '.github/workflows/blue_turso_missing_history_backfill.yml'
      - 'scripts/turso_parallel_pattern_scan.py'
      - 'tests/test_turso_parallel_pattern_scan.py'
      - 'scripts/export_turso_indicator_snapshot.py'
      - 'tests/test_turso_all_indicators_export.py'
      - 'scripts/exit_policy_research.py'
      - 'tests/test_exit_policy_research.py'
      - 'tools/turso/indicator-snapshot-import.mjs'
      - 'tools/turso/indicator-snapshot-import.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify calendar, approval, default OFF and export provenance
        run: |
          python -m unittest discover -s tests -p 'test_turso_daily_research_workflow.py' -v
          python -m unittest discover -s tests -p 'test_turso_unified_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_turso_signal_snapshot_export.py' -v
          python -m unittest discover -s tests -p 'test_turso_all_indicators_export.py' -v
          python -m unittest discover -s tests -p 'test_exit_policy_research.py' -v
      - name: Verify unchanged full-market matching and KRX exact-day guards
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy pandas requests
          python -m unittest discover -s tests -p 'test_market_scan.py' -v
          python -m unittest discover -s tests -p 'test_market_scan_r11.py' -v
          python -m unittest discover -s tests -p 'test_daily_global_history_scope.py' -v
          python -m unittest discover -s tests -p 'test_turso_history_replay_source.py' -v
          python -m unittest discover -s tests -p 'test_turso_verified_eod_range.py' -v
          python -m unittest discover -s tests -p 'test_turso_parallel_pattern_scan.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only the isolated Turso client (without scripts)
        working-directory: tools/turso
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Test audited EOD prerequisite, exact close and immutable read-back
        run: node --test tools/turso/signal-snapshot-import.test.mjs tools/turso/indicator-snapshot-import.test.mjs
      - name: Install Collector runtime dependency (no scripts)
        working-directory: collector
        run: npm install --omit=dev --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Test production KIS fallback imports without secrets
        run: node --test tools/turso/krx-kis-fallback-collect.test.mjs
