      - name: Test actual approved source snapshots before patching
        run: |
          python -m unittest discover -s tests -p 'test_r1596_install.py' -v
      - name: Check and apply exact edits twice, protect scope
        shell: bash
        run: |
          set -euo pipefail
          python scripts/blue_r1596_install.py --check
          python scripts/blue_r1596_install.py --apply
          python scripts/blue_r1596_install.py --check
          python scripts/blue_r1596_install.py --apply
          python -m py_compile scripts/blue_r1596_install.py
          python - <<'PYGUARD'
          from pathlib import Path
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'web/src/search-priority.ts','web/src/main.tsx','web/src/PriceCompareMini.tsx','web/src/r1595-group-price.css','worker/src/search-quote-priority.ts','worker/src/price-compare.ts','web/src/price-compare.ts','collector/src/search-quote-priority.mjs'}
          assert changed==expected,('R1596_FIX2_SCOPE_MISMATCH',sorted(changed))
          assert 'type="button" className="r1596-inline-request"' in Path('web/src/PriceCompareMini.tsx').read_text()
          assert 'WAITING_TOKEN' in Path('collector/src/search-quote-priority.mjs').read_text()
          assert 'queryItems' in Path('worker/src/search-quote-priority.ts').read_text()
          print('R1596_FIX2_SCOPE_OK',sorted(changed))
          PYGUARD
      - name: Regression test authenticated queue, collector, and installer
        run: |
          python -m unittest discover -s tests -p 'test_r1596_install.py' -v
          node --experimental-strip-types --test tests/test_r1596_request.mjs
          node --test tests/test_r1596_collector.mjs
      - name: Preserve R1593, R1594, R1595 regressions
        run: |
          node --experimental-strip-types --test tests/test_r1593_compare.mjs
          node --experimental-strip-types --test tests/test_r1594_priority.mjs
          node --test tests/test_r1594_collector.mjs
          node --experimental-strip-types --test tests/test_basket_r15.mjs
          node --test tests/test_r1595_queue.mjs
          node --experimental-strip-types --test tests/test_r1595_grouping.mjs
      - name: Run full existing Python regression suite
        run: |
          python -m pip install pandas numpy pyarrow requests 'pykrx==1.2.9' 'cryptography>=43,<48'
          python -m unittest discover -s tests -v
      - name: Build complete React TypeScript frontend
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Compile-check API Worker without deploy
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r1596-api-build
      - name: Test and compile-check Cloudflare Collector without deploy
        working-directory: collector
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run build:check
      - name: Commit only with approval and all prior steps successful
        if: inputs.apply_changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/search-priority.ts web/src/main.tsx web/src/PriceCompareMini.tsx web/src/r1595-group-price.css worker/src/search-quote-priority.ts worker/src/price-compare.ts web/src/price-compare.ts collector/src/search-quote-priority.mjs \
            scripts/blue_r1596_install.py tests/test_r1596_install.py \
            tests/test_r1596_request.mjs tests/test_r1596_collector.mjs \
            tests/fixtures/r1596_sources/*.txt
          git diff --cached --quiet || {
            git commit -m 'BLUE R1.5.9.6: 413 mitigation, visible KIS queue diagnostics and price-inline refresh'
            git push origin HEAD:main
          }
      - name: State deployment boundary
        run: |
          echo 'R1596_FIX2_ALL_TESTS_PASS'
          echo 'No automatic deployment or KIS token issuance.'
          echo 'After approved commit: deploy API Worker, KIS Collector and frontend.'
