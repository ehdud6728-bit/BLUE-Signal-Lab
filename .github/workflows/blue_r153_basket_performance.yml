name: BLUE R1.5.3 Basket Performance + Bottom Navigation (MANUAL)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE = test and dry-run only. TRUE = commit reviewed files to main. Deployment is SEPARATE.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r153-basket-install
  cancel-in-progress: false
