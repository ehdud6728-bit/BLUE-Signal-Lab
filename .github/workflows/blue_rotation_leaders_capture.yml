name: BLUE Rotation Leaders Capture
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, inspect, apply]
        default: plan
        required: true
      refresh_trends:
        description: 'apply only: refresh dated industry history before candidate ranking to establish previous quadrant'
        type: boolean
        default: false
        required: true
  pull_request:
    paths:
      - 'collector/src/rotation-leaders*'
      - 'scripts/kis_sector_master.py'
      - 'tests/test_kis_sector_master.py'
      - '.github/workflows/blue_rotation_leaders_capture.yml'
permissions:
  contents: read
concurrency:
  group: blue-market-trends-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --prefix collector --no-package-lock --no-audit --no-fund
      - run: python -m unittest discover -s tests -p test_kis_sector_master.py
      - run: node --test collector/src/rotation-leaders.test.mjs
      - name: Refresh dated industry history (explicit apply only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply' && inputs.refresh_trends
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: node collector/src/market-trends.mjs apply
      - name: Download current official master (inspect/apply only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'plan'
        run: python scripts/kis_sector_master.py --output output/rotation/master.json
      - name: Analyze verified stock history
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          MODE: ${{ inputs.mode }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node collector/src/rotation-leaders.mjs "$MODE" output/rotation/master.json
