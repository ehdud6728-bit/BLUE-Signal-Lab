name: BLUE R1.5.7 Mobile Tracking and Basket Filters (MANUAL)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE=build/tests only. TRUE=commit reviewed R1.5.7 changes to main.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r157-mobile-basket
  cancel-in-progress: false
jobs:
  verify_and_optional_apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard BLUE repository and main branch
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'
