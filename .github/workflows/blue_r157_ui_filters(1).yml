      - name: Validate exact source anchors and patch approved files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/blue_r157_install.py --check
          python scripts/blue_r157_install.py --apply
          python - <<'PYVERIFY'
          from pathlib import Path
          basket=Path('web/src/SmartBasket.tsx').read_text()
          live=Path('web/src/LiveMarket.tsx').read_text()
          main=Path('web/src/main.tsx').read_text()
          core=Path('collector/src/core.mjs').read_text()
          assert 'R157_BASKET_FILTERS' in basket
          assert 'R157_AI_AUTO_ADD' in basket
          assert 'R157_MOBILE_PRICE' in live
          assert 'R157_UI_FILTERS' in main and "import './r157-ui.css'" in main
          assert 'R157_PREV_CLOSE' in core
          assert 'R1.5.7 prior-day return' in Path('collector/test/core.test.mjs').read_text()
          print('R157_REVIEWED_ANCHORS_PASS')
          PYVERIFY
      - name: Test KIS collector including optional previous-close percent
        shell: bash
        run: |
          set -euo pipefail
          node --check collector/src/core.mjs
          node --test collector/test/core.test.mjs
      - name: Build React TypeScript frontend
        working-directory: web
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Check API Worker (no live deployment)
        working-directory: worker
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r157-api-build
      - name: Check KIS Collector Worker (no live deployment)
        working-directory: collector
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r157-collector-build
      - name: Restrict modified files to reviewed R1.5.7 scope
        shell: bash
        run: |
          python - <<'PYDIFF'
          import subprocess
          allowed={
            'web/src/SmartBasket.tsx','web/src/LiveMarket.tsx','web/src/main.tsx',
            'collector/src/core.mjs','worker/src/live.ts','collector/test/core.test.mjs',
            'web/src/r157-ui.css','scripts/blue_r157_install.py',
          }
          # Build output is untracked; inspect only changed repo code and explicitly restored payloads.
          subprocess.run(['git','add','-N','scripts/blue_r157_install.py','web/src/r157-ui.css'],check=True)
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if not paths <= allowed:raise SystemExit('R157_UNEXPECTED_CHANGES '+repr(sorted(paths-allowed)))
          print('R157_CHANGED_FILES_OK',sorted(paths))
          PYDIFF
      - name: Commit reviewed UI and collection field when approved
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BLUE R1.5.7 Installer'
          git config user.email 'actions@users.noreply.github.com'
          git add web/src/SmartBasket.tsx web/src/LiveMarket.tsx web/src/main.tsx \
