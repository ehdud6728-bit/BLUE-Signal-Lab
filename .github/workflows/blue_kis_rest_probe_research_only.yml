name: "BLUE R1.2 KIS REST Probe (DISABLED - token-safety guard)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy_probe_disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent accidental repeated KIS access-token issuance
        run: |
          echo 'R1.2 legacy probe is disabled to prevent fresh token issuance.'
          echo 'Use BLUE R1.3.1 safe-token vault workflow (allow_new_token=false by default).'
