name: BLUE R1.5.9.8 KIS Auto Token Steward (24h SAFE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = metadata only. issue = reserve one KIS token issuance only if needed.'
        required: true
        type: choice
        options: [check, issue]
        default: check
      enable_issuance:
        description: 'TRUE explicitly authorizes one guarded tokenP attempt. Leave FALSE for diagnostics.'
        required: true
        type: boolean
        default: false
  # 21:00 UTC = 06:00 KST (every day); 06:30 is a recovery check.
  # Weekdays continue every 30 minutes through 19:30 KST.
  # Retries only after a failed attempt, at most once after 30 minutes.
  schedule:
    - cron: '0,30 21 * * *'
    - cron: '0,30 22,23 * * 0-4'
    - cron: '0,30 0-10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: blue-kis-token-vault-single-session
  cancel-in-progress: false

jobs:
  token_steward:
    # Automatically run on schedule. Emergency stop: set repo variable
    # BLUE_KIS_TOKEN_AUTO_PAUSED=true. No activation variable is required.
    # The D1 atomic ledger, rolling 24h and KST-day guards prevent duplicate
    # tokenP attempts even when GitHub cron triggers many times per day.
    if: github.event_name != 'schedule' || vars.BLUE_KIS_TOKEN_AUTO_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Guard fixed repository
        run: test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encrypted vault dependency
        run: python -m pip install 'cryptography>=43,<48'
      - name: Test token safety and original vault invariants BEFORE network
        run: |
          python -m unittest discover -s tests -p 'test_blue_kis_token_vault_r131.py' -v
          python -m unittest discover -s tests -p 'test_blue_kis_daily_token_r1597.py' -v
      - name: Check metadata or guarded issuance (no order endpoints)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          BLUE_KIS_TOKEN_AUTO_PAUSED: ${{ vars.BLUE_KIS_TOKEN_AUTO_PAUSED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODE: ${{ github.event_name == 'schedule' && 'issue' || inputs.mode }}
          # Scheduled refresh is authorized by default; manual dispatch still
          # needs its explicit enable_issuance input for a tokenP attempt.
          ALLOW_ISSUE: ${{ github.event_name == 'schedule' && 'true' || inputs.enable_issuance }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KIS_APP_KEY" && test -n "$KIS_APP_SECRET"
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [[ "$MODE" == 'issue' && "$ALLOW_ISSUE" == 'true' ]]; then
            if [[ "$BLUE_KIS_TOKEN_AUTO_PAUSED" == 'true' ]]; then
              echo 'D1_ISSUE_BLOCKED: legacy issuer paused for Turso cutover'; exit 2
            fi
            if [[ "${{ github.event_name }}" == 'schedule' ]]; then
              python scripts/blue_kis_daily_token_r1597.py --mode issue --scheduled
            else
              python scripts/blue_kis_daily_token_r1597.py --mode issue
            fi
          else
            python scripts/blue_kis_daily_token_r1597.py --mode check
          fi
