      - name: Apply reviewed frontend patch only
        run: |
          python scripts/blue_r1591_apply.py --check
          python scripts/blue_r1591_apply.py --apply
          python -m py_compile scripts/blue_r1591_apply.py
          python - <<'PYCHECK'
          from pathlib import Path
          m=Path('web/src/main.tsx').read_text()
          b=Path('web/src/SmartBasket.tsx').read_text()
          assert all(x in m for x in ['techBadges(r)','r1591-search-tech','r1591-mobile-tech'])
          assert all(x in b for x in ['patternEvidence','patternUp10d','r1591-basket-tomato','/api/search'])
          assert 'r1591-evidence-basket.css' in m
          print('R1591_STATIC_OK')
          PYCHECK
      - name: Run three local installer regressions
        run: python -m unittest discover -s tests -p 'test_r1591_installer.py' -v
      - name: Install repository Python test dependencies
        run: python -m pip install pandas numpy pyarrow requests 'pykrx==1.2.9' 'cryptography>=43,<48'
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Run basket API regression suite
        run: node --test tests/test_basket_r15.mjs
      - name: Build React TypeScript frontend
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Confirm exact changed-file scope and no backend modifications
        run: |
          python - <<'PYSCOPE'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'web/src/main.tsx','web/src/SmartBasket.tsx'}
          assert changed==expected,f'R1591_UNEXPECTED_MODIFICATIONS {sorted(changed)}'
          # npm ci/build and Python unittest may create build/cache files; verify only
          # reviewed persistent source, and reject any new Worker/collector changes.
          new_src={'scripts/blue_r1591_apply.py','web/src/r1591-evidence-basket.css','tests/test_r1591_installer.py'}
          assert all(__import__('pathlib').Path(x).is_file() for x in new_src),'R1591_MISSING_NEW_SOURCE'
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          sensitive={x for x in untracked if x.startswith(('worker/','collector/','.github/workflows/'))}
          assert not sensitive,f'R1591_SENSITIVE_UNTRACKED {sorted(sensitive)}'
          print('R1591_SCOPE_OK',sorted(changed),sorted(new_src))
          PYSCOPE
      - name: Commit tested frontend changes only if explicitly approved
        if: ${{ inputs.apply_changes }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/main.tsx web/src/SmartBasket.tsx web/src/r1591-evidence-basket.css scripts/blue_r1591_apply.py tests/test_r1591_installer.py
          if git diff --cached --quiet; then
            echo 'R1591_ALREADY_APPLIED'
          else
            git commit -m 'BLUE R1.5.9.1: search MA badges and persistent basket evidence highlight'
            git push origin HEAD:main
          fi
      - name: Result
        run: |
          echo 'R1591_ALL_TESTS_PASS'
          echo 'If apply_changes=false, rerun with true to commit.'
          echo 'Frontend deployment required; no API Worker or KIS collector update.'
