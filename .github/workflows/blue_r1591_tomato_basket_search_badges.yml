name: BLUE R1.5.9.1 Basket Tomato and Search MA Badges (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        type: boolean
        required: true
        default: false
        description: 'FALSE tests only. TRUE commits reviewed search/basket UI changes after successful tests.'

permissions:
  contents: write

concurrency:
  group: blue-r1591-tomato-basket
  cancel-in-progress: false

