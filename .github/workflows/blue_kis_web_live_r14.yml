name: BLUE R1.4.1 KIS Market 08-20 (CACHE ONLY READ ONLY)

on:
  workflow_dispatch:
    inputs:
      candidate_limit:
        description: 'Number of prior KRX EOD candidates, 1-20 (default 12)'
        type: string
        required: true
        default: '12'
      dry_run:
        description: 'TRUE checks code without D1 or KIS calls. FALSE collects during active market only.'
        type: boolean
        required: true
        default: true
  # UTC 23:00-23:55 on Sun-Thu = Mon-Fri KST 08:00-08:55
  # UTC 00:00-10:55 Mon-Fri = KST 09:00-19:55
  # Market-specific windows and weekends additionally gated in Python.
  # GitHub scheduled jobs may start late or not start; no exact 5min guarantee.
  schedule:
    - cron: '*/5 23 * * 0-4'
    - cron: '*/5 0-10 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  # Shared lock with R1.3 vault writer; no concurrent cache refresh on this group.
  group: blue-kis-token-vault-single-session
  cancel-in-progress: false

jobs:
  collect_market_snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Guard repo
        shell: bash
        run: test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption library
        run: python -m pip install 'cryptography>=43,<48'
      - name: Offline R1.4.1 tests
        run: python -m unittest discover -s tests -p test_blue_kis_web_live_r141.py -v
      - name: Collect KRX / NXT quote snapshots with existing cached KIS token only
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_LIMIT: ${{ github.event_name == 'schedule' && '12' || inputs.candidate_limit }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        shell: bash
        run: |
          args=(--limit "$CANDIDATE_LIMIT" --out output/kis_r141)
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          python scripts/blue_kis_web_live_r141.py "${args[@]}"
      - name: Upload audit only (no tokens, no raw API bodies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_KIS_R141_${{ github.run_id }}
          path: output/kis_r141/AUDIT.json
          if-no-files-found: warn
          retention-days: 7
