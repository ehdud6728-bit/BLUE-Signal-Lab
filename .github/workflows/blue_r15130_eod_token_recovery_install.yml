      - name: Install token test dependency
        shell: bash
        run: python -m pip install 'cryptography>=43,<48'
      - name: Validate 24-hour and one-per-day token safety
        shell: bash
        run: python -m unittest discover -s tests -p 'test_blue_kis_daily_token_r1597.py' -v
      - name: Install frontend dependencies and compile
        working-directory: web
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
          npm run build
      - name: Compile Cloudflare Worker without deploying
        working-directory: worker
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
          npx wrangler deploy --dry-run --outdir /tmp/blue-r15130-worker-check
      - name: Show exact source scope before optional commit
        shell: bash
        run: |
          git diff --stat -- web/src/main.tsx worker/src/eod-cron.ts worker/src/index.ts
          git diff --check
      - name: Commit only the three reviewed source files
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/src/main.tsx worker/src/eod-cron.ts worker/src/index.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'BLUE R1.5.10.30: recover verified EOD search and retries'
          git push origin HEAD:main
      - name: Summary and production deployment boundary
        shell: bash
        run: |
          if [ '${{ inputs.apply_changes }}' = true ]; then
            echo 'BLUE_R15130_SOURCE_COMMITTED. No Cloudflare deploy was performed.'
            echo 'Next: manually run blue_kis_r14_deploy_api.yml then blue_web_r15110_static_safe_deploy.yml.'
            echo 'KIS automated renewal: in GitHub Settings > Secrets and variables > Actions > Variables, set BLUE_KIS_TOKEN_AUTO_ENABLED=true.'
          else
            echo 'BLUE_R15130_CHECK_ONLY. No repository commit, Cloudflare deploy or D1 modification.'
          fi
