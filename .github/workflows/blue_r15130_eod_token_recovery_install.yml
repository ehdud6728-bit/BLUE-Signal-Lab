name: BLUE R1.5.10.30 EOD + KIS Token Recovery (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE = validate only. TRUE = commit 4 verified source files to main. Does NOT deploy.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r15130-eod-token-safe-install
  cancel-in-progress: false

jobs:
  validate_and_optionally_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard exact repository and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
