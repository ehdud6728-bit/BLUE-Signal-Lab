      - name: Apply exact source-scoped patch to runner only
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/blue_r15102_patch.py
          python - <<'PYVERIFY'
          from pathlib import Path
          import subprocess
          main=Path('web/src/main.tsx').read_text(encoding='utf-8')
          css=Path('web/src/r1599-pattern-filters.css').read_text(encoding='utf-8')
          assert main.count('className="gc-filter-panel r15102-unified-filter"')==1
          assert main.count('className="r15102-tomato-inline"')==1
          assert main.count('id="r1599-pattern"')==1
          assert main.count('/> 해당 종목만 보기</label>')==1
          assert main.count('patternHighlightMin={highlightMin}')==1
          assert not any(v in main for v in ['className="r15101-analysis-filters"','className="r15101-tomato-panel"'])
          assert 'r15101-analysis-filters' not in css
          assert 'r15101-tomato-panel' not in css
          assert 'r15102-tomato-inline' in css
          assert main.count('className="r1599-filters"')==1
          assert main.count('id="r1599-amount"')==1
          assert 'const effectiveOnlyPattern=patternOverride?.enabled??onlyPattern;' in main
          assert 'if(total!==null)void search(1,false,gcFields,gcLogic,undefined,{enabled:checked});' in main
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'web/src/main.tsx','web/src/r1599-pattern-filters.css'},('R15102_SCOPE',sorted(changed))
          print('BLUE_R15102_UI_AND_SCOPE_PASS')
          PYVERIFY
          git diff --check
      - name: Compile React TypeScript and production Vite bundle
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          echo 'BLUE_R15102_WEB_BUILD_PASS'
      - name: Enforce source-only changes after build
        shell: bash
        run: |
          set -euo pipefail
          cat >> .git/info/exclude <<'ENDIGNORE'
          /web/node_modules/
          /web/dist/
          *.tsbuildinfo
          __pycache__/
          *.pyc
          ENDIGNORE
