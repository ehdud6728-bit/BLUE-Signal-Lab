name: BLUE R1.5.10.2 Compact Tomato Inside Golden Cross (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE = validate only; TRUE = commit compact UI only after tests pass. No deployment.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r15102-unified-gc-tomato
  cancel-in-progress: false

