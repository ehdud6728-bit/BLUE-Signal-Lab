name: BLUE R1.5.10.17 EOD ENV20 BLUE20-40 Fixed Stops (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Enter RESEARCH_ONLY exactly. Historical-only EOD study; no live DB/orders/deploy.'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: blue-r15117-env-blue-stop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  env_blue_stop_research:
    name: pinned_amount_env_blue_candles_and_stop_study
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Explicit repository and research-only authorization guard
        env:
          APPROVAL: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$APPROVAL" = 'RESEARCH_ONLY'
          echo 'R15117_RESEARCH_ONLY_GUARD_OK'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frozen R1.5.10.15 full-market source artifact
