          import os, tarfile
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'r15117_source.tar.gz'
          out = Path(os.environ['RUNNER_TEMP']) / 'blue_r15117_src'
          out.mkdir()
          with tarfile.open(path, 'r:gz') as archive:
              members = archive.getmembers()
              if {m.name for m in members} != {'research.py', 'test_research.py'} or not all(m.isfile() for m in members):
                  raise SystemExit('R15117_UNEXPECTED_SOURCE_BUNDLE')
              for entry in members:
                  (out / entry.name).write_bytes(archive.extractfile(entry).read())
          print('R15117_SOURCE_RESTORED_AND_SHA_VERIFIED')
          PY_RESTORE

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'matplotlib==3.10.7' 'requests==2.32.5'

      - name: Test data leakage, exact indicators, fixed stop and gap fills
        run: |
          set -euo pipefail
          python -B -m unittest discover -s "$RUNNER_TEMP/blue_r15117_src" -p 'test_research.py' -v

      - name: Recompute actual 2023-2026 daily candles for each EOD turnover event
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/blue_r15117_src/research.py" \
            --input "$RUNNER_TEMP/blue_r15117_input" \
            --output output/r15117_env_blue_fixed_stop

      - name: Refuse incomplete or unverified LNF stop reports
        run: |
          python - <<'PY_VERIFY'
          import json
          from pathlib import Path
          out = Path('output/r15117_env_blue_fixed_stop')
          expected = ('event_confluence_10d.csv', 'fixed_stop_paths_5_10_20d.csv',
                      'train_holdout_group_summary.csv', 'LNFCases_2026.csv',
                      'LNF_2026-08-07_CANDLE_ENV_BLUE_STOPS.png',
                      'LNF_2026-10-13_CANDLE_ENV_BLUE_STOPS.png',
                      'AUDIT.json', 'SOURCE_HASHES.json', 'README_KO.txt')
          if any(not (out / f).is_file() or (out / f).stat().st_size < 100 for f in expected):
              raise SystemExit('R15117_REQUIRED_RESULTS_MISSING')
          audit = json.loads((out / 'AUDIT.json').read_text(encoding='utf-8'))
          p = audit['source_parity']
          if not (p['reconstructed_events'] >= 0.96*p['source_amount_events']
                  and p['drift_count'] <= max(2, p['10d_outcome_checked']*.002)
                  and audit['LNF_cases_found'] == ['2026-08-07','2026-10-13']
                  and audit['read_only'] and audit['no_d1_write'] and audit['no_deploy']):
              raise SystemExit('R15117_UNVERIFIED_OR_MUTATING_RESEARCH')
          print('R15117_SOURCE_AND_CASE_PARITY_OK', p['reconstructed_events'])
          PY_VERIFY

      - name: Publish research-only result files (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15117_ENV_BLUE_STOPS_${{ github.run_id }}
          path: output/r15117_env_blue_fixed_stop/
          if-no-files-found: warn
          retention-days: 14

