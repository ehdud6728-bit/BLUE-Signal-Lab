      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned analysis-only Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'requests==2.32.5'

      - name: Run six no-lookahead and stop-entry correctness tests
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15120_src" -p test_study.py -v

      - name: Reproduce real LNF 8-07 ENV6 and 8-10 BLUE30 before backtest
        run: |
          python -B "$RUNNER_TEMP/r15120_src/study.py" \
            --input "$RUNNER_TEMP/r15120_src" \
            --output output/r15120_env_blue_followup \
            --anchor-only

      - name: Sweep true ENV crosses and NEXT 1-3 day BLUE30 confirmations
        run: |
          python -B "$RUNNER_TEMP/r15120_src/study.py" \
            --input "$RUNNER_TEMP/r15120_src" \
            --output output/r15120_env_blue_followup

      - name: Check completed output and immutable strategy boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p = Path('output/r15120_env_blue_followup')
          names = ('AUDIT.json', 'README_KO.md', 'ENV4_6_8_10_BLUE30_EVENT_LEVEL.csv',
                   'TRAIN_2023_25_VS_2026_COMPARISON.csv',
                   'LNF_2026_08_07_PARITY_FOLLOWUP.csv')
          if any(not (p/n).is_file() or (p/n).stat().st_size < 80 for n in names):
              raise SystemExit('MISSING_R15120_RESULTS')
          a=json.loads((p/'AUDIT.json').read_text(encoding='utf-8'))
          d=pd.read_csv(p/'LNF_2026_08_07_PARITY_FOLLOWUP.csv')
          r=d[d.env_pct.eq(6)]
          if not (a['read_only'] and a['no_d1_write'] and a['no_deploy']
                  and a['live_search_watch_unchanged']
                  and a['audited_source_match']['matched_frozen_500eok_events'] == 9253
                  and len(r) == 1 and r.blue_confirm_date.iloc[0] == '2026-08-10'
                  and r.blue_confirm_offset.iloc[0] == 1):
              raise SystemExit('R15120_CRITICAL_AUDIT_FAILED')
          print('R15120_FOUR_THRESHOLDS_AND_LNF_FOLLOWUP_VERIFIED')
          PY

      - name: Upload independent research outputs (30 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15120_ENV4_6_8_10_BLUE30_FOLLOWUP_${{ github.run_id }}
          path: output/r15120_env_blue_followup/
          if-no-files-found: error
          retention-days: 30
