# BLUE R1.5.10.20: upload only this YML into .github/workflows/.
# Requires explicit RESEARCH_ONLY confirmation; does not touch app, D1 or deploy.
# Includes SHA256-verified R15117 events projection; NO expiring Actions artifacts.
# Historical 2023-26 full EOD price files must retain prior SHA256; fail on revision.
# BLUE30 lower(30,2,26) is screenshot-aligned, NOT HTS source-formula verified.
name: BLUE R1.5.10.20 ENV4-10 BLUE30 Followup (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Type RESEARCH_ONLY. Historical EOD comparisons only.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: blue-r15120-env-sweep-${{ github.ref }}
  cancel-in-progress: false

