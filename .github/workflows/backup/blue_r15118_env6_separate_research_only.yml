          import os, tarfile
          from pathlib import Path
          src = Path(os.environ['RUNNER_TEMP']) / 'r15118_study_source.tar.gz'
          dst = Path(os.environ['RUNNER_TEMP']) / 'blue_r15118_src'
          dst.mkdir()
          with tarfile.open(src, 'r:gz') as f:
              members = f.getmembers()
              if {x.name for x in members} != {'study.py', 'test_study.py'} or not all(x.isfile() for x in members):
