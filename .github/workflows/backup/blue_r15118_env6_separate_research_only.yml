          PY_RESTORE

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frozen R15117 historical EOD findings
        uses: actions/download-artifact@v4
        with:
          name: BLUE_R15117_ENV_BLUE_STOPS_43693923830
          repository: ehdud6728-bit/BLUE-Signal-Lab
          run-id: 43693923830
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blue_r15118_input

      - name: Install pinned read-only analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'pandas==2.3.3' 'matplotlib==3.10.7'

      - name: Run classifier unit tests
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/blue_r15118_src" -p test_study.py -v

      - name: Compute independent ENV(20,6%) cohorts and actual LNF case
        run: |
          python -B "$RUNNER_TEMP/blue_r15118_src/study.py" \
            --input "$RUNNER_TEMP/blue_r15118_input" \
            --output output/r15118_env6_separate

      - name: Verify indicators are clearly distinguished from BLUE30 proxy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p = Path('output/r15118_env6_separate')
          expected = ['event_level_ENV6_500eok.csv',
                      'train_holdout_ENV6_summary.csv',
                      'LNF_2026_08_07_ENV6_vs_BLUE30_audit.csv',
                      'LNF_2026_08_07_ENV6_CHART.png', 'README_KO.txt', 'AUDIT.json']
          if any(not (p/x).is_file() or (p/x).stat().st_size < 50 for x in expected):
              raise SystemExit('R15118_MISSING_REPORT')
          info = json.loads((p/'AUDIT.json').read_text())
          case = pd.read_csv(p/'LNF_2026_08_07_ENV6_vs_BLUE30_audit.csv').iloc[0]
          if not (info['read_only'] and info['no_d1_write'] and info['no_deploy']
                  and info['live_search_watch_unchanged']
                  and info['env_upper_percent'] == 6.0
                  and info['BLUE_signal_parity'].startswith('UNVERIFIED:')
                  and case['env6_true_close_cross']
                  and not case['upstream_blue30_model_touched']):
              raise SystemExit('R15118_UNVERIFIED_SIGNALS')
          print('R15118_ENV6_TRUE_CROSS_BLUE30_MODEL_DISCREPANCY_OK')
          PY

      - name: Upload read-only research result ZIP (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15118_ENV6_SEPARATE_${{ github.run_id }}
          path: output/r15118_env6_separate/
          if-no-files-found: warn
          retention-days: 14
