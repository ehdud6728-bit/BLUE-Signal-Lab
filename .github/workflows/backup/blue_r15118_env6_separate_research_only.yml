# Standalone upload: GitHub -> .github/workflows/ -> Add file -> Upload files.
# Run from Actions with confirm_research_only=RESEARCH_ONLY.
# R15118 intentionally leaves production app and earlier strategy lab intact.
name: BLUE R1.5.10.18 ENV6 Separate EOD Study (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Type RESEARCH_ONLY. Historical reports only; no live app or orders.'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: blue-r15118-env6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  env6_separate_study:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce independent research-only operation
        env:
          CONFIRM: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$CONFIRM" = 'RESEARCH_ONLY'
          echo 'R15118_NO_LIVE_NO_SEARCH_NO_WATCH_NO_DEPLOY'

