          out=Path('output/r15116_frozen_research')
          files={'same_date_market_baseline.csv','fixed_feature_bins_10d.csv',
                 'train_holdout_candidates.csv','year_market_10d.csv',
                 'AUDIT.json','README.txt'}
          if not all((out/x).is_file() and (out/x).stat().st_size>0 for x in files):
              raise SystemExit('BLUE_R15116_RESULTS_MISSING')
          audit=json.loads((out/'AUDIT.json').read_text(encoding='utf-8'))
          if not all((audit['source_artifact_run_id']==43602094227,
                      audit['source_events']==124418,
                      audit['source_analyzed_symbols']==2789,
                      audit['source_integrity_verified'],
                      audit['lookahead_guard_passed'],
                      audit['read_only'],audit['no_d1_write'],audit['no_worker_deploy'],
                      audit['prospectively_validated'] is False,
                      audit['calibrated_prediction_probability'] is False,
                      audit['breakout_vs_pullback_separable'] is False)):
              raise SystemExit('BLUE_R15116_UNSAFE_OR_UNSUPPORTED_RESEARCH_CLAIM')
          if audit['same_date_market_match_counts']['10']['matched_signal_events']<1000:
              raise SystemExit('BLUE_R15116_UNEXPECTED_MATCHED_COVERAGE')
          print('BLUE_R15116_INDEPENDENT_RESEARCH_AUDIT_OK',
                audit['source_events'],audit['same_date_market_match_counts']['10'])
          PY_AUDIT

      - name: Upload research-only results, 14-day retention
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15116_TRAIN_HOLDOUT_${{ github.run_id }}
          path: output/r15116_frozen_research/
          if-no-files-found: warn
          retention-days: 14
