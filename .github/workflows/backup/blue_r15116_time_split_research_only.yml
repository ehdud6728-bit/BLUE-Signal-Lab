          PY_RESTORE

      - name: Install pinned offline data-analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pandas==2.3.3' 'numpy==2.4.6'

      - name: Test fixed feature bins, matching restrictions and outcome guards
        run: |
          set -euo pipefail
          python -B -m unittest discover -s "$RUNNER_TEMP/blue_r15116" -p 'test_research.py' -v

      - name: Analyze pinned full-market events without fetching prices or modifying apps
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/blue_r15116/research.py" \
            --data-dir "$RUNNER_TEMP/blue_r15116_input" \
            --out output/r15116_frozen_research

