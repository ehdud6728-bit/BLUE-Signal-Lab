name: BLUE R1.5.10.16 Time-Split Strategy & Supply Audit (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Type RESEARCH_ONLY exactly. Frozen R1.5.10.15 FULL_MARKET artifact. NO D1 / deployment.'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: blue-r15116-frozen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen_strategy_research:
    name: source_pinned_time_split_audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Strict repository, branch, workflow and research-only guard
        env:
          APPROVAL: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$APPROVAL" = 'RESEARCH_ONLY'
          echo 'BLUE_R15116_RESEARCH_ONLY_GUARD_OK'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download exactly the approved R1.5.10.15 FULL_MARKET artifact (read only)
