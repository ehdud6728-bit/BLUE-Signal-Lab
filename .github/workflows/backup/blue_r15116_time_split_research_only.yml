          name: BLUE_R15115_VERIFIED_EOD_43602094227
          repository: ehdud6728-bit/BLUE-Signal-Lab
          run-id: 43602094227
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blue_r15116_input

