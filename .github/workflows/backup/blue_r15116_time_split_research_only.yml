          out=Path(os.environ['RUNNER_TEMP'])/'blue_r15116'
          out.mkdir(exist_ok=False)
          with tarfile.open(src,'r:gz') as archive:
              members=archive.getmembers()
              if {m.name for m in members}!={'research.py','test_research.py'} or not all(m.isfile() for m in members):
