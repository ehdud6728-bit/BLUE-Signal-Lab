name: BLUE Turso EOD Historical Coverage (READ ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Turso client
        working-directory: tools/turso
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Verify read-only coverage calculator
        run: node --test tools/turso/eod-history-coverage.test.mjs
      - name: Inspect existing audited sessions (Turso only; no writes)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node tools/turso/eod-history-coverage.mjs
