      - name: Validate exact basket source anchors before patching
        run: python "$RUNNER_TEMP/blue_r15113/patcher.py" --bundle "$RUNNER_TEMP/blue_r15113"

      - name: Apply changes only to temporary CI checkout
        run: python "$RUNNER_TEMP/blue_r15113/patcher.py" --bundle "$RUNNER_TEMP/blue_r15113" --apply

      - name: Parse new TypeScript and React modules
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          node - <<'JS'
          const ts=require('typescript'),fs=require('fs');
          for(const file of ['src/basket-supply-record.ts','src/BasketSupplyRecordRow.tsx']){
            const out=ts.transpileModule(fs.readFileSync(file,'utf8'),{fileName:file,reportDiagnostics:true,compilerOptions:{jsx:ts.JsxEmit.ReactJSX,module:ts.ModuleKind.ESNext}});
            if((out.diagnostics||[]).some(x=>x.category===ts.DiagnosticCategory.Error))process.exit(1);
            console.log('BLUE_R15113_TS_PARSE_OK',file);
          }
          JS

      - name: Build TypeScript React PWA including basket and existing app
        working-directory: web
        run: npm run build

      - name: Validate exact changed file scope
        run: |
          python - <<'PY_SCOPE'
          import subprocess
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          new=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          expected={'web/src/SmartBasket.tsx','web/src/basket-supply-record.ts',
                    'web/src/BasketSupplyRecordRow.tsx','web/src/basket-supply-record.css'}
          if modified|new!=expected:raise SystemExit(f'UNEXPECTED_SOURCE_SCOPE modified={modified} new={new}')
          print('BLUE_R15113_SCOPE_OK',sorted(expected))
          PY_SCOPE

      - name: Commit source only when explicitly approved (no Cloudflare/D1 writes)
        if: ${{ inputs.apply_changes }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/src/SmartBasket.tsx web/src/basket-supply-record.ts web/src/BasketSupplyRecordRow.tsx web/src/basket-supply-record.css
          git commit -m 'BLUE R1.5.10.13: freeze basket as-of supply evidence and expandable memo'
          git push origin HEAD:main
          echo 'BLUE_R15113_SOURCE_COMMITTED_NO_DEPLOY_NO_D1_WRITE'

      - name: Verify-only result
        if: ${{ !inputs.apply_changes }}
        run: |
          echo 'BLUE_R15113_VERIFIED_ONLY: no source commit, no Cloudflare deploy, no D1 writes'
