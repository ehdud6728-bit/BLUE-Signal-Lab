name: BLUE R1.5.10.13 Basket Supply Snapshot & Memo (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE: check, build and test only. TRUE: commit source. Never deploy or write to D1.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r15113-basket-supply-install
  cancel-in-progress: false

jobs:
  source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard exact repository and main branch
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ignore temporary Python caches and web build files for scope checks
