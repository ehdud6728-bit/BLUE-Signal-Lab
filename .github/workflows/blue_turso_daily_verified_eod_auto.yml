name: BLUE Turso Daily EOD + Research (NO D1)

on:
  # One daily run at 13:20 UTC = 22:20 KST, after same-day full KRX EOD is available.
  # Research runs after audited EOD only when explicitly opted in. No duplicate cron.
  schedule:
    - cron: '20 13 * * 1-5'
  workflow_dispatch:
    inputs:
      trade_day:
        description: 'Exact KST trading day YYYY-MM-DD; blank means KST today.'
        type: string
        required: false
        default: ''
      mode:
        description: 'dry_run verifies both sources; apply stores EOD and pattern snapshots in Turso.'
        type: choice
        required: true
        default: dry_run
        options:
          - dry_run
          - apply
      confirm_write:
        description: 'For manual apply, enter blue-turso-eod-research'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: blue-turso-eod-research-writer
  cancel-in-progress: false

jobs:
  daily_eod:
    # Scheduled runs apply only VERIFIED EOD. Manual runs are safe by default.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      INPUT_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.trade_day || '' }}
      MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
      INPUT_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_write || '' }}
      AUTO_RESEARCH_ENABLED: ${{ vars.BLUE_TURSO_RESEARCH_AUTO_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository, KST date and manual write confirmation
        run: python3 scripts/turso_unified_day_guard.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX exact-day data validation dependencies
        run: python -m pip install pandas numpy pyarrow requests 'cryptography>=43,<48' 'pykrx==1.2.9'
      - name: Validate exact-day source logic before collection
        run: python -m unittest discover -s tests -p 'test_turso_verified_eod_range.py' -v
      - name: Fetch one exact KRX trading day and validate market coverage
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
          KRX_DATA_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_DATA_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        run: |
          python scripts/turso_verified_eod_range.py \
            --start "$TRADE_DAY" --end "$TRADE_DAY" --provider auto \
            --out output/turso_daily_eod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Turso importer
        working-directory: tools/turso
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Test strict idempotent Turso writer
        run: node --test tools/turso/eod-range-import.test.mjs
      - name: Validate manifest and daily source hashes without DB access
        run: node tools/turso/eod-range-import.mjs --mode=dry_run --input-dir=output/turso_daily_eod
      - name: Write verified KRX EOD into Turso only and audit read-back
        if: ${{ env.MODE == 'apply' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node tools/turso/eod-range-import.mjs --mode=apply --input-dir=output/turso_daily_eod
      - name: Test independent research snapshot source exporter
        if: ${{ env.RUN_RESEARCH == 'true' }}
        run: python -m unittest discover -s tests -p 'test_turso_signal_snapshot_export.py' -v
      - name: Scan full market patterns for the SAME verified KST date
        if: ${{ env.RUN_RESEARCH == 'true' }}
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KRX_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
          KRX_DATA_ID: ${{ secrets.KRX_DATA_ID || secrets.KRX_ID }}
          KRX_DATA_PW: ${{ secrets.KRX_DATA_PW || secrets.KRX_PW }}
        run: |
          python scripts/market_scan_r11.py \
            --date "$TRADE_DAY" --years "$RESEARCH_YEARS" \
            --daily-provider auto --out output/turso_daily_research/source
      - name: Reject stale research dates and incomplete KRX coverage
        if: ${{ env.RUN_RESEARCH == 'true' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          audit = json.loads(Path('output/turso_daily_research/source/AUDIT.json').read_text())
          assert audit['asof'] == os.environ['TRADE_DAY'], 'RESEARCH_DATE_MISMATCH'
          assert audit['intraday_verified'] is False, 'NOT_VERIFIED_EOD'
          assert audit['observed_stocks'] >= 1700, 'INCOMPLETE_MARKET_UNIVERSE'
          print('BLUE_TURSO_RESEARCH_EXACT_DAY_VERIFIED', audit['asof'], audit['matched_stocks'])
          PY
      - name: Export R1.1 signals, patterns and dated chart evidence
        if: ${{ env.RUN_RESEARCH == 'true' }}
        run: |
          python scripts/export_turso_signal_snapshot.py \
            --input-dir output/turso_daily_research/source \
            --out output/turso_daily_research/snapshot
      - name: Test audited, immutable Turso research writer
        if: ${{ env.RUN_RESEARCH == 'true' }}
        run: node --test tools/turso/signal-snapshot-import.test.mjs
      - name: Validate research snapshot hashes without database writes
        if: ${{ env.RUN_RESEARCH == 'true' }}
        run: |
          node tools/turso/signal-snapshot-import.mjs \
            --mode=dry_run --input-dir=output/turso_daily_research/snapshot
      - name: Save research only after Turso EOD audit and exact close match
        if: ${{ env.RUN_RESEARCH == 'true' && env.MODE == 'apply' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node tools/turso/signal-snapshot-import.mjs \
            --mode=apply --input-dir=output/turso_daily_research/snapshot
      - name: Retain EOD and research provenance (even on errors)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_TURSO_DAILY_EOD_RESEARCH_${{ github.run_id }}
          path: |
            output/turso_daily_eod/
            output/turso_daily_research/source/AUDIT.json
            output/turso_daily_research/snapshot/manifest.json
          if-no-files-found: ignore
          retention-days: 14
