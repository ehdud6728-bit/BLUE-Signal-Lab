name: BLUE Combined Pattern Profitability (READ ONLY)
on:
  workflow_dispatch:
    inputs:
      sessions:
        type: choice
        options: ['60','120']
        default: '60'
  pull_request:
    paths:
      - 'research/pattern_performance_combined*.py'
      - 'research/test_pattern_performance_combined*.py'
      - 'tools/turso/combined-pattern-factors*'
      - '.github/workflows/blue_combined_pattern_profitability.yml'
permissions:
  contents: read
concurrency:
  group: blue-combined-pattern-profitability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tools/turso --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Offline factor provenance test
        run: node --test tools/turso/combined-pattern-factors.test.mjs
      - name: Offline combined cohort test
        run: python3 research/test_pattern_performance_combined.py
      - name: Offline aggregate publication contract
        run: python3 research/test_pattern_performance_combined_export.py
      - name: Read audited source and compare predeclared joint conditions
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SESSIONS: ${{ inputs.sessions }}
        run: |
          set -euo pipefail
          mkdir -p output/combined
          node tools/turso/pattern-exit-export.mjs --mode=study --sessions="$SESSIONS" --out=output/combined/source.json
          node tools/turso/combined-pattern-factors.mjs output/combined/source.json output/combined/factors.json
          python3 research/pattern_performance_combined.py --source output/combined/source.json --factors output/combined/factors.json --output output/combined/report.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: BLUE_COMBINED_PATTERN_STUDY
          path: output/combined/report.json
          if-no-files-found: error
  publish:
    needs: study
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.BLUE_ADAPTIVE_PUBLISH_ENABLED == 'true' && inputs.sessions == '60' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: BLUE_COMBINED_PATTERN_STUDY
          path: output/combined
      - name: Publish same-date aggregate joint study only
        run: |
          set -euo pipefail
          python3 research/pattern_performance_combined_export.py --input output/combined/report.json --snapshot research/adaptive-history/latest.json --output web/src/combined-pattern-data.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/combined-pattern-data.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish aggregate combined pattern study"
          git push origin HEAD:main
