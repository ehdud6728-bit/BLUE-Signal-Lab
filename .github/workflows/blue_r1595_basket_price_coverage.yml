      - name: Check and apply exact safe source edits, then verify replay
        run: |
          python scripts/blue_r1595_install.py --check
          python scripts/blue_r1595_install.py --apply
          python scripts/blue_r1595_install.py --check
          python scripts/blue_r1595_install.py --apply
          python -m py_compile scripts/blue_r1595_install.py
      - name: Run R1595 grouping, collector and installer regression tests
        run: |
          python -m unittest discover -s tests -p 'test_r1595_install.py' -v
          node --experimental-strip-types --test tests/test_r1595_grouping.mjs
          node --test tests/test_r1595_queue.mjs
      - name: Preserve R1593 and R1594 price API and AI regressions
        run: |
          node --experimental-strip-types --test tests/test_r1593_compare.mjs
          node --experimental-strip-types --test tests/test_r1594_priority.mjs
          node --test tests/test_r1594_collector.mjs
          node --experimental-strip-types --test tests/test_basket_r15.mjs
      - name: Existing full repository Python regressions
        run: |
          python -m pip install pandas numpy pyarrow requests 'pykrx==1.2.9' 'cryptography>=43,<48'
          python -m unittest discover -s tests -v
      - name: Build React TypeScript frontend without deploy
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Validate KIS Collector tests and dry-run compile
        working-directory: collector
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run build:check
      - name: Assert file scope, no source algorithm, secrets, Worker or D1 schema edits
        run: |
          python - <<'PYGUARD'
          from pathlib import Path
          import subprocess
          touched=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'web/src/main.tsx','web/src/SmartBasket.tsx','web/src/price-compare.ts','collector/src/search-quote-priority.mjs'}
          assert touched==expected,('R1595_UNEXPECTED_MODIFICATIONS',sorted(touched))
          expected_new={'scripts/blue_r1595_install.py','tests/test_r1595_grouping.mjs','tests/test_r1595_install.py','tests/test_r1595_queue.mjs','web/src/basket-grouping.ts','web/src/r1595-group-price.css'}
          assert all(Path(p).exists() for p in expected_new),'R1595_MISSING_PACKAGE_FILE'
          assert 'groupBasketRecords(visible,groupSimilar)' in Path('web/src/SmartBasket.tsx').read_text()
          assert 'onBatch?' in Path('web/src/price-compare.ts').read_text()
          assert 'requestMissingQuote(r)' in Path('web/src/main.tsx').read_text()
          assert "WHEN 'QUEUED' THEN 0" in Path('collector/src/search-quote-priority.mjs').read_text()
          assert 'new Date' not in Path('web/src/basket-grouping.ts').read_text()
          print('R1595_SCOPE_OK', sorted(touched))
          PYGUARD
      - name: Commit only after passing all tests and explicit user approval
        if: inputs.apply_changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/main.tsx web/src/SmartBasket.tsx web/src/price-compare.ts \
            web/src/basket-grouping.ts web/src/r1595-group-price.css \
            collector/src/search-quote-priority.mjs scripts/blue_r1595_install.py \
            tests/test_r1595_grouping.mjs tests/test_r1595_queue.mjs tests/test_r1595_install.py
          git diff --cached --quiet || {
            git commit -m 'BLUE R1.5.9.5: group basket dates and improve saved price coverage'
            git push origin HEAD:main
          }
      - name: Deployment boundary and final result
        run: |
          echo 'R1595_ALL_TESTS_PASS'
          echo 'No auto-deploy: only frontend + KIS Collector require deployment after approved commit.'
          echo 'API Worker and existing D1 schema are unchanged.'
