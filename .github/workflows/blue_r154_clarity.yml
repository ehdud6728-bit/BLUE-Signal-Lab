name: BLUE R1.5.4 Discovery Signals and Tracking Provenance (MANUAL)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE = inspect + build only. TRUE = commit R1.5.4 reviewed changes to main.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r154-provenance-clarity
  cancel-in-progress: false
jobs:
  verify_and_optional_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
