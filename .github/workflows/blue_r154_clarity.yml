      - name: Validate R1.5.3 anchors and patch reviewed UI and provenance only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/blue_r154_install.py --check
          python scripts/blue_r154_install.py --apply
          python - <<'PYASSERT'
          from pathlib import Path
          main=Path('web/src/main.tsx').read_text()
          basket=Path('web/src/SmartBasket.tsx').read_text()
          live=Path('web/src/LiveMarket.tsx').read_text()
          api=Path('worker/src/live.ts').read_text()
          basket_api=Path('worker/src/performance.ts').read_text()
          collector=Path('collector/src/core.mjs').read_text()
          assert 'R154_CLARITY' in main and 'r154-clarity.css' in main
          assert 'r154-origin-strip' in basket and 'discoveredSignals' in basket
          assert 'blue_r15_basket_v1' in basket
          assert 'r154-track-dates' in live and 'r154-track-perspective' in live
          assert 'blue_kis_first_seen_r154' in api and 'blue_kis_first_seen_r154' in collector
          assert 'r.is_demo=0' in basket_api and 'signal_names' in basket_api
          assert 'R153_BOTTOM_NAV_ONLY' in main and 'r151-quick-add' in main
          assert 'source_krx_run_id' in collector and 'candidateSelection' in collector
          print('R154_UI_AND_PROVENANCE_ASSERT_OK')
          PYASSERT
          node --check collector/src/core.mjs
          git diff --stat
      - name: Build React TypeScript frontend
        working-directory: web
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Check API Worker bundle without deployment
        working-directory: worker
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r154-api-build
      - name: Test and bundle KIS Collector without deployment
        working-directory: collector
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npx wrangler deploy --dry-run --outdir ../.r154-collector-build
      - name: Commit reviewed R1.5.4 files when explicitly approved
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/blue_r154_install.py web/src/r154-clarity.css \
            web/src/main.tsx web/src/SmartBasket.tsx web/src/LiveMarket.tsx \
            worker/src/live.ts worker/src/performance.ts collector/src/core.mjs
          if git diff --cached --quiet; then
            echo 'R154_ALREADY_INSTALLED'
          else
            git config user.name 'BLUE R1.5.4 UI installer'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'BLUE R1.5.4: discovery signal visibility and tracking provenance'
            git push origin HEAD:main
          fi
      - name: Report next step
        run: |
          echo 'R154_VALIDATED_FRONTEND_API_COLLECTOR'
          echo 'If apply_changes=false, rerun with true to commit.'
          echo 'After commit deploy API via blue_kis_r14_deploy_api.yml and collector via blue_r142_collector_deploy.yml deploy=true.'
          echo 'Cloudflare frontend deployment is separate. First-tracking dates from retained history have limited precision.'
