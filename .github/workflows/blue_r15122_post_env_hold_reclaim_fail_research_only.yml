      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned research-only dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'requests==2.32.5'

      - name: Test state exclusivity, delayed next-open entry and 2025 split
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15122" -p test_study.py -v

      - name: Recompute fixed full-market ENV base then post-ENV state results
        run: |
          python -B "$RUNNER_TEMP/r15122/study.py" \
            --input "$RUNNER_TEMP/r15122" \
            --output output/r15122_post_env_states

      - name: Verify R15121 population parity, all states and ELNF signal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out=Path('output/r15122_post_env_states')
          required=('POST_ENV_1_3_5_DAY_STATES.csv',
                    'POST_ENV_5_10_20D_CONDITIONAL_RESULTS.csv',
                    'LNF_SIGNAL_PARITY.json', 'AUDIT.json', 'README_KO.md')
          if any(not (out/x).exists() or (out/x).stat().st_size < 80 for x in required):
              raise SystemExit('R15122_MISSING_OR_EMPTY_RESULTS')
          audit=json.loads((out/'AUDIT.json').read_text(encoding='utf-8'))
          anchor=audit['elnf_parity']
          if not (audit['version'].startswith('R15122_POST_ENV')
                  and audit['read_only'] and audit['no_d1_write']
                  and audit['no_live_or_search_modification'] and audit['no_deploy']
                  and audit['prior_r15121_population_identical']
                  and audit['state_rows'] > 50000
                  and set(audit['state_counts']) == {'HOLD_ALL','RECLAIM','BELOW'}
                  and anchor['blue30_lower_followup_day'] == '2026-08-10'
                  and anchor['state_date'] == '2026-08-10'):
              raise SystemExit('R15122_AUDIT_OR_ELNF_PARITY_FAILURE')
          summary=pd.read_csv(out/'POST_ENV_5_10_20D_CONDITIONAL_RESULTS.csv')
          if not {'DISCOVERY_2023_2024','VALIDATION_2025','RETROSPECTIVE_2026'}.issubset(set(summary.cohort)):
              raise SystemExit('R15122_COHORTS_MISSING')
          print('R15122_VALIDATED_READ_ONLY_STATE_RESULTS')
          PY

      - name: Upload independent post-ENV state research (30 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15122_POST_ENV_STATES_${{ github.run_id }}
          path: output/r15122_post_env_states/
          if-no-files-found: error
          retention-days: 30
