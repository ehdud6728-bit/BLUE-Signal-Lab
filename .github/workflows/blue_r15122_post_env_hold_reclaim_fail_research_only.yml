# BLUE R1.5.10.22 — ENV breakout follow-up price states (READ-ONLY).
# Stand-alone independent research; upload only this file to .github/workflows/.
# Does not checkout or change LIVE/SEARCH/WATCH, D1, websites or prior studies.
# Evaluates hold / reclaim / fail at t+1, t+3, t+5; enters t+k+1 OPEN.
name: BLUE R1.5.10.22 Post-ENV States (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Enter RESEARCH_ONLY; no production changes are made.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blue-r15122-post-env-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post_env_state_research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require correct repository, main and explicit research-only input
        env:
          CONFIRM: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM" = 'RESEARCH_ONLY'
          echo 'R15122_POST_ENV_STATES_READ_ONLY'

