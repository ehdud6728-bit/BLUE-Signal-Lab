name: BLUE Turso Collector Secrets Install (MANUAL)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'FALSE: no Cloudflare changes. TRUE: install TWO Turso secrets to the existing collector Worker.'
        type: boolean
        required: true
        default: false
      confirm_worker:
        description: 'For apply=true, type exactly blue-market-collector.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: blue-turso-collector-secret-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Explain operation and required confirmation
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          echo 'Target Worker: blue-market-collector only.'
          echo 'Operation: install Turso URL and token as Cloudflare Worker secrets.'
          echo 'NOTE: Wrangler secret put may publish a new Worker version.'
          echo 'No D1 SQL. No TURSO_MIRROR_ENABLED changes.'
          if [[ "$APPLY" != 'true' ]]; then echo 'DRY RUN: nothing will be changed.'; fi

      - name: Checkout repository
        if: inputs.apply
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: inputs.apply
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        if: inputs.apply
        working-directory: collector
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install the two secrets without printing their values
        if: inputs.apply
        working-directory: collector
        shell: bash
        env:
          CONFIRM_WORKER: ${{ inputs.confirm_worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_WORKER" != 'blue-market-collector' ]]; then
            echo 'ERROR: confirm_worker mismatch.'; exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${TURSO_DATABASE_URL:-}" || -z "${TURSO_AUTH_TOKEN:-}" ]]; then
            echo 'ERROR: Required GitHub Actions Secrets are not configured.'; exit 1
          fi
          if ! grep -Eq '"TURSO_MIRROR_ENABLED"[[:space:]]*:[[:space:]]*"false"' wrangler.jsonc; then
            echo 'ERROR: Mirror feature must remain OFF during secrets installation.'; exit 1
          fi
          printf '%s' "$TURSO_DATABASE_URL" | npx wrangler secret put TURSO_DATABASE_URL --name blue-market-collector
          printf '%s' "$TURSO_AUTH_TOKEN" | npx wrangler secret put TURSO_AUTH_TOKEN --name blue-market-collector
          echo 'BLUE_TURSO_COLLECTOR_SECRETS_INSTALLED: Mirror still OFF. No D1 SQL executed.'
