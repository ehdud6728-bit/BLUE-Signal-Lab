# BLUE R1.5.10.23 — 10-day peak vs final outcome research.
# Single standalone YAML: upload to .github/workflows/, no prior action edits.
# Research-only, read-only, no deployment and no D1 or trading API changes.
name: BLUE R1.5.10.23 Peak vs Final (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Enter RESEARCH_ONLY; production is not modified.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blue-r15123-peak-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  peak_vs_final_research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require correct repo, branch and explicit research-only input
        env:
          CONFIRM: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM" = 'RESEARCH_ONLY'
          echo 'R15123_READ_ONLY_RESEARCH_GUARD_OK'

