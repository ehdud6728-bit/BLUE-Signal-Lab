      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'requests==2.32.5'

      - name: Test peak windows, maturity, DBH and R15122 return parity
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15123" -p test_study.py -v

      - name: Recompute fixed-universe ENV MFE and confirmation comparisons
        run: |
          python -B "$RUNNER_TEMP/r15123/study.py" \
            --input "$RUNNER_TEMP/r15123" \
            --output output/r15123_peak_vs_final

      - name: Validate output safety and DBH +28.91 percent peak anchor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=Path('output/r15123_peak_vs_final')
          files=('ENV_SIGNALS_5_10_20D_PEAK_VS_FINAL.csv',
                 'ENV_STATES_1_3_5D_PEAK_VS_FINAL.csv',
                 'ENV_ENTRY_TIMING_PEAK_VS_FINAL_SUMMARY.csv',
                 'DBH_2026-05-21_DIAGNOSTIC.csv',
                 'DBH_2026-05-21_ALL_ENTRY_WINDOWS.csv',
                 'AUDIT.json', 'README_KO.md')
          if any(not (o/f).exists() or (o/f).stat().st_size < 80 for f in files):
              raise SystemExit('R15123_MISSING_OR_EMPTY_OUTPUT')
          audit=json.loads((o/'AUDIT.json').read_text(encoding='utf-8'))
          dbh=audit['dbh_anchor']
          if not (audit['version'].startswith('R15123_')
                  and audit['read_only'] and audit['no_d1_write']
                  and audit['no_live_or_search_modification'] and audit['no_deploy']
                  and audit['prior_r15121_population_identical']
                  and audit['states'] > 50000 and audit['env_events'] > 10000
                  and abs(dbh['signal_peak_high_pct']-28.9149888143)<.02
                  and abs(dbh['signal_final_pct']+11.1856823266)<.02
                  and abs(dbh['t3_final_pct']+23.5467980296)<.02):
              raise SystemExit('R15123_PARITY_OR_DBH_ANCHOR_FAILURE')
          print('R15123_PEAK_AND_END_RETURNS_VALIDATED')
          PY

      - name: Upload isolated research results for 30 days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15123_PEAK_VS_FINAL_${{ github.run_id }}
          path: output/r15123_peak_vs_final/
          if-no-files-found: error
          retention-days: 30
