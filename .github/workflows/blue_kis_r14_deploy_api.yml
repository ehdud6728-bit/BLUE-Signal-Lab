name: BLUE R1.4 Deploy API Worker (MANUAL, EXPLICIT)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard BLUE repo
        run: test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and deploy existing BLUE API Worker with isolated live quote endpoint
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy
