name: BLUE Tracking Roster Plan (READ ONLY)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/turso/tracking-plan*.mjs'
      - 'collector/src/tracking-checkpoint*.mjs'
      - '.github/workflows/blue_tracking_roster_plan.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tools/turso --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Verify delayed planning and durable local SQLite checkpoint lifecycle
        run: node --test tools/turso/tracking-plan.test.mjs collector/src/tracking-checkpoint.test.mjs
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ehdud6728-bit/BLUE-Signal-Lab'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node tools/turso/tracking-plan.mjs
