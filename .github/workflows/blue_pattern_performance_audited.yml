name: BLUE Audited Pattern Performance (READ ONLY)
on:
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      sessions:
        type: choice
        options: ['60','120','250']
        default: '60'
  pull_request:
    paths:
      - 'research/pattern_performance*.py'
      - 'research/pattern_entry_timing.py'
      - 'research/price_path_readiness.py'
      - 'research/test_price_path_readiness.py'
      - 'research/test_pattern_performance*.py'
      - '.github/workflows/blue_pattern_performance_audited.yml'
permissions:
  contents: read
concurrency:
  group: blue-adaptive-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Offline price-path readiness and metric test
        run: python3 research/test_price_path_readiness.py
      - name: Offline exact-session test
        run: python3 research/test_pattern_performance_audited.py
      - name: Recommendation threshold test
        run: python3 research/test_pattern_performance_web_snapshot.py
      - name: Web export and change history test
        run: python3 research/test_pattern_performance_web_export.py
      - name: Snapshot archive test
        run: python3 research/test_pattern_performance_archive.py
      - name: Market breadth regime study test
        run: python3 research/test_pattern_performance_market_regime.py
      - name: Multi-window monitoring test
        run: python3 research/test_pattern_performance_windows.py
      - name: Compound discovery test
        run: python3 research/test_pattern_performance_discovery.py
      - name: High-return profiles test
        run: python3 research/test_pattern_performance_high_returns.py
      - name: Profitability and tail-risk metrics test
        run: python3 research/test_pattern_performance_profitability.py
      - name: High-return profile export test
        run: python3 research/test_pattern_performance_high_returns_export.py
      - name: Independent profitability recomputation test
        run: python3 research/test_pattern_performance_profitability_audit.py
      - name: Independent candle profile recomputation test
        run: python3 research/test_pattern_performance_high_returns_audit.py
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BLUE_ADAPTIVE_AUTO_ENABLED == 'true'))
        with:
          node-version: '22'
      - name: Read audited source and calculate report
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BLUE_ADAPTIVE_AUTO_ENABLED == 'true'))
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SESSIONS: ${{ inputs.sessions || '60' }}
        run: |
          cd tools/turso
          npm install --no-audit --no-fund --ignore-scripts --no-package-lock
          cd ../..
          node tools/turso/pattern-exit-export.mjs --mode=study --sessions="$SESSIONS" --out=output/pattern/source.json
          python3 research/price_path_readiness.py --source output/pattern/source.json --output output/pattern/price-path-readiness.json
          python3 research/pattern_performance_audited.py --input output/pattern/source.json --output output/pattern/report.json
          python3 research/pattern_performance_windows.py --input output/pattern/source.json --output output/pattern/windows.json
          python3 research/pattern_performance_market_regime.py --input output/pattern/source.json --output output/pattern/market-regime.json
          python3 research/pattern_performance_discovery.py --input output/pattern/source.json --output output/pattern/discovery.json
          python3 research/pattern_performance_high_returns.py --input output/pattern/source.json --output output/pattern/high-return-profiles.json
          python3 research/pattern_performance_high_returns_audit.py --source output/pattern/source.json --report output/pattern/high-return-profiles.json --output output/pattern/high-return-audit.json
      - name: Generate short-window web snapshot candidate
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BLUE_ADAPTIVE_AUTO_ENABLED == 'true')) && (inputs.sessions == '60' || github.event_name == 'schedule')
        run: |
          python3 research/pattern_performance_audited.py --input output/pattern/source.json --output output/pattern/recent-report.json --recent-window 28
          python3 research/pattern_performance_profitability_audit.py --source output/pattern/source.json --report output/pattern/recent-report.json --output output/pattern/profitability-audit.json
          python3 research/pattern_performance_web_snapshot.py --input output/pattern/recent-report.json --output output/pattern/web-snapshot.json
          python3 research/pattern_performance_web_export.py --input output/pattern/web-snapshot.json --output output/pattern/recent-pattern-data.ts
          python3 research/pattern_performance_profitability_export.py --input output/pattern/recent-report.json --snapshot output/pattern/web-snapshot.json --audit output/pattern/profitability-audit.json --output output/pattern/research-profitability-data.ts
          python3 research/pattern_performance_archive.py --input output/pattern/web-snapshot.json --archive output/pattern/archive
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BLUE_ADAPTIVE_AUTO_ENABLED == 'true'))
        with:
          name: BLUE_PATTERN_PERFORMANCE
          path: |
            output/pattern/report.json
            output/pattern/price-path-readiness.json
            output/pattern/windows.json
            output/pattern/market-regime.json
            output/pattern/discovery.json
            output/pattern/high-return-profiles.json
            output/pattern/high-return-audit.json
            output/pattern/web-snapshot.json
            output/pattern/recent-report.json
            output/pattern/recent-pattern-data.ts
            output/pattern/research-profitability-data.ts
            output/pattern/profitability-audit.json
            output/pattern/archive/
          if-no-files-found: error
  publish:
    needs: study
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BLUE_ADAPTIVE_AUTO_ENABLED == 'true')) && (inputs.sessions == '60' || github.event_name == 'schedule') && vars.BLUE_ADAPTIVE_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: BLUE_PATTERN_PERFORMANCE
          path: output/pattern
      - name: Preserve research history and publish generated data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 research/pattern_performance_archive.py --input output/pattern/web-snapshot.json --archive research/adaptive-history
          python3 research/pattern_performance_radar_export.py --windows output/pattern/windows.json --archive research/adaptive-history --output web/src/adaptive-radar-data.ts
          python3 research/pattern_performance_discovery_export.py --input output/pattern/discovery.json --snapshot research/adaptive-history/latest.json --output web/src/directional-discovery-data.ts
          python3 research/pattern_performance_profitability_export.py --input output/pattern/recent-report.json --snapshot research/adaptive-history/latest.json --audit output/pattern/profitability-audit.json --output web/src/research-profitability-data.ts
          python3 research/pattern_performance_high_returns_export.py --input output/pattern/high-return-profiles.json --snapshot research/adaptive-history/latest.json --audit output/pattern/high-return-audit.json --output web/src/high-return-profiles-data.ts
          git add research/adaptive-history web/src/adaptive-radar-data.ts web/src/directional-discovery-data.ts web/src/research-profitability-data.ts web/src/high-return-profiles-data.ts
          if git diff --cached --quiet; then
            echo "No newer audited snapshot"
            exit 0
          fi
          python3 research/pattern_performance_web_export.py --input research/adaptive-history/latest.json --output web/src/recent-pattern-data.ts
          git add web/src/recent-pattern-data.ts
          git commit -m "Publish audited adaptive research snapshot"
          git push origin HEAD:main
