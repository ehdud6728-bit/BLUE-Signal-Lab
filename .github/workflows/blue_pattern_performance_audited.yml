name: BLUE Audited Pattern Performance (READ ONLY)
on:
  workflow_dispatch:
    inputs:
      sessions:
        type: choice
        options: ['60','120','250']
        default: '60'
  pull_request:
    paths:
      - 'research/pattern_performance*.py'
      - 'research/pattern_entry_timing.py'
      - 'research/test_pattern_performance*.py'
      - '.github/workflows/blue_pattern_performance_audited.yml'
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Offline exact-session test
        run: python3 research/test_pattern_performance_audited.py
      - name: Recommendation threshold test
        run: python3 research/test_pattern_performance_web_snapshot.py
      - name: Web export and change history test
        run: python3 research/test_pattern_performance_web_export.py
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          node-version: '22'
      - name: Read audited source and calculate report
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SESSIONS: ${{ inputs.sessions }}
        run: |
          cd tools/turso
          npm install --no-audit --no-fund --ignore-scripts --no-package-lock
          cd ../..
          node tools/turso/pattern-exit-export.mjs --mode=study --sessions="$SESSIONS" --out=output/pattern/source.json
          python3 research/pattern_performance_audited.py --input output/pattern/source.json --output output/pattern/report.json
      - name: Generate short-window web snapshot candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sessions == '60'
        run: |
          python3 research/pattern_performance_audited.py --input output/pattern/source.json --output output/pattern/recent-report.json --recent-window 28
          python3 research/pattern_performance_web_snapshot.py --input output/pattern/recent-report.json --output output/pattern/web-snapshot.json
          python3 research/pattern_performance_web_export.py --input output/pattern/web-snapshot.json --output output/pattern/recent-pattern-data.ts
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: BLUE_PATTERN_PERFORMANCE
          path: |
            output/pattern/report.json
            output/pattern/web-snapshot.json
            output/pattern/recent-report.json
            output/pattern/recent-pattern-data.ts
          if-no-files-found: error
