name: BLUE R1.5.8 Protected Long-term Basket (MANUAL)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE test only; TRUE commit protected basket UI and 120-queue capacity to main'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r158-protected-watchlist
  cancel-in-progress: false
jobs:
  validate_and_optional_apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm correct repository and branch
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
