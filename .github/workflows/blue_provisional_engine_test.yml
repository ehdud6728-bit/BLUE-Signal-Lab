name: BLUE Provisional Engine Offline Tests
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/blue_provisional_engine_test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m unittest discover -s tests -p test_provisional_pattern_scan.py

      - run: python -m unittest discover -s tests -p test_provisional_history.py
      - run: node --check tools/turso/provisional-input-export.mjs

      - run: python -m unittest discover -s tests -p test_provisional_pipeline.py
