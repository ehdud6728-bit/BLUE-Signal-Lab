name: BLUE Provisional Engine Offline Tests
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tools/turso/provisional-input-export*'
      - 'tools/turso/provisional-pattern-publish*'
      - '.github/workflows/blue_provisional_pattern_publish.yml'
      - '.github/workflows/blue_provisional_live_verify.yml'
      - 'tests/**'
      - '.github/workflows/blue_provisional_engine_test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m unittest discover -s tests -p test_provisional_pattern_scan.py

      - run: python -m unittest discover -s tests -p test_provisional_history.py
      - run: python -m unittest discover -s tests -p test_chart_research_r159.py
      - run: node --check tools/turso/provisional-input-export.mjs

      - run: python -m unittest discover -s tests -p test_provisional_pipeline.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix tools/turso install --no-audit --no-fund --ignore-scripts --no-package-lock
      - run: node --test tools/turso/provisional-input-export.test.mjs tools/turso/provisional-pattern-publish.test.mjs
