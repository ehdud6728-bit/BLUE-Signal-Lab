name: BLUE D1 Query Insights (NO ROW SCAN)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-data-coverage-audit
  cancel-in-progress: false

jobs:
  inspect:
    name: Analyze D1 row-read usage via Cloudflare Analytics (no SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query Insights only (DO NOT run D1 SELECT)
        shell: bash
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          npm install --no-audit --no-fund --legacy-peer-deps

          {
            echo "# BLUE Signal Lab · D1 쿼리 사용량 (Insights 전용)"
            echo ""
            echo "- 실행: ${GITHUB_RUN_ID} / $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "- 대상 DB: blue-signal-lab-db"
            echo "- 기간: 최근 7일 (일일 할당량과 직접 일치하지 않는 분석용 집계)"
            echo "- **운영 D1에 SELECT/COUNT/JOIN/UPDATE를 실행하지 않습니다.**"
            echo "- Cloudflare GraphQL Analytics API의 조회 결과만 사용합니다."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          insights_json="$(mktemp)"
          trap 'rm -f "${insights_json}"' EXIT
          if ! npx wrangler d1 insights 272318c7-afd2-419c-91cc-dc59475ef87a --sort-by=reads --time-period=7d --limit=20 --json > "${insights_json}" 2>/dev/null; then
            echo "::error::D1 Insights 조회 실패. API 토큰의 Account Analytics Read 권한을 확인하세요. D1 테이블 쿼리로 대체하지 않습니다."
            {
              echo "## 조회 불가"
              echo "- Account Analytics Read 권한 또는 Wrangler 호환성을 점검하세요."
              echo "- **안전을 위해 D1 테이블 조회로 대체하지 않았습니다.**"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          node - "${insights_json}" <<'NODE'
          const fs = require('node:fs');
          let parsed;
          try {
            parsed = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (error) {
            console.error('::error::Insights returned unreadable JSON. No D1 table queries were executed.');
            process.exit(1);
          }
          const results = Array.isArray(parsed) ? parsed : Array.isArray(parsed.data) ? parsed.data : [];
          if (results.length === 0 && !Array.isArray(parsed) && !Array.isArray(parsed.data)) {
            console.error('::error::Unexpected Insights JSON shape. No D1 table queries were executed.');
            process.exit(1);
          }

          const num = value => {
            const n = Number(value);
            return Number.isFinite(n) ? n.toLocaleString('en-US') : '-';
          };
          const safeTag = sql => {
            const cleaned = String(sql || '').replace(/'(?:''|[^'])*'/g, '?').replace(/\b\d+(?:\.\d+)?\b/g, '?');
            const op = cleaned.match(/\b(SELECT|INSERT|UPDATE|DELETE|REPLACE|WITH)\b/i)?.[1]?.toUpperCase() || 'SQL';
            const tables = [];
            const regex = /\b(?:FROM|JOIN|INTO|UPDATE)\s+(?:"([^"]+)"|`([^`]+)`|([A-Za-z_][\w.]*))/gi;
            for (const match of cleaned.matchAll(regex)) {
              const name = match[1] || match[2] || match[3];
              if (name && !tables.includes(name) && tables.length < 4) tables.push(name);
            }
            return op + (tables.length ? ' / ' + tables.join(', ') : ' / table unknown');
          };
          const lines = [
            '## 가장 많은 행을 읽은 쿼리 유형 TOP 20',
            '',
            '| 순위 | SQL 유형 / 테이블 | 7일 총 읽은 행 | 실행 횟수 | 1회 평균 읽은 행 |',
            '|---:|---|---:|---:|---:|',
          ];
          for (const [i, item] of results.entries()) {
            const tag = safeTag(item.query).replace(/\|/g, '/').slice(0, 120);
            lines.push(`| ${i + 1} | ${tag} | ${num(item.totalRowsRead)} | ${num(item.numberOfTimesRun)} | ${num(item.avgRowsRead)} |`);
          }
          if (results.length === 0) lines.push('| - | 해당 기간 조회 결과 없음 | - | - | - |');
          lines.push('', '원본 SQL 및 쿼리의 문자열 값은 보안상 공개 로그에 표시하지 않습니다.', '');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          console.log('D1 Insights analyzed. Operations: 0 direct D1 SQL queries.');
          NODE
