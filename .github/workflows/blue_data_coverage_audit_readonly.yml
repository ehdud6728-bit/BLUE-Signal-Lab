name: BLUE D1 Query Insights (NO ROW SCAN)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-data-coverage-audit
  cancel-in-progress: false

jobs:
  inspect:
    name: Analyze D1 row-read usage via Cloudflare Analytics (no SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare Analytics token and scope (NO D1 SQL)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          if (!token || !accountId) {
            console.error('::error::Missing Cloudflare Analytics token or account ID secret.');
            process.exit(1);
          }
          const diagnostics = body => {
            const errors = Array.isArray(body?.errors) ? body.errors : [];
            const codes = errors.map(item => item?.extensions?.code ?? item?.code)
              .map(String).filter(code => /^(?:[0-9]{3,6}|[A-Z_]{2,40})$/.test(code));
            const types = [...new Set(errors.map(error => {
              const message = String(error?.message || '').toLowerCase();
              if (/cannot query|unknown argument|validation|syntax|variable.*type|field.*not found/.test(message)) return 'QUERY_SHAPE';
              if (/permission|authorized|authorization|forbidden|authentication|access denied/.test(message)) return 'PERMISSION';
              if (/limit|rate|quota/.test(message)) return 'RATE_OR_LIMIT';
              return 'OTHER';
            }))];
            return 'error_count=' + errors.length + ' error_codes=' + (codes.join(',') || 'none') + ' error_types=' + (types.join(',') || 'none');
          };
          const request = async (url, options) => {
            try {
              const response = await fetch(url, { ...options, signal: AbortSignal.timeout(15000) });
              const body = await response.json().catch(() => null);
              return { response, body };
            } catch {
              console.error('::error::Cloudflare API network error or timeout (no D1 SQL executed).');
              process.exit(1);
            }
          };
          (async () => {
            const headers = { Authorization: 'Bearer ' + token };
            const verified = await request('https://api.cloudflare.com/client/v4/user/tokens/verify', { headers });
            const active = verified.response.ok && verified.body?.success === true && verified.body?.result?.status === 'active';
            console.log('TOKEN_VERIFY HTTP ' + verified.response.status + ' active=' + active + ' ' + diagnostics(verified.body));
            if (!active) {
              console.error('::error::Cloudflare API token is not active; no D1 SQL was executed.');
              process.exit(1);
            }
            const graph = async (query, variables) => request('https://api.cloudflare.com/client/v4/graphql', {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            const accountQuery = 'query AccountScope($accountTag: string!) { viewer { accounts(filter: { accountTag: $accountTag }) { __typename } } }';
            const account = await graph(accountQuery, { accountTag: accountId });
            const accountRows = account.body?.data?.viewer?.accounts;
            const accountCount = Array.isArray(accountRows) ? accountRows.length : 0;
            const accountErrors = Array.isArray(account.body?.errors) && account.body.errors.length > 0;
            console.log('ACCOUNT_SCOPE HTTP ' + account.response.status + ' matched_accounts=' + accountCount + ' ' + diagnostics(account.body));
            if (!account.response.ok || accountErrors || accountCount === 0) {
              console.error('::error::Configured Cloudflare account is not visible to this token, or the account-scope probe was rejected.');
              process.exit(1);
            }
            const end = new Date().toISOString().slice(0, 10);
            const start = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
            const analyticsQuery = 'query D1AnalyticsScope($accountTag: string!, $databaseId: string, $start: Date, $end: Date) { viewer { accounts(filter: { accountTag: $accountTag }) { d1AnalyticsAdaptiveGroups(limit: 1, filter: { databaseId: $databaseId, date_geq: $start, date_leq: $end }) { sum { readQueries } } } } }';
            const analytics = await graph(analyticsQuery, { accountTag: accountId, databaseId: '272318c7-afd2-419c-91cc-dc59475ef87a', start, end });
            const analyticsRows = analytics.body?.data?.viewer?.accounts;
            const analyticsCount = Array.isArray(analyticsRows) ? analyticsRows.length : 0;
            const analyticsErrors = Array.isArray(analytics.body?.errors) && analytics.body.errors.length > 0;
            console.log('GRAPHQL_ANALYTICS HTTP ' + analytics.response.status + ' matched_accounts=' + analyticsCount + ' ' + diagnostics(analytics.body));
            if (!analytics.response.ok || analyticsErrors || analyticsCount === 0) {
              console.error('::error::D1 Analytics probe rejected. Inspect HTTP, error_types and error_count; do not change token yet.');
              process.exit(1);
            }
            console.log('Preflight passed: active token, account scope and D1 Analytics accessible. 0 direct D1 SQL queries.');
          })().catch(() => {
            console.error('::error::Unexpected Analytics preflight failure (no D1 SQL).');
            process.exit(1);
          });
          NODE
      - name: Query Insights via Cloudflare GraphQL (NO D1 SQL)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          if (!token || !accountId) {
            console.error('::error::Missing Cloudflare Analytics credentials.');
            process.exit(1);
          }
          const databaseId = '272318c7-afd2-419c-91cc-dc59475ef87a';
          const end = new Date();
          const start = new Date(end.getTime() - 7 * 24 * 60 * 60 * 1000);
          // Matches the d1QueriesAdaptiveGroups query used by Cloudflare Wrangler D1 Insights.
          // Query only the GraphQL Analytics API; do not call D1 REST endpoints or run SQL.
          const query = 'query getD1QueriesOverviewQuery($accountTag: string, $filter: ZoneWorkersRequestsFilter_InputObject) { viewer { accounts(filter: {accountTag: $accountTag}) { d1QueriesAdaptiveGroups(limit: 20, filter: $filter, orderBy: [sum_rowsRead_DESC]) { sum { rowsRead rowsWritten queryDurationMs } avg { rowsRead queryDurationMs } count dimensions { query databaseId } } } } }';
          const body = {
            query,
            operationName: 'getD1QueriesOverviewQuery',
            variables: { accountTag: accountId, filter: { AND: [{ datetimeHour_geq: start.toISOString(), datetimeHour_leq: end.toISOString(), databaseId }] } },
          };
          const number = value => Number.isFinite(Number(value)) ? Number(value).toLocaleString('en-US') : '-';
          const safeTag = sql => {
            const cleaned = String(sql || '').replace(/'(?:''|[^'])*'/g, '?').replace(/\b\d+(?:\.\d+)?\b/g, '?');
            const op = cleaned.match(/\b(SELECT|INSERT|UPDATE|DELETE|REPLACE|WITH)\b/i)?.[1]?.toUpperCase() || 'SQL';
            const names = [];
            const tablePattern = /\b(?:FROM|JOIN|INTO|UPDATE)\s+(?:"([^"]+)"|`([^`]+)`|([A-Za-z_][\w.]*))/gi;
            for (const match of cleaned.matchAll(tablePattern)) {
              const name = match[1] || match[2] || match[3];
              if (/^[A-Za-z_][A-Za-z_0-9.]*$/.test(name) && !names.includes(name) && names.length < 4) names.push(name);
            }
            return op + (names.length ? ' / ' + names.join(', ') : ' / table unknown');
          };
          (async () => {
            const response = await fetch('https://api.cloudflare.com/client/v4/graphql', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(20000),
            });
            const parsed = await response.json().catch(() => null);
            const errors = Array.isArray(parsed?.errors) ? parsed.errors : [];
            const groups = parsed?.data?.viewer?.accounts?.[0]?.d1QueriesAdaptiveGroups;
            if (!response.ok || errors.length || !Array.isArray(groups)) {
              const codes = errors.map(item => item?.extensions?.code ?? item?.code).map(String)
                .filter(code => /^(?:[0-9]{3,6}|[A-Z_]{2,40})$/.test(code));
              const types = [...new Set(errors.map(item => {
                const message = String(item?.message || '').toLowerCase();
                if (/cannot query|unknown argument|validation|syntax|variable.*type/.test(message)) return 'QUERY_SHAPE';
                if (/permission|authorized|forbidden|authentication|access denied/.test(message)) return 'PERMISSION';
                return 'OTHER';
              }))];
              console.error('::error::D1 GraphQL Insights failed HTTP=' + response.status + ' errors=' + errors.length + ' codes=' + (codes.join(',') || 'none') + ' types=' + (types.join(',') || 'none'));
              process.exit(1);
            }
            const rows = groups.filter(item => item?.dimensions?.query && (!item.dimensions.databaseId || item.dimensions.databaseId === databaseId));
            const lines = [
              '# BLUE Signal Lab · D1 query usage (GraphQL Analytics only)',
              '',
              '- 실행: ' + process.env.GITHUB_RUN_ID + ' / ' + end.toISOString(),
              '- 대상 DB: blue-signal-lab-db',
              '- 기간: 최근 7일 (Analytics 샘플링 집계이며 일일 무료 한도와 직접 일치하지 않음)',
              '- **운영 D1 SELECT/COUNT/JOIN/UPDATE 실행 없음**',
              '',
              '## 가장 많은 행을 읽은 쿼리 유형 TOP 20',
              '',
              '| 순위 | SQL 유형 / 테이블 | 7일 총 읽은 행 | 실행 횟수 | 1회 평균 읽은 행 |',
              '|---:|---|---:|---:|---:|',
            ];
            for (const [index, item] of rows.entries()) {
              const tag = safeTag(item.dimensions.query).slice(0, 120);
              lines.push('| ' + (index + 1) + ' | ' + tag + ' | ' + number(item.sum?.rowsRead) + ' | ' + number(item.count) + ' | ' + number(item.avg?.rowsRead) + ' |');
            }
            if (rows.length === 0) lines.push('| - | 해당 기간 조회 결과 없음 | - | - | - |');
            lines.push('', '원본 SQL과 문자열 매개변수는 GitHub 로그에 출력하지 않습니다.', '');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
            console.log('D1 GraphQL Insights success: grouped_queries=' + rows.length + '; direct_D1_SQL=0');
          })().catch(() => {
            console.error('::error::D1 GraphQL Insights network/parse failure; direct_D1_SQL=0');
            process.exit(1);
          });
          NODE

      - name: Daily account and database reads plus today's query types (GraphQL only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const accountTag = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          const databaseId = '272318c7-afd2-419c-91cc-dc59475ef87a';
          if (!token || !accountTag) {
            console.error('::error::Missing Analytics credentials; no D1 SQL executed.');
            process.exit(1);
          }
          const now = new Date();
          const utcMidnight = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
          const dates = Array.from({length: 7}, (_, i) =>
            new Date(utcMidnight.getTime() - (6 - i) * 86400000).toISOString().slice(0, 10));
          const fmt = value => Number.isFinite(Number(value)) ? Math.round(Number(value)).toLocaleString('en-US') : '-';
          const requestGraphQL = async (query, variables) => {
            const res = await fetch('https://api.cloudflare.com/client/v4/graphql', {
              method: 'POST',
              headers: {Authorization: 'Bearer ' + token, 'Content-Type': 'application/json'},
              body: JSON.stringify({query, variables}),
              signal: AbortSignal.timeout(20000),
            });
            const json = await res.json().catch(() => null);
            if (!res.ok || !json?.data || (Array.isArray(json?.errors) && json.errors.length)) {
              const count = Array.isArray(json?.errors) ? json.errors.length : 0;
              throw Error('GRAPHQL HTTP=' + res.status + ' error_count=' + count);
            }
            return json.data;
          };
          const sumByDate = entries => {
            const map = new Map();
            for (const row of entries) {
              const day = row?.dimensions?.date;
              const reads = Number(row?.sum?.rowsRead);
              if (typeof day === 'string' && Number.isFinite(reads)) {
                map.set(day, (map.get(day) || 0) + reads);
              }
            }
            return map;
          };
          const dailyQuery = [
            'query D1DailyReads($accountTag: string!, $start: Date, $end: Date, $db: string) {',
            ' viewer { accounts(filter: {accountTag: $accountTag}) {',
            '  target: d1AnalyticsAdaptiveGroups(limit: 1000, filter: {date_geq: $start, date_leq: $end, databaseId: $db}, orderBy: [date_DESC]) {dimensions {date databaseId} sum {rowsRead}}',
            '  account: d1AnalyticsAdaptiveGroups(limit: 1000, filter: {date_geq: $start, date_leq: $end}, orderBy: [date_DESC]) {dimensions {date databaseId} sum {rowsRead}}',
            ' } } }',
          ].join(' ');
          (async () => {
            const data = await requestGraphQL(dailyQuery, {
              accountTag, start: dates[0], end: dates[6], db: databaseId,
            });
            const account = data?.viewer?.accounts?.[0];
            if (!Array.isArray(account?.target) || !Array.isArray(account?.account)) {
              throw Error('DAILY_ANALYTICS_SHAPE');
            }
            const dbReads = sumByDate(account.target);
            const allReads = sumByDate(account.account);
            const lines = [
              '## 일별 D1 행 읽기 (UTC 날짜 / 계정 전체 및 대상 DB)',
              '',
              '- Cloudflare GraphQL Analytics 집계이며 UTC 00:00 = 한국 시간 오전 9시입니다.',
              '- 오늘 행은 실행 시각까지의 부분 집계입니다. 데이터 반영 지연이 있을 수 있습니다.',
              '- 아래 수치를 7일 TOP 20 쿼리 합계와 직접 비교하지 마세요.',
              '- **운영 D1에 SQL을 한 건도 실행하지 않았습니다.**',
              '',
              '| 날짜 (UTC) | 계정 전체 읽은 행 | BLUE DB 읽은 행 |',
              '|---|---:|---:|',
            ];
            for (const day of dates) {
              lines.push('| ' + day + (day === dates[6] ? ' (오늘·진행중)' : '') +
                ' | ' + fmt(allReads.get(day) || 0) + ' | ' + fmt(dbReads.get(day) || 0) + ' |');
            }
            const oldSix = dates.slice(0, -1);
            const prevSixDb = oldSix.reduce((n, day) => n + (dbReads.get(day) || 0), 0);
            const prevSixAll = oldSix.reduce((n, day) => n + (allReads.get(day) || 0), 0);
            lines.push('', '- 이전 6일 BLUE DB 합계: **' + fmt(prevSixDb) + '행**');
            lines.push('- 오늘 BLUE DB 누적: **' + fmt(dbReads.get(dates[6]) || 0) + '행** (부분 집계)');
            lines.push('- 이전 6일 계정 합계: **' + fmt(prevSixAll) + '행**');
            lines.push('- 오늘 계정 누적: **' + fmt(allReads.get(dates[6]) || 0) + '행** (부분 집계)', '');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));

            // Optional culprit analysis: Insights is sampled; it helps locate which SQL types spiked today.
            const todayQuery = 'query D1Today($accountTag: string, $filter: ZoneWorkersRequestsFilter_InputObject) { viewer { accounts(filter: {accountTag: $accountTag}) { d1QueriesAdaptiveGroups(limit: 10, filter: $filter, orderBy: [sum_rowsRead_DESC]) { sum { rowsRead } count dimensions { query databaseId } } } } }';
            try {
              const daily = await requestGraphQL(todayQuery, {accountTag, filter: {
                AND: [{datetimeHour_geq: utcMidnight.toISOString(), datetimeHour_leq: now.toISOString(), databaseId}],
              }});
              const groups = daily?.viewer?.accounts?.[0]?.d1QueriesAdaptiveGroups;
              if (!Array.isArray(groups)) throw Error('TODAY_QUERY_SHAPE');
              const safeTag = sql => {
                const cleaned = String(sql || '').replace(/'(?:''|[^'])*'/g, '?').replace(/\b\d+(?:\.\d+)?\b/g, '?');
                const op = cleaned.match(/\b(SELECT|INSERT|UPDATE|DELETE|REPLACE|WITH)\b/i)?.[1]?.toUpperCase() || 'SQL';
                const table = cleaned.match(/\b(?:FROM|JOIN|INTO|UPDATE)\s+([A-Za-z_][\w.]*)/i)?.[1] || 'table unknown';
                return op + ' / ' + table;
              };
              const todayLines = [
                '## 오늘 가장 많은 행을 읽은 쿼리 유형 TOP 10 (UTC, 샘플링)',
                '',
                '| 순위 | SQL 유형 / 테이블 | 읽은 행 | 실행 횟수 |',
                '|---:|---|---:|---:|',
              ];
              for (const [i, item] of groups.entries()) {
                const tag = safeTag(item?.dimensions?.query).replace(/\|/g, '/').slice(0, 120);
                todayLines.push('| ' + (i + 1) + ' | ' + tag + ' | ' +
                  fmt(item?.sum?.rowsRead) + ' | ' + fmt(item?.count) + ' |');
              }
              if (!groups.length) todayLines.push('| - | 조회 결과 없음 | - | - |');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, todayLines.join('\n') + '\n');
              console.log('D1 DAILY and TODAY INSIGHTS succeeded; direct_D1_SQL=0');
            } catch (error) {
              console.warn('::warning::Today query breakdown unavailable: ' + error.message + '. No D1 SQL executed.');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '\n오늘 쿼리 TOP 10 조회 불가 (일별 사용량 분석은 정상 완료).\n');
            }
          })().catch(error => {
            console.error('::error::D1 daily Analytics query failed: ' + error.message + '; direct_D1_SQL=0');
            process.exit(1);
          });
          NODE
