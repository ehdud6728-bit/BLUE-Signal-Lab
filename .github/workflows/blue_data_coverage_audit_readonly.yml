name: BLUE D1 Query Insights (NO ROW SCAN)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-data-coverage-audit
  cancel-in-progress: false

jobs:
  inspect:
    name: Analyze D1 row-read usage via Cloudflare Analytics (no SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare Analytics token and scope (NO D1 SQL)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          if (!token || !accountId) {
            console.error('::error::Missing Cloudflare Analytics token or account ID secret.');
            process.exit(1);
          }
          const errorCodes = body => {
            const errors = Array.isArray(body?.errors) ? body.errors : [];
            const codes = errors.map(item => item?.extensions?.code ?? item?.code)
              .map(String).filter(code => /^(?:[0-9]{3,6}|[A-Z_]{2,40})$/.test(code));
            return codes.length ? codes.join(',') : 'none';
          };
          const request = async (url, options) => {
            try {
              const response = await fetch(url, { ...options, signal: AbortSignal.timeout(15000) });
              const body = await response.json().catch(() => null);
              return { response, body };
            } catch {
              console.error('::error::Cloudflare API network error or timeout (no D1 SQL executed).');
              process.exit(1);
            }
          };
          (async () => {
            const headers = { Authorization: 'Bearer ' + token };
            const verified = await request('https://api.cloudflare.com/client/v4/user/tokens/verify', { headers });
            const active = verified.response.ok && verified.body?.success === true && verified.body?.result?.status === 'active';
            console.log('TOKEN_VERIFY HTTP ' + verified.response.status + ' active=' + active + ' error_codes=' + errorCodes(verified.body));
            if (!active) {
              console.error('::error::Cloudflare token is not verified as active.');
              process.exit(1);
            }
            const query = 'query D1AnalyticsScope($accountTag: string!, $databaseId: string) { viewer { accounts(filter: { accountTag: $accountTag }) { d1AnalyticsAdaptiveGroups(limit: 1, filter: { databaseId: $databaseId }) { sum { readQueries } } } } }';
            const scope = await request('https://api.cloudflare.com/client/v4/graphql', {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables: { accountTag: accountId, databaseId: '272318c7-afd2-419c-91cc-dc59475ef87a' } }),
            });
            const accounts = scope.body?.data?.viewer?.accounts;
            const hasErrors = Array.isArray(scope.body?.errors) && scope.body.errors.length > 0;
            const analyticsAccessible = scope.response.ok && !hasErrors && Array.isArray(accounts) && accounts.length > 0;
            console.log('GRAPHQL_ANALYTICS HTTP ' + scope.response.status + ' account_accessible=' + analyticsAccessible + ' error_codes=' + errorCodes(scope.body));
            if (!analyticsAccessible) {
              console.error('::error::Analytics API unavailable for configured account. Check Account Analytics Read and account scope.');
              process.exit(1);
            }
            console.log('Preflight passed: active token and Analytics scope, zero D1 SQL queries.');
          })().catch(() => {
            console.error('::error::Unexpected Cloudflare Analytics preflight failure (no D1 SQL).');
            process.exit(1);
          });
          NODE
      - name: Query Insights only (DO NOT run D1 SELECT)
        shell: bash
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_ANALYTICS_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          npm install --no-audit --no-fund --legacy-peer-deps

          {
            echo "# BLUE Signal Lab · D1 쿼리 사용량 (Insights 전용)"
            echo ""
            echo "- 실행: ${GITHUB_RUN_ID} / $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "- 대상 DB: blue-signal-lab-db"
            echo "- 기간: 최근 7일 (일일 할당량과 직접 일치하지 않는 분석용 집계)"
            echo "- **운영 D1에 SELECT/COUNT/JOIN/UPDATE를 실행하지 않습니다.**"
            echo "- Cloudflare GraphQL Analytics API의 조회 결과만 사용합니다."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          insights_json="$(mktemp)"
          insights_error="$(mktemp)"
          trap 'rm -f "${insights_json}" "${insights_error}"' EXIT
          if ! npx wrangler d1 insights 272318c7-afd2-419c-91cc-dc59475ef87a --sort-by=reads --time-period=7d --limit=20 --json > "${insights_json}" 2> "${insights_error}"; then
            # Categorize Wrangler errors without printing raw stderr, SQL or credentials.
            reason="UNKNOWN_INSIGHTS_ERROR"
            guidance="Cloudflare Analytics API 접근 상태 및 Wrangler 버전을 확인하세요."
            if grep -Eiq 'permission|not authorized|unauthorized|forbidden|authentication|401|403|10000' "${insights_error}"; then
              reason="ANALYTICS_TOKEN_PERMISSION"
              guidance="분석 전용 토큰에 Account > Account Analytics > Read 권한과 정확한 계정 범위가 있는지 확인하세요."
            elif grep -Eiq 'unknown command|unknown argument|unknown option|invalid option|not found: d1 insights' "${insights_error}"; then
              reason="WRANGLER_COMMAND_COMPATIBILITY"
              guidance="Wrangler 버전과 d1 insights 명령 지원 여부를 확인하세요."
            elif grep -Eiq 'database.*(not found|does not exist|unknown)|unknown database|404' "${insights_error}"; then
              reason="DATABASE_IDENTIFIER_OR_ACCESS"
              guidance="D1 데이터베이스 ID와 분석 전용 토큰의 계정 범위를 확인하세요."
            fi
            echo "::error::D1 Insights 조회 실패 [${reason}]. ${guidance} 운영 D1 직접 SQL 조회는 수행하지 않았습니다."
            {
              echo "## 조회 불가"
              echo "- 분류: \`${reason}\`"
              echo "- 대응: ${guidance}"
              echo "- 보안상 Wrangler 원본 오류 메시지와 SQL을 출력하지 않습니다."
              echo "- **운영 D1 테이블을 조회하지 않았습니다.**"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          node - "${insights_json}" <<'NODE'
          const fs = require('node:fs');
          let parsed;
          try {
            parsed = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (error) {
            console.error('::error::Insights returned unreadable JSON. No D1 table queries were executed.');
            process.exit(1);
          }
          const results = Array.isArray(parsed) ? parsed : Array.isArray(parsed.data) ? parsed.data : [];
          if (results.length === 0 && !Array.isArray(parsed) && !Array.isArray(parsed.data)) {
            console.error('::error::Unexpected Insights JSON shape. No D1 table queries were executed.');
            process.exit(1);
          }

          const num = value => {
            const n = Number(value);
            return Number.isFinite(n) ? n.toLocaleString('en-US') : '-';
          };
          const safeTag = sql => {
            const cleaned = String(sql || '').replace(/'(?:''|[^'])*'/g, '?').replace(/\b\d+(?:\.\d+)?\b/g, '?');
            const op = cleaned.match(/\b(SELECT|INSERT|UPDATE|DELETE|REPLACE|WITH)\b/i)?.[1]?.toUpperCase() || 'SQL';
            const tables = [];
            const regex = /\b(?:FROM|JOIN|INTO|UPDATE)\s+(?:"([^"]+)"|`([^`]+)`|([A-Za-z_][\w.]*))/gi;
            for (const match of cleaned.matchAll(regex)) {
              const name = match[1] || match[2] || match[3];
              if (name && !tables.includes(name) && tables.length < 4) tables.push(name);
            }
            return op + (tables.length ? ' / ' + tables.join(', ') : ' / table unknown');
          };
          const lines = [
            '## 가장 많은 행을 읽은 쿼리 유형 TOP 20',
            '',
            '| 순위 | SQL 유형 / 테이블 | 7일 총 읽은 행 | 실행 횟수 | 1회 평균 읽은 행 |',
            '|---:|---|---:|---:|---:|',
          ];
          for (const [i, item] of results.entries()) {
            const tag = safeTag(item.query).replace(/\|/g, '/').slice(0, 120);
            lines.push(`| ${i + 1} | ${tag} | ${num(item.totalRowsRead)} | ${num(item.numberOfTimesRun)} | ${num(item.avgRowsRead)} |`);
          }
          if (results.length === 0) lines.push('| - | 해당 기간 조회 결과 없음 | - | - | - |');
          lines.push('', '원본 SQL 및 쿼리의 문자열 값은 보안상 공개 로그에 표시하지 않습니다.', '');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          console.log('D1 Insights analyzed. Operations: 0 direct D1 SQL queries.');
          NODE
