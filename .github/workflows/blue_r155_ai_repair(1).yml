      - name: Validate source anchors and patch only approved AI components
        shell: bash
        run: |
          set -euo pipefail
          python scripts/blue_r155_install.py --check
          python scripts/blue_r155_install.py --apply
          python - <<'PYASSERT'
          from pathlib import Path
          main=Path('web/src/main.tsx').read_text()
          css=Path('web/src/r155-ai-repair.css').read_text()
          basket=Path('web/src/SmartBasket.tsx').read_text()
          api=Path('worker/src/basket.ts').read_text()
          assert 'R155_AI_REPAIR' in main and "import './r155-ai-repair.css';" in main
          assert '.ai-panel .ai-heading' in css and '.ai-panel .ai-primary' in css
          assert 'AI_QUOTA' in api and 'AI_MODEL_UNAVAILABLE' in api
          assert "responseMimeType:'application/json'" in api
          assert 'HTTP ${r.status}' in basket
          assert 'blue_r15_basket_v1' in basket
          assert 'R153_PERFORMANCE_MONITOR' in basket
          assert 'R154_CLARITY' in main
          tests=Path('tests/test_basket_r15.mjs').read_text()
          assert 'res.status,429' in tests
          print('R155_AI_STYLE_AND_DIAGNOSTIC_ASSERT_PASS')
          PYASSERT
          git diff --stat
      - name: Test pre-existing basket API validation
        shell: bash
        run: node --experimental-strip-types --test tests/test_basket_r15.mjs
      - name: Build production React UI
        shell: bash
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Check API Worker bundle without deployment
        shell: bash
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r155-api-build
      - name: Commit tested AI UI and error improvements if approved
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/blue_r155_install.py web/src/r155-ai-repair.css web/src/main.tsx web/src/SmartBasket.tsx worker/src/basket.ts tests/test_basket_r15.mjs
          if git diff --cached --quiet; then
            echo R155_ALREADY_INSTALLED
          else
            git config user.name 'BLUE R1.5.5 AI installer'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'BLUE R1.5.5: restore AI panel styles and sanitized candidate error diagnostics'
            git push origin HEAD:main
          fi
      - name: Explain deployment boundary
        shell: bash
        run: |
          echo R155_TEST_AND_BUILD_PASS
          echo 'When false: repeat with apply_changes=true to commit.'
          echo 'When true: deploy existing API using blue_kis_r14_deploy_api.yml, and verify frontend Cloudflare deployment.'
          echo 'KIS collector has NO changes and does NOT need redeploy.'
          echo 'Gemini model availability, quotas and credentials are NOT verified by build. No live AI call was made.'
