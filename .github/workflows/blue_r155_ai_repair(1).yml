name: BLUE R1.5.5 AI Briefing Style + Candidate Error Repair (MANUAL)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE=test only. TRUE=commit reviewed AI UI and error improvements to main.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r155-ai-repair
  cancel-in-progress: false
jobs:
  verify_and_optional_apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Guard repository and branch
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
