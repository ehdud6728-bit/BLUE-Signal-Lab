name: BLUE Provisional Pattern Publish
on:
  # KST weekdays: 09:20-14:20 every 30 min, 14:35-15:25 every 10 min,
  # 15:50, 18:50 and 20:20. 20 scheduled opportunities, not guaranteed execution times.
  # Saved quotes only; no KIS calls. Gate skips unchanged/unavailable quotes.
  schedule:
    - cron: '20,50 0-4 * * 1-5'
    - cron: '20,35,45,55 5 * * 1-5'
    - cron: '5,15,25,50 6 * * 1-5'
    - cron: '50 9 * * 1-5'
    # Final saved daily-bar observation after extended trading; not an aftermarket price.
    - cron: '20 11 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry_run validates only; apply writes isolated provisional pattern tables'
        type: choice
        options:
          - dry_run
          - apply
        default: dry_run
        required: true
concurrency:
  group: blue-provisional-pattern-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix tools/turso install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Check current-day publication eligibility
        id: gate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node tools/turso/provisional-publication-gate.mjs
      - name: Export saved quotes (read only)
        if: steps.gate.outputs.ready == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p output/provisional
          DAY=$(TZ=Asia/Seoul date +%F)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          node tools/turso/provisional-input-export.mjs "$DAY" output/provisional/quotes --quotes-only
          python3 -c 'import json; m=json.load(open("output/provisional/quotes.meta.json")); print(m)'
      - name: Ensure usable current-session evidence
        id: evidence
        if: steps.gate.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          m=json.load(open("output/provisional/quotes.meta.json"))
          n=m["eligible"]
          if type(n) is not int or n<0:
              raise ValueError("INVALID_ELIGIBLE_COUNT")
          ready=n>0
          print("BLUE_PROVISIONAL_EXPORT_GATE",json.dumps({"ready":ready,"eligible":n,"reason":"USABLE_QUOTES" if ready else "NO_VALID_CURRENT_SESSION_QUOTES"}))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("ready="+str(ready).lower()+"\n")
          if not ready and os.environ["GITHUB_EVENT_NAME"]!="schedule":
              raise ValueError("NO_VALID_CURRENT_SESSION_QUOTES")
          PY
      - uses: actions/setup-python@v5
        if: steps.evidence.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests pyarrow pykrx
        if: steps.evidence.outputs.ready == 'true'
      - name: Resolve public MARCAP source revision
        id: marcap
        if: steps.evidence.outputs.ready == 'true'
        run: |
          REF=$(python -c 'import json; print(json.load(open("output/provisional/quotes.meta.json"))["reference"])')
          REV=$(timeout 20s git ls-remote https://github.com/FinanceData/marcap.git refs/heads/master | awk '$2=="refs/heads/master" {print $1}') || REV=
          if [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision=$REV" >> "$GITHUB_OUTPUT"
            echo "year=${REF:0:4}" >> "$GITHUB_OUTPUT"
          else
            echo "BLUE_MARCAP_CACHE_BYPASS: source revision unavailable"
          fi
      - name: Restore exact public MARCAP source cache
        id: marcap_cache
        if: steps.evidence.outputs.ready == 'true' && steps.marcap.outputs.revision != ''
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: output/provisional/marcap-cache
          key: blue-marcap-raw-v1-${{ steps.marcap.outputs.year }}-${{ steps.marcap.outputs.revision }}
      - name: Prepare verified reference history
        if: steps.evidence.outputs.ready == 'true'
        env:
          KRX_DATA_ID: ${{ secrets.KRX_DATA_ID }}
          KRX_DATA_PW: ${{ secrets.KRX_DATA_PW }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          MARCAP_REVISION: ${{ steps.marcap.outputs.revision }}
        run: |
          REF=$(python -c 'import json; print(json.load(open("output/provisional/quotes.meta.json"))["reference"])')
          ARGS=()
          if [[ -n "$MARCAP_REVISION" ]]; then
            ARGS+=(--marcap-revision "$MARCAP_REVISION" --cache-dir output/provisional/marcap-cache)
          fi
          python scripts/provisional_history.py --reference "$REF" --output output/provisional/history.csv "${ARGS[@]}"
      - name: Save validated public MARCAP bytes only
        if: steps.evidence.outputs.ready == 'true' && steps.marcap.outputs.revision != '' && steps.marcap_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: output/provisional/marcap-cache
          key: blue-marcap-raw-v1-${{ steps.marcap.outputs.year }}-${{ steps.marcap.outputs.revision }}
      - name: Scan provisional patterns
        if: steps.evidence.outputs.ready == 'true'
        run: |
          python -c 'import json; assert json.load(open("output/provisional/quotes.meta.json"))["eligible"]>0,"NO_VALID_KIS_QUOTES"'
          python scripts/provisional_pipeline.py --history output/provisional/history.csv --quote-prefix output/provisional/quotes --day "$DAY" --now "$(date -u +%FT%TZ)" --output output/provisional/result.json
      - name: Validate and optionally publish provisional snapshot
        if: steps.evidence.outputs.ready == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PUBLISH_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        run: |
          set -o pipefail
          node tools/turso/provisional-pattern-publish.mjs output/provisional/result.json output/provisional/quotes.quotes.json "$PUBLISH_MODE" 2>&1 | tee output/provisional/publish.log
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && steps.gate.outputs.ready == 'true'
        with:
          name: provisional-publication
          path: |
            output/provisional/*.meta.json
            output/provisional/result.json
            output/provisional/publish.log
          if-no-files-found: ignore
          retention-days: 3
