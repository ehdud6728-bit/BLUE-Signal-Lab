      - name: Validate existing source is exact expected tested version
        shell: bash
        run: python "$RUNNER_TEMP/blue_r15112/patcher.py" --bundle "$RUNNER_TEMP/blue_r15112" --check-only
      - name: Apply patch to CI checkout only
        shell: bash
        run: python "$RUNNER_TEMP/blue_r15112/patcher.py" --bundle "$RUNNER_TEMP/blue_r15112"
      - name: Install offline analysis regression dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.0,<3'
      - name: Verify no future data and small-sample forecasts
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_zone_pattern_forecast_r15112.py' -v
          python -m unittest discover -s tests -p 'test_zone_reaction_r15111.py' -v
          python -m unittest discover -s tests -p 'test_supply_profile_r15110.py' -v
          python -m unittest discover -s tests -p 'test_chart_research_r159.py' -v
          python -m py_compile scripts/zone_reaction_r15111.py scripts/zone_pattern_forecast_r15112.py
      - name: Build existing React PWA with optional low-sample outlook
        shell: bash
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Verify exact changed-source scope
        shell: bash
        run: |
          python - <<'PY_SCOPE'
          import subprocess
          tracked=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          new=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          expected={'scripts/zone_reaction_r15111.py','scripts/zone_pattern_forecast_r15112.py',
            'tests/test_zone_pattern_forecast_r15112.py','web/src/ZoneReactionPanel.tsx',
            'web/src/zone-reaction-panel.css'}
          assert tracked|new==expected,(sorted(tracked),sorted(new),sorted(expected))
          print('BLUE_R15112_SCOPE_OK',sorted(expected))
          PY_SCOPE
      - name: Commit source only when explicitly requested (no Cloudflare or D1 writes)
        if: ${{ inputs.apply_changes == true }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/zone_reaction_r15111.py scripts/zone_pattern_forecast_r15112.py tests/test_zone_pattern_forecast_r15112.py web/src/ZoneReactionPanel.tsx web/src/zone-reaction-panel.css
          git commit -m 'BLUE R1.5.10.12: pattern-similar zone reaction and cautious outlook'
          git push origin HEAD:main
          echo 'BLUE_R15112_COMMITTED_SOURCE_ONLY_NO_DEPLOY'
      - name: Test-only successful (no GitHub source modification)
        if: ${{ inputs.apply_changes != true }}
        shell: bash
        run: echo 'BLUE_R15112_VERIFIED_ONLY_NO_DEPLOY_NO_D1_WRITES'
