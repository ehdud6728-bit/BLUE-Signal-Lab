name: BLUE R1.5.10.12 Pattern-Conditioned Zone Outlook (MANUAL SAFE)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE dry-runs tests only. TRUE commits validated source to main. No deployment, D1 or trading operations.'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: blue-r15112-source-install
  cancel-in-progress: false
jobs:
  source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard exact repository and branch
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ignore build output in scope check
        shell: bash
        run: |
          cat >> .git/info/exclude <<'IGNORE_BUILD'
          **/node_modules/
          **/dist/
          **/__pycache__/
          **/*.pyc
          **/*.tsbuildinfo
          IGNORE_BUILD
