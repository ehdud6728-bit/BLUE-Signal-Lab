              for name in z.namelist():
                  p=Path(name)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  data=z.read(name)
                  if p.exists() and p.read_bytes()!=data:
                      raise SystemExit('R152_EXISTING_FILE_MISMATCH '+name)
                  p.write_bytes(data)
                  print('R152_RESTORED',name)
          PYRESTORE
      - name: Validate source anchors and patch UI only (runner worktree)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/blue_r152_ui_install.py --check
          python scripts/blue_r152_ui_install.py
          python - <<'PYASSERT'
          from pathlib import Path
          main=Path('web/src/main.tsx').read_text()
          basket=Path('web/src/SmartBasket.tsx').read_text()
          live=Path('web/src/LiveMarket.tsx').read_text()
          assert 'R152_FOUR_TABS' in main and 'R152_COMPACT_BASKET' in basket and 'R152_TRACKING_ACTIVE' in live
          assert main.count('role="tab"') >= 4
          assert main.count('<LiveMarket active=') == 1
          assert '검색 결과에서 담기 아이콘' in basket
          assert 'r152-basket-kpis' in basket and 'r152-record-more' in basket
          assert "blue_r15_basket_v1" in basket and "r151-quick-add" in main
          print('R152_FOUR_TABS_AND_BASKET_ASSERT_OK')
          PYASSERT
      - name: Build React/TypeScript web
        shell: bash
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Commit only approved R1.5.2 frontend changes
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
