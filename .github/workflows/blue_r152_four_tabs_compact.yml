  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE = test + build only. TRUE = commit tested frontend UI files to main.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r152-four-tabs-compact
  cancel-in-progress: false
