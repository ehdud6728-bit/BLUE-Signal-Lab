name: BLUE Turso vs D1 KIS Quote Parity (BOUNDED READ ONLY)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'turso_only reads only Turso; compare_small reads at most six D1 exact keys'
        type: choice
        required: true
        default: turso_only
        options: [turso_only, compare_small]
      day_kst:
        description: 'KST YYYY-MM-DD, blank = today (past seven days only)'
        type: string
        required: false
        default: ''
      confirm_d1_read:
        description: 'For compare_small enter exactly blue-d1-bounded-read after checking D1 quota'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: blue-turso-d1-quote-parity-readonly
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Guard exact repo and default branch
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Turso client
        working-directory: tools/turso
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Verify bounded audit with fake data only
        run: node --test tools/turso/quote-parity-audit.test.mjs
      - name: Run bounded production read-only audit
        env:
          AUDIT_MODE: ${{ inputs.mode }}
          AUDIT_DAY_KST: ${{ inputs.day_kst }}
          CONFIRM_D1_READ: ${{ inputs.confirm_d1_read }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/turso/quote-parity-audit.mjs
