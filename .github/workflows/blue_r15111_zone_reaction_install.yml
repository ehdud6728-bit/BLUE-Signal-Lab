name: BLUE R1.5.10.11 Zone Reaction Historical Validation (MANUAL SAFE)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE tests only. TRUE commits source to main. Never deploys or touches D1.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r15111-research-install
  cancel-in-progress: false
jobs:
  research_source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard repository and main branch
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ignore local build and Python caches for file-scope validation
        shell: bash
        run: |
          cat >> .git/info/exclude <<'IGNORE_BUILD'
          **/node_modules/
          **/dist/
          **/__pycache__/
          **/*.pyc
          **/*.tsbuildinfo
          IGNORE_BUILD
