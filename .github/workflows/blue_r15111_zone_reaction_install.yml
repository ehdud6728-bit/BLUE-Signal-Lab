      - name: Validate exact source anchors before patching
        shell: bash
        run: python "$RUNNER_TEMP/blue_r15111/patcher.py" --bundle "$RUNNER_TEMP/blue_r15111" --check-only
      - name: Apply source patch inside workflow checkout only
        shell: bash
        run: python "$RUNNER_TEMP/blue_r15111/patcher.py" --bundle "$RUNNER_TEMP/blue_r15111"
      - name: Install offline Python test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.0,<3'
      - name: Validate historical classification and current chart research
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_zone_reaction_r15111.py' -v
          python -m unittest discover -s tests -p 'test_supply_profile_r15110.py' -v
          python -m unittest discover -s tests -p 'test_chart_research_r159.py' -v
          python -m py_compile scripts/zone_reaction_r15111.py scripts/chart_research_r10.py
      - name: Build existing React PWA with reaction panel
        shell: bash
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Ensure only intended source files changed
        shell: bash
        run: |
          python - <<'PY_SCOPE'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          added=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          expected={'scripts/chart_research_r10.py','scripts/zone_reaction_r15111.py',
                    'tests/test_zone_reaction_r15111.py','web/src/StockChart.tsx',
                    'web/src/ZoneReactionPanel.tsx','web/src/zone-reaction-panel.css'}
          assert changed|added==expected,(sorted(changed),sorted(added),sorted(expected))
          print('BLUE_R15111_SCOPE_OK',sorted(expected))
          PY_SCOPE
      - name: Commit validated source only if user opted in
        if: ${{ inputs.apply_changes == true }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'MAIN_CHANGED_REVERIFY'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/chart_research_r10.py scripts/zone_reaction_r15111.py tests/test_zone_reaction_r15111.py web/src/StockChart.tsx web/src/ZoneReactionPanel.tsx web/src/zone-reaction-panel.css
          git commit -m 'BLUE R1.5.10.11: as-of historical zone breakout/pullback research'
          git push origin HEAD:main
          echo 'BLUE_R15111_SOURCE_COMMITTED_NO_DEPLOY_NO_D1_WRITE'
      - name: Verify-only success
        if: ${{ inputs.apply_changes != true }}
        run: echo 'BLUE_R15111_VERIFIED_NO_SOURCE_COMMIT_NO_DEPLOY_NO_D1_WRITE'
