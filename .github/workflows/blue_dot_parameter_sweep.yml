name: BLUE Dotted Formula Parameter Sensitivity (MANUAL / READ ONLY)

on:
  pull_request:
    paths:
      - 'scripts/blue_dot_parameter_sweep.py'
      - 'scripts/blue_dot_2026_research.py'
      - 'scripts/env20_rebound_comparison.py'
      - 'tests/test_blue_dot_parameter_sweep.py'
      - '.github/workflows/blue_dot_parameter_sweep.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan (no market data) or study (pinned public history)'
        type: choice
        options: [plan, study]
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: blue-dotted-tuning-research
  cancel-in-progress: false

jobs:
  sensitivity:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'plan' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline math and pinned market calendar
        run: |
          python -m pip install 'pandas>=2,<3' 'numpy>=1.24,<3' \
            'pyarrow>=17,<24' 'exchange_calendars==4.13.3'
      - name: Verify candidate grid and no-lookahead invariants
        run: |
          python3 -m unittest discover -s tests -p 'test_blue_dot_parameter_sweep.py' -v
          python3 -m unittest discover -s tests -p 'test_blue_dot_2026_research.py' -v
      - name: Print frozen parameter plan without market downloads
        if: env.MODE == 'plan'
        run: python3 scripts/blue_dot_parameter_sweep.py --mode=plan
      - name: Require manual study on main only
        if: env.MODE == 'study'
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
      - name: Retrieve only two pinned public parquet files
        if: env.MODE == 'study'
        run: |
          set -euo pipefail
          mkdir -p output/blue_dot_tuning/sources
          for YEAR in 2025 2026; do
            curl --fail --location --retry 2 --silent --show-error \
              --output "output/blue_dot_tuning/sources/marcap-$YEAR.parquet" \
              "https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-$YEAR.parquet"
          done
      - name: Run historical parameter sensitivity without publishing signals
        if: env.MODE == 'study'
        run: |
          python3 scripts/blue_dot_parameter_sweep.py --mode=study \
            --source-dir output/blue_dot_tuning/sources \
            --out output/blue_dot_tuning/report.json
      - name: Archive aggregate study only with no raw market bars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_DOTTED_TUNING_${{ github.run_id }}
          path: output/blue_dot_tuning/report.json
          if-no-files-found: ignore
          retention-days: 14
