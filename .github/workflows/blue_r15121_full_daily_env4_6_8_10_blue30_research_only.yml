      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned offline research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'requests==2.32.5'

      - name: Run full-market, future-censor and shifted-entry unit tests
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15121" -p test_study.py -v

      - name: Backtest each daily stock candle with 100-300-500eok tiers
        run: |
          python -B "$RUNNER_TEMP/r15121/study.py" \
            --input "$RUNNER_TEMP/r15121" \
            --output output/r15121_full_market

      - name: Verify complete files and LNF 8-07 then 8-10 anchor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out = Path('output/r15121_full_market')
          required = ('AUDIT.json', 'README_KO.md', 'FULL_MARKET_ENV_EVENTS.csv',
                      'FULL_MARKET_5_10_20D_COMPARISON.csv',
                      'BLUE30_DEDUPED_CONFIRMATIONS.csv')
          if any(not (out/n).is_file() or (out/n).stat().st_size < 80 for n in required):
              raise SystemExit('R15121_REQUIRED_OUTPUT_MISSING')
          audit=json.loads((out/'AUDIT.json').read_text(encoding='utf-8'))
          if not (audit['version'].startswith('R15121_FULL_DAILY')
                  and audit['read_only'] and audit['no_d1_write']
                  and audit['no_deploy'] and audit['live_search_watch_unchanged']
                  and audit['population']['raw_market_daily_rows'] > 500000
                  and audit['elnf_audit']['blue30_lower_followup_day'] == '2026-08-10'):
              raise SystemExit('R15121_SOURCE_OR_DATA_INTEGRITY_FAILURE')
          d=pd.read_csv(out/'FULL_MARKET_5_10_20D_COMPARISON.csv')
          if not {'100', '300', '500'}.issubset(set(d.amount_ge_eok.astype(str).str.replace('.0','', regex=False))):
              raise SystemExit('R15121_TIER_SUMMARY_INCOMPLETE')
          print('R15121_COMPLETE_INDEPENDENT_DAILY_STUDY_VERIFIED')
          PY

      - name: Upload independent full-daily-market study (30 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15121_FULL_MARKET_DAILY_${{ github.run_id }}
          path: output/r15121_full_market/
          if-no-files-found: error
          retention-days: 30
