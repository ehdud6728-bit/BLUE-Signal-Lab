# BLUE R1.5.10.21: stand-alone read-only full-daily-market study.
# Place only this YML in .github/workflows/ and run manually.
# Full source at immutable FinanceData/marcap commit with R15117 SHA256 hashes.
# Same 30/2/26 lower-band BLUE hypothesis, not HTS proprietary formula proof.
name: BLUE R1.5.10.21 Full Daily ENV and BLUE (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Enter RESEARCH_ONLY; no LIVE, SEARCH, WATCH or D1 writes.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blue-r15121-fullmarket-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily_full_universe:
    name: env_threshold_vs_blue_followup_all_stock_days
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require exact repository and research-only input
        env:
          CONFIRM: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM" = 'RESEARCH_ONLY'
          echo 'INDEPENDENT_FULL_DAILY_RESEARCH_NO_PRODUCTION_WRITES'

