name: BLUE Tomato Context Pilot (READ ONLY)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/turso/tomato-context-export*'
      - 'research/pattern_performance_tomato_context.py'
      - 'research/test_pattern_performance_tomato_context.py'
      - 'research/pattern_scaleout.py'
      - 'research/test_pattern_scaleout.py'
      - '.github/workflows/blue_tomato_context.yml'
permissions:
  contents: read
concurrency:
  group: blue-tomato-context
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tools/turso --no-audit --no-fund --ignore-scripts --no-package-lock
      - run: npm install --prefix collector --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Offline tests
        run: |
          node --test tools/turso/tomato-context-export.test.mjs tools/turso/full-universe-export.test.mjs
          python3 research/test_pattern_performance_tomato_context.py
          python3 research/test_pattern_scaleout.py
      - name: Verify actual bounded original source and compare exact selected setups
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ehdud6728-bit/BLUE-Signal-Lab'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          BLUE_BENCHMARK_STATE_FILE: output/full-universe/benchmark.json
        run: |
          set -euo pipefail
          node tools/turso/full-universe-export.mjs
          node collector/src/market-trends.mjs benchmark_inspect
          node tools/turso/tomato-context-export.mjs
          python3 research/pattern_performance_tomato_context.py --out output/tomato/report.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: BLUE_TOMATO_CONTEXT_HIGH_V5
          path: output/tomato/report.json
          if-no-files-found: error
          retention-days: 14
