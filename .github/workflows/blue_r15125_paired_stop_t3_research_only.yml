      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned data research libraries
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'requests==2.32.5'

      - name: Test stop risk widths simultaneous touches and t3 execution order
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15125" -p test_study.py -v

      - name: Calculate full-market paired scenarios without modifying production
        run: |
          python -B "$RUNNER_TEMP/r15125/study.py" \
            --input "$RUNNER_TEMP/r15125" \
            --output output/r15125_paired_risk

      - name: Verify output baseline population paired DBH and audit flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=Path('output/r15125_paired_risk')
          files=('PAIRED_STOP_TP_T3_SUMMARY.csv',
                 'ENV6_500EOK_PAIRED_CASES.csv',
                 'DBH_2026-05-21_PAIRED_CASES.csv',
                 'AUDIT.json', 'README_KO.md')
          if any(not (o/f).is_file() or (o/f).stat().st_size < 80 for f in files):
              raise SystemExit('R15125_MISSING_RESULT_FILE')
          a=json.loads((o/'AUDIT.json').read_text(encoding='utf-8'))
          if not (a['version'].startswith('R15125_') and a['read_only']
                  and a['no_d1_write'] and a['no_deploy']
                  and a['no_live_or_search_modification']
                  and a['r15121_population_identical']
                  and a['signal_rows'] == 63712
                  and a['state_rows'] == 190759
                  and a['paired_500eok_env6_rows'] > 40000
                  and abs(a['dbh_anchor']['signal_peak_high_pct']-28.9149888143)<.02
                  and abs(a['dbh_anchor']['signal_final_pct']+11.1856823266)<.02):
              raise SystemExit('R15125_PINNED_POPULATION_OR_DBH_FAILURE')
          print('R15125_PAIRED_RISK_AND_T3_CONFIRMED')
          PY

      - name: Upload isolated research artifact for 30 days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15125_PAIRED_RISK_${{ github.run_id }}
          path: output/r15125_paired_risk/
          if-no-files-found: error
          retention-days: 30
