      - name: Enforce exact non-workflow changed-file scope
        shell: bash
        run: |
          python - <<'PYSCOPE'
          import subprocess
          expected={'scripts/market_scan_r08_diagnostics.py','scripts/csv_to_d1.py',
            'worker/src/index.ts','web/src/main.tsx','web/src/SmartBasket.tsx',
            'web/src/StockChart.tsx','web/src/r1599-pattern-filters.css'}
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines() if line.strip()}
          assert changed==expected,('R1599_CHANGED_SCOPE_MISMATCH',sorted(changed))
          assert all(not p.startswith('.github/workflows/') for p in changed)
          print('BLUE_R1599_SCOPE_PASS',sorted(changed))
          # Ignore build-only dependencies and output in the runner's local git exclude.
          with open('.git/info/exclude','a',encoding='utf-8') as f:
              f.write('\n/web/node_modules/\n/web/dist/\n/worker/node_modules/\n*.tsbuildinfo\n')
          PYSCOPE
      - name: Python tests for original scanning and chart evidence
        shell: bash
        run: |
          python -m pip install 'pandas>=2,<4' 'numpy>=1.26,<3'
          python -m unittest discover -s tests -p 'test_market_scan.py' -v
          python -m unittest discover -s tests -p 'test_chart_research_r159.py' -v
          python - <<'PYTEST'
          import json,tempfile,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from csv_to_d1 import pattern_highlights
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'chart_snapshots.jsonl'
              p.write_text(json.dumps({'code':'005930','day':'2026-11-11','stats':{'setups':[
                {'label':'4 cases','horizons':{'10':{'n':4,'up_pct':100}}},
                {'label':'qualifies at configurable 60','horizons':{'10':{'n':12,'up_pct':65,
                  'median_return_pct':2.5,'mean_return_pct':1.6,'cases':[
                   {'signal_day':'2026-09-08'},{'signal_day':'2026-10-10'},
                   {'signal_day':'2026-12-01'}]}}}
              ]}}),encoding='utf-8')
              a=pattern_highlights(d)[('005930','2026-11-11')]
              assert a['r159_pattern_n_10d']==12 and a['r159_pattern_up_10d']==65
              assert json.loads(a['r159_pattern_signal_days_10d_json'])==['2026-09-08','2026-10-10']
              print('BLUE_R1599_PATTERN_EVIDENCE_AND_DATES_PASS')
          PYTEST
      - name: Web frontend TypeScript and Vite production build
        working-directory: web
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Worker API dry run only (no Cloudflare deployment)
        working-directory: worker
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/blue-r1599-api-build
      - name: Recheck file scope after builds
        shell: bash
        run: |
          python - <<'PYFINAL'
          import subprocess
          expected={'scripts/market_scan_r08_diagnostics.py','scripts/csv_to_d1.py',
            'worker/src/index.ts','web/src/main.tsx','web/src/SmartBasket.tsx',
            'web/src/StockChart.tsx','web/src/r1599-pattern-filters.css'}
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines() if line.strip()}
          assert changed==expected,('R1599_UNEXPECTED_BUILD_FILES',sorted(changed))
          PYFINAL
      - name: Commit approved source only after user explicit approval
        if: inputs.apply_changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/market_scan_r08_diagnostics.py scripts/csv_to_d1.py worker/src/index.ts \
            web/src/main.tsx web/src/SmartBasket.tsx web/src/StockChart.tsx \
            web/src/r1599-pattern-filters.css
          git diff --cached --quiet || {
            git commit -m 'BLUE R1.5.9.9: configurable 500eok filter and shared historical pattern tomato'
            git push origin HEAD:main
          }
      - name: Explicit non-deployment boundary
        shell: bash
        run: |
          echo 'BLUE_R1599_TESTS_PASS'
          echo 'No live KIS calls, D1 writes, orders or Cloudflare deployment.'
          echo 'Amount filtering on legacy rows requires an explicit new verified EOD scan and import.'
          echo 'API Worker and web need separately verified deployment after commit.'
