      apply_changes:
        description: 'FALSE validates only. TRUE commits the seven approved non-workflow source files after tests pass.'
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: blue-r1599-safe-source-update
  cancel-in-progress: false

