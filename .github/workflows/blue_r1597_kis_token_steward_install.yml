name: BLUE R1.5.9.7 Install KIS Daily Token Manager (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE validate-only. TRUE commit tested token steward files and close legacy issuance bypass.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r1597-install-single
  cancel-in-progress: false

jobs:
  validate_and_optional_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Guard repository and target branch
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect exact current read-only vault and legacy issuance path
        shell: bash
        run: |
          python - <<'PYGUARD'
          from pathlib import Path
          root=Path('.')
          src=(root/'scripts/blue_kis_token_vault_r131.py').read_text()
          legacy=(root/'.github/workflows/blue_kis_closing_r13_research_only.yml').read_text()
          assert 'def issue_new_token_once(' in src
          assert 'def obtain_token(' in src
          assert 'if not allow_new:' in src
          anchor="if [ \"$ALLOW_NEW_TOKEN\" = 'true' ]; then args+=(--allow-new-token); fi"
          assert legacy.count(anchor)==1,'R1597_LEGACY_GUARD_MISSING'
          print('R1597_SOURCE_ANCHORS_OK')
          PYGUARD
