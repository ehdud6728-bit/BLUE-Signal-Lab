                  file.parent.mkdir(parents=True,exist_ok=True)
                  file.write_bytes(package.read(rel))
          print('R1597_VERIFIED_PACKAGE_RESTORED')
          PYRESTORE
      - name: Disable legacy manual issuance bypass; preserve cache-only probes
        shell: bash
        run: |
          python - <<'PYLEGACY'
          from pathlib import Path
          p=Path('.github/workflows/blue_kis_closing_r13_research_only.yml')
          text=p.read_text()
          old="if [ \"$ALLOW_NEW_TOKEN\" = 'true' ]; then args+=(--allow-new-token); fi"
          new="if [ \"$ALLOW_NEW_TOKEN\" = 'true' ]; then echo \"R1597: use dedicated token steward for guarded issuance\"; exit 1; fi"
          assert text.count(old)==1,'R1597_LEGACY_ANCHOR_CHANGED'
          p.write_text(text.replace(old,new,1))
          print('R1597_LEGACY_ISSUANCE_DISABLED')
          PYLEGACY
      - name: Enforce strict changed-file scope
        shell: bash
        run: |
          python - <<'PYSCOPE'
          import subprocess
          from pathlib import Path
          expected={'.github/workflows/blue_kis_closing_r13_research_only.yml',
            '.github/workflows/blue_kis_daily_token_r1597.yml',
            'scripts/blue_kis_daily_token_r1597.py',
            'tests/test_blue_kis_daily_token_r1597.py'}
          out=subprocess.check_output(['git','status','--porcelain','-uall'],text=True)
          changed={line[3:] for line in out.splitlines() if line.strip()}
          assert changed==expected,('R1597_UNEXPECTED_SCOPE',sorted(changed))
          assert not subprocess.check_output(['git','diff','--name-only','--','scripts/blue_kis_token_vault_r131.py'],text=True).strip()
          assert 'schedule:' in Path('.github/workflows/blue_kis_daily_token_r1597.yml').read_text()
