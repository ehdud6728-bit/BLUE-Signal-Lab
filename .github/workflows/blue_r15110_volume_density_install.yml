      - name: Verify exact anchored source modifications before editing
        shell: bash
        run: python "$RUNNER_TEMP/blue_r15110/patcher.py" --bundle "$RUNNER_TEMP/blue_r15110" --check-only
      - name: Apply source patch only inside CI checkout
        shell: bash
        run: python "$RUNNER_TEMP/blue_r15110/patcher.py" --bundle "$RUNNER_TEMP/blue_r15110"
      - name: Install Python test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.0,<3'
      - name: Test no future bars, volume conservation, and grade meanings
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_supply_profile_r15110.py' -v
          python -m unittest discover -s tests -p 'test_chart_research_r159.py' -v
          python -m py_compile scripts/market_scan_r08_diagnostics.py scripts/supply_profile_r15110.py
      - name: Compile React TypeScript and build mobile app
        working-directory: web
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Verify scope exactly, no other files modified
        shell: bash
        run: |
          python - <<'PY_SCOPE'
          import subprocess
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          new=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed={'scripts/market_scan_r08_diagnostics.py','scripts/supply_profile_r15110.py',
            'web/src/StockChart.tsx','web/src/main.tsx','web/src/supply-profile.ts',
            'web/src/SupplyProfilePanel.tsx','web/src/supply-profile-panel.css',
            'tests/test_supply_profile_r15110.py'}
          assert modified|new==allowed,(sorted(modified),sorted(new),sorted(allowed))
          print('BLUE_R15110_SCOPE_OK',sorted(allowed))
          PY_SCOPE
      - name: Commit source only when explicitly chosen, never deploy or mutate D1
        if: ${{ inputs.apply_changes == true }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'MAIN_UPDATED_RESTART_INSTALL'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/market_scan_r08_diagnostics.py scripts/supply_profile_r15110.py web/src/StockChart.tsx web/src/main.tsx web/src/supply-profile.ts web/src/SupplyProfilePanel.tsx web/src/supply-profile-panel.css tests/test_supply_profile_r15110.py
          git commit -m 'BLUE R1.5.10.10: price-zone estimated volume density and graded chart'
          git push origin HEAD:main
          echo 'BLUE_R15110_SOURCE_COMMITTED_NO_DEPLOY_NO_EOD_DATA_CHANGE'
      - name: Verify-only result
        if: ${{ inputs.apply_changes != true }}
        run: echo 'BLUE_R15110_VERIFIED_SOURCE_NOT_COMMITTED_NO_DEPLOY'
