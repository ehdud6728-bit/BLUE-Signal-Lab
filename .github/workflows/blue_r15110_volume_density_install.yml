name: BLUE R1.5.10.10 Daily Volume Density Supply Explorer (MANUAL SAFE)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE: test only. TRUE: commit verified source changes to main. Never deploy or import D1.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r15110-volume-density-installer
  cancel-in-progress: false
jobs:
  source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Guard exact repo and main
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ignore generated build caches for scope verification
        shell: bash
        run: |
          cat >>.git/info/exclude <<'GIT_EXCLUDE'
          **/node_modules/
          **/dist/
          **/build/
          **/__pycache__/
          **/*.pyc
          **/*.tsbuildinfo
          GIT_EXCLUDE
