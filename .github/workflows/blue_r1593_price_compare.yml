      - name: Validate original anchors and apply only reviewed price UI + read-only API patch
        run: |
          python scripts/blue_r1593_install.py --check
          python scripts/blue_r1593_install.py --apply
          python -m py_compile scripts/blue_r1593_install.py
          python - <<'PYASSERT'
          from pathlib import Path
          main=Path('web/src/main.tsx').read_text()
          basket=Path('web/src/SmartBasket.tsx').read_text()
          worker=Path('worker/src/index.ts').read_text()
          assert 'PriceCompareMini' in main and 'fetchCompared(rows' in main
          assert 'r1593Prices' in basket and '후속 시세 미수집' in basket
          assert 'comparePrices(env.DB,u)' in worker and "if (!access)" in worker
          print('R1593_STATIC_ASSERTIONS_PASS')
          PYASSERT
      - name: Test installer idempotence and fail-closed source anchors
        run: python -m unittest discover -s tests -p 'test_r1593_installer.py' -v
      - name: Test price provenance, distinct dates, gaps and non-mutating API
        run: node --experimental-strip-types --test tests/test_r1593_compare.mjs
      - name: Install baseline Python test dependencies
        run: python -m pip install pandas numpy pyarrow requests 'pykrx==1.2.9' 'cryptography>=43,<48'
      - name: Run full repository Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Run existing AI smart basket API regression suite
        run: node --test tests/test_basket_r15.mjs
      - name: Build React TypeScript web UI without an absent package lock
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Compile-check isolated API Worker without deploying it
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r1593-worker-build
      - name: Assert exact changed-file scope, protect collectors and scan algorithms
        run: |
          python - <<'PYSCOPE'
          import subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          approved={'web/src/main.tsx','web/src/SmartBasket.tsx','worker/src/index.ts'}
          assert changed.issubset(approved),f'R1593_UNEXPECTED_TRACKED_CHANGE {sorted(changed)}'
          required={'scripts/blue_r1593_install.py','tests/test_r1593_compare.mjs','tests/test_r1593_installer.py','web/src/PriceCompareMini.tsx','web/src/price-compare.ts','web/src/r1593-price-compare.css','worker/src/price-compare.ts'}
          assert all(Path(p).is_file() for p in required),'R1593_MISSING_NEW_SOURCE'
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          sensitive={p for p in untracked if p.startswith(('collector/','.github/workflows/'))}
          assert not sensitive,f'R1593_UNEXPECTED_SENSITIVE_FILES {sorted(sensitive)}'
          print('R1593_SCOPE_OK',sorted(changed),sorted(required))
          PYSCOPE
      - name: Commit only successfully tested R1593 sources after explicit approval
        if: ${{ inputs.apply_changes }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.ts worker/src/price-compare.ts web/src/main.tsx web/src/SmartBasket.tsx web/src/price-compare.ts web/src/PriceCompareMini.tsx web/src/r1593-price-compare.css scripts/blue_r1593_install.py tests/test_r1593_installer.py tests/test_r1593_compare.mjs
          if git diff --cached --quiet; then
            echo 'R1593_ALREADY_INSTALLED'
          else
            git commit -m 'BLUE R1.5.9.3: verified saved prices and post-discovery period high in search and basket'
            git push origin HEAD:main
          fi
      - name: Final safety notes
        run: |
          echo 'R1593_ALL_TESTS_PASS'
          echo 'If apply_changes=false, rerun with true to commit.'
          echo 'Important: frontend and API Worker deployment are separate and NOT performed here.'
          echo 'No KIS direct per-result requests, no new D1 tables, no collector or Stock-Hunter changes.'
