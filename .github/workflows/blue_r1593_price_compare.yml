name: BLUE R1.5.9.3 Verified Price Comparison (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE: test only. TRUE: commit reviewed R1.5.9.3 sources to main after every check passes.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r1593-price-compare
  cancel-in-progress: false

