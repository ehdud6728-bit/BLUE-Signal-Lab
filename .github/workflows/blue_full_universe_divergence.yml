name: BLUE Full Universe Divergence Research (READ ONLY)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/turso/full-universe-export*'
      - 'tools/turso/research-v2-eod-export*'
      - 'collector/src/market-trends*'
      - 'research/pattern_performance_full_universe.py'
      - 'research/test_pattern_performance_full_universe.py'
      - '.github/workflows/blue_full_universe_divergence.yml'
permissions:
  contents: read
concurrency:
  group: blue-full-universe-divergence
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tools/turso --no-audit --no-fund --ignore-scripts --no-package-lock
      - run: npm install --prefix collector --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Offline hash and universe regression tests
        run: node --test tools/turso/research-v2-eod-export.test.mjs tools/turso/full-universe-export.test.mjs collector/src/market-trends.test.mjs collector/src/market-trends-regime.test.mjs
      - name: Offline divergence research tests
        run: python3 research/test_pattern_performance_full_universe.py
      - name: Actual audited full universe and two cached-token index calls
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ehdud6728-bit/BLUE-Signal-Lab'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          BLUE_BENCHMARK_STATE_FILE: output/full-universe/benchmark.json
        run: |
          set -euo pipefail
          node tools/turso/full-universe-export.mjs
          node collector/src/market-trends.mjs benchmark_inspect
          python3 research/pattern_performance_full_universe.py --source output/full-universe/source.json --benchmark output/full-universe/benchmark.json --out output/full-universe/report.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: BLUE_FULL_UNIVERSE_DIVERGENCE
          path: output/full-universe/report.json
          if-no-files-found: error
          retention-days: 14
