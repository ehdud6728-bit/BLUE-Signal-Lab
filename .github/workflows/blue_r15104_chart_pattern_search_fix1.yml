name: BLUE R1.5.10.4 FIX1 Chart-Backed Tomato and Applied Filter Fix (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE tests only. TRUE commits only 4 approved source files after tests and dry-run builds pass.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r15104-fix1-chart-evidence-search-fix
  cancel-in-progress: false

