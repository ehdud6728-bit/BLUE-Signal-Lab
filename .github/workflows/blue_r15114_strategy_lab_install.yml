name: BLUE R1.5.10.14 Strategy Lab EOD + 3min 100E Research (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE test only; TRUE commit isolated research sources. No D1 or Cloudflare changes.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r15114-strategy-lab-install
  cancel-in-progress: false

