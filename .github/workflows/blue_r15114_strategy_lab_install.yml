      - name: Install offline Python dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.0,<3'

      - name: Test 500eok EOD, ENV20-40 pullback, 2m/3m turnover and no future leakage
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s tests -p 'test_strategy_lab_r15114.py' -v
          python -B -m unittest discover -s tests -p 'test_supply_profile_r15110.py' -v
          python -B -m py_compile research/strategy_lab_r15114/__init__.py research/strategy_lab_r15114/daily.py research/strategy_lab_r15114/intraday.py research/strategy_lab_r15114/run.py

      - name: Check exact file changes; never touch search, KIS, D1 or UI
        shell: bash
        run: |
          find research/strategy_lab_r15114 tests -type d -name __pycache__ -prune -exec rm -rf {} +
          python - <<'PY_SCOPE'
          import subprocess
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed={'research/strategy_lab_r15114/README.md', 'tests/test_strategy_lab_r15114.py', 'research/strategy_lab_r15114/daily.py', 'research/strategy_lab_r15114/run.py', 'research/strategy_lab_r15114/__init__.py', 'research/strategy_lab_r15114/intraday.py'}
          if modified or untracked!=allowed:
              raise SystemExit(f'R15114_UNEXPECTED_CHANGED_PATHS modified={sorted(modified)} untracked={sorted(untracked)}')
          print('BLUE_R15114_SCOPE_VERIFIED',len(allowed),'research-only files')
          PY_SCOPE

      - name: Commit isolated research source only on explicit opt-in
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'MAIN_MOVED_RERUN_WORKFLOW'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/strategy_lab_r15114/__init__.py research/strategy_lab_r15114/daily.py research/strategy_lab_r15114/intraday.py research/strategy_lab_r15114/run.py research/strategy_lab_r15114/README.md tests/test_strategy_lab_r15114.py
          git diff --cached --check
          git commit -m 'BLUE R1.5.10.14: isolated EOD strategy and 3min turnover research lab'
          git push origin HEAD:main
          echo 'BLUE_R15114_SOURCE_COMMITTED_NO_WEB_DEPLOY_NO_D1_WRITE'

      - name: Verification-only success
        if: ${{ !inputs.apply_changes }}
        run: echo 'BLUE_R15114_VERIFIED_ONLY_NOT_COMMITTED_NO_DEPLOY_NO_D1_WRITE'
