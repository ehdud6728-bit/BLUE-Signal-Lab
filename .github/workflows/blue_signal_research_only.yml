# Replace THIS research workflow on future versions; never modify LIVE workflows.
# R15127: stop/target/time/gain-lock paired backtest; RESEARCH ONLY.
# Embedded pinned sources; no checkout, production API, DB or deploy access.
name: BLUE Research R1.5.10.27 Profit Exit Grid (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Enter RESEARCH_ONLY to run the isolated analysis.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blue-canonical-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profit_exit_lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Confirm read-only main-branch research request
        env:
          CONFIRM: ${{ inputs.confirm_research_only }}
