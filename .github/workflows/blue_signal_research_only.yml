      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'requests==2.32.5' \
            'scikit-learn==1.8.0'

      - name: Test the baseline simulator, no-lookahead and amount features
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15129" -p 'test_*.py' -v

      - name: Reproduce the frozen R15127 payoff experiment
        run: |
          python -B "$RUNNER_TEMP/r15129/study.py" \
            --input "$RUNNER_TEMP/r15129" \
            --output output/r15127_profit_exit

      - name: Reproduce frozen R15128 entry-risk scores
        run: |
          python -B "$RUNNER_TEMP/r15129/entry_risk.py" \
            --baseline output/r15127_profit_exit \
            --output output/r15128_entry_risk

      - name: Analyze R15129 turnover buildup and actual profit-loss cases
        run: |
          python -B "$RUNNER_TEMP/r15129/amount_study.py" \
            --r15127 output/r15127_profit_exit \
            --r15128 output/r15128_entry_risk \
            --output output/r15129_turnover_profit --full-daily

      - name: Verify no lookahead, 4096 events and report integrity
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          out=Path('output/r15129_turnover_profit')
          names=('ALL4096_TURNOVER_AND_EXIT_LABELS.csv',
            'PREDEFINED_TURNOVER_RULES_BY_YEAR.csv',
            'DISCOVERY_ONLY_SELECTED_RULES.csv',
            'SUCCESS_FAILURE_ACTUAL_CASES.csv',
            'SAME_STOCK_WIN_LOSS_REVERSALS.csv','AUDIT.json','README_KO.md')
          if any(not (out/n).is_file() or not (out/n).stat().st_size for n in names):
              raise SystemExit('R15129_MISSING_RESEARCH_OUTPUT')
          a=json.loads((out/'AUDIT.json').read_text())
          if not (a['read_only'] and a['no_d1_write'] and a['no_deploy']
            and a['no_live_or_search_modification'] and a['no_future_in_features']
            and a['full_daily_amount_history_verified'] and a['signals']==4096
            and not a['blind_holdout']):
              raise SystemExit('R15129_SAFETY_FLAGS_FAILED')
          d=pd.read_csv(out/'ALL4096_TURNOVER_AND_EXIT_LABELS.csv')
          s=pd.read_csv(out/'PREDEFINED_TURNOVER_RULES_BY_YEAR.csv')
          c=pd.read_csv(out/'SUCCESS_FAILURE_ACTUAL_CASES.csv')
          if len(d)!=4096 or len(c)!=40 or s.cohort.nunique()!=3:
              raise SystemExit('R15129_RESULT_ROW_COUNT_CHANGED')
          if d['prior5_vs_prior20_amount_ratio'].isna().any():
              raise SystemExit('R15129_AMOUNT_HISTORY_INCOMPLETE')
          print('R15129_VALIDATED_4096_EVENTS_AND_SIGNAL_DAY_MONEY_FLOW')
          PY

      - name: Upload isolated turnover and realized profit-case reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15129_TURNOVER_PROFIT_${{ github.run_id }}
          path: output/r15129_turnover_profit/
          if-no-files-found: error
          retention-days: 30
