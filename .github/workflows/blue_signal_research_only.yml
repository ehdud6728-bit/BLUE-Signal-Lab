# VERSION: R1.5.10.29 (R15129) - Turnover Profit vs Failure
# Upload/replace EXACTLY: .github/workflows/blue_signal_research_only.yml
# This is the ONE canonical manual research workflow, not a second parallel workflow.
# R15129: signal-date turnover buildup and realized payoff, no deployment.
name: BLUE Research R1.5.10.29 Turnover Profit vs Failure (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Read-only research mode, automatically selected.'
        required: true
        type: choice
        options:
          - RESEARCH_ONLY
        default: RESEARCH_ONLY

permissions:
  contents: read

concurrency:
  group: blue-canonical-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  turnover_profit_lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
