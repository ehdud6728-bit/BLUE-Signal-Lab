# Canonical filename: .github/workflows/blue_signal_research_only.yml
# Replace ONLY this research workflow for future research revisions.
# R15128: entry risk avoidance; isolated, no checkout, no D1, no deployment.
# R15127 profit-exit engine is replayed with its unchanged frozen inputs.
name: BLUE Research R1.5.10.28 Entry Risk Avoidance (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Read-only research mode (default selected).'
        required: true
        type: choice
        options:
          - RESEARCH_ONLY
        default: RESEARCH_ONLY

permissions:
  contents: read

concurrency:
  group: blue-canonical-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entry_risk_lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Confirm repository, main branch, human dispatch, and research mode
