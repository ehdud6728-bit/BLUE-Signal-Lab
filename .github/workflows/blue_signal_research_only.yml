      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'pyarrow==22.0.0' 'requests==2.32.5' \
            'scikit-learn==1.8.0'

      - name: Run no-lookahead and profit-exit simulator tests
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15128" -p 'test_*.py' -v

      - name: Reproduce R15127 baseline on exactly 4096 matched signals
        run: |
          python -B "$RUNNER_TEMP/r15128/study.py" \
            --input "$RUNNER_TEMP/r15128" \
            --output output/r15127_profit_exit

      - name: Run R15128 signal-day-only entry risk research
        run: |
          python -B "$RUNNER_TEMP/r15128/entry_risk.py" \
            --baseline output/r15127_profit_exit \
            --output output/r15128_entry_risk

      - name: Verify research-only, cohort accounting and expected outputs
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          out=Path('output/r15128_entry_risk')
          files=('EXCLUSION_VS_BASELINE_BY_COHORT.csv',
                 'EXCLUDED_AND_MISSED_WINNERS.csv',
                 'ALL4096_RISK_PREDICTIONS_AND_OUTCOMES.csv',
                 'SIGNAL_DAY_FEATURES_ONLY.csv','AUDIT.json','README_KO.md')
          if any(not (out/f).is_file() or (out/f).stat().st_size < 100 for f in files):
              raise SystemExit('R15128_MISSING_OR_EMPTY_OUTPUT')
          a=json.loads((out/'AUDIT.json').read_text(encoding='utf-8'))
          if not (a['version'].startswith('R15128_') and a['read_only']
                  and a['no_d1_write'] and a['no_deploy']
                  and a['no_live_or_search_modification']
                  and a['never_used_hindsight_peak_as_feature']
                  and a['no_lookahead_features'] and a['signals']==4096):
              raise SystemExit('R15128_SAFETY_AUDIT_FAILED')
          s=pd.read_csv(out/'EXCLUSION_VS_BASELINE_BY_COHORT.csv')
          p=pd.read_csv(out/'ALL4096_RISK_PREDICTIONS_AND_OUTCOMES.csv')
          f=pd.read_csv(out/'SIGNAL_DAY_FEATURES_ONLY.csv')
          if len(s)!=12 or len(p)!=8192 or len(f)!=4096:
              raise SystemExit('R15128_RESULT_COUNTS_FAILED')
          n={'DISCOVERY_2023_2024':2079,'VALIDATION_2025':1101,
             'RETROSPECTIVE_2026':916}
          for h in (3,5):
              for cohort,expected in n.items():
                  q=s[(s.exit_horizon==h)&(s.cohort==cohort)]
                  if len(q)!=2 or any(q.n_all!=expected):
                      raise SystemExit('R15128_COHORT_MISMATCH')
          print('R15128_ENTRY_RISK_SIGNAL_DAY_ONLY_AND_COUNTS_VERIFIED')
          PY

      - name: Upload isolated entry-risk research report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15128_ENTRY_RISK_${{ github.run_id }}
          path: output/r15128_entry_risk/
          if-no-files-found: error
          retention-days: 30
