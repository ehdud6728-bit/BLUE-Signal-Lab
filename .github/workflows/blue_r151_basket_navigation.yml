name: BLUE R1.5.1 Basket Navigation Installer (MANUAL)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE: test/compile only. TRUE: commit R1.5.1 UI changes to main.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r151-basket-navigation
  cancel-in-progress: false

jobs:
  test_and_optional_install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
