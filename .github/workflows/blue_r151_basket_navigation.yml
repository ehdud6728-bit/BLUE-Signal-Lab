              assert set(z.namelist()) == allowed, 'Unexpected R1.5.1 payload paths'
              for name in sorted(allowed):
                  path=Path(name)
                  value=z.read(name)
                  if path.exists() and path.read_bytes()!=value:
                      raise SystemExit('R151_EXISTING_FILE_MISMATCH: '+name)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(value)
                  print('R151_RESTORED',name)
          PYRESTORE
      - name: Patch only the web UI with strict guards
        run: |
          python scripts/blue_r151_nav_install.py
          python - <<'PYTEST'
          from pathlib import Path
          a=Path('web/src/main.tsx').read_text()
          b=Path('web/src/SmartBasket.tsx').read_text()
          assert 'R151_BASKET_TAB' in a
          assert 'R151_QUICK_ADD' in b
          assert a.count('<SmartBasket searchRows={rows} quickAddRequest={basketRequest} onItemsChange={setBasketIds}/>') == 1
          assert 'r151-mobile-add' in a and 'r151-quick-add' in a
          assert 'r151-basket-mode' in a and "nav('basket')" in a
          assert 'r151-navigation.css' in a
          print('R151_UI_CHECKS_PASS')
          PYTEST
      - name: Compile React/TypeScript and produce web build
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Commit only R1.5.1 frontend changes after explicit approval
        if: inputs.apply_changes
        shell: bash
        run: |
          set -euo pipefail
          git add web/src/main.tsx web/src/SmartBasket.tsx web/src/r151-navigation.css scripts/blue_r151_nav_install.py
          if git diff --cached --quiet; then
            echo 'R151_ALREADY_INSTALLED'
          else
            git config user.name 'BLUE R1.5 UI installer'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'BLUE R1.5.1: separate smart basket workspace and quick-add icons'
            git push origin HEAD:main
          fi
      - name: Report next steps
        run: |
          echo 'R151_TEST_AND_BUILD_SUCCESS'
          echo 'If apply_changes=false: rerun with true to install.'
          echo 'If apply_changes=true: check Cloudflare GitHub frontend deploy. API Worker redeploy NOT needed.'
