name: BLUE KIS Token Reconciliation Tests
on:
  pull_request:
    paths:
      - 'tools/turso/kis-token-steward*'
      - 'tools/turso/d1-token-backup*'
      - '.github/workflows/blue_kis_token_reconcile_tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
        working-directory: tools/turso
      - run: node --test tools/turso/kis-token-steward.test.mjs tools/turso/d1-token-backup.test.mjs
