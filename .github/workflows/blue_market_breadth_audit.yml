name: BLUE Market Breadth Live Audit (READ ONLY)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worker/scripts/market-breadth-audit*'
      - 'worker/src/turso-market-ai.ts'
      - '.github/workflows/blue_market_breadth_audit.yml'
permissions:
  contents: read
concurrency:
  group: blue-market-breadth-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: worker
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: Offline independent comparison
        run: node --experimental-strip-types --test worker/scripts/market-breadth-audit.test.mjs
      - name: Production Turso read only, aggregate output
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node --experimental-strip-types worker/scripts/market-breadth-audit.mjs
