name: BLUE KIS D1-to-Turso Cutover Audit (READ ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-kis-cutover-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Guard repository and merged default branch
        run: |
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vault read-only dependency
        run: python -m pip install 'cryptography>=43,<48'
      - name: Test audit fail-closed behavior without live credentials
        run: python -m unittest discover -s tests -p 'test_blue_kis_cutover_audit.py' -v
      - name: Read only issuer timestamps and cutover flags (NO TOKENP)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLUE_KIS_TOKEN_AUTO_PAUSED: ${{ vars.BLUE_KIS_TOKEN_AUTO_PAUSED }}
          BLUE_KIS_D1_DISABLED_AT_UTC: ${{ vars.BLUE_KIS_D1_DISABLED_AT_UTC }}
          BLUE_KIS_TURSO_CUTOVER_APPROVED: ${{ vars.BLUE_KIS_TURSO_CUTOVER_APPROVED }}
        run: python scripts/blue_kis_cutover_audit.py
