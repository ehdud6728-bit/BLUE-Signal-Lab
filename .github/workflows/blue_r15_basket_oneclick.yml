          with ZipFile(BytesIO(base64.b64decode(source))) as archive:
              assert set(archive.namelist()) == allowed, 'Unexpected embedded source files'
              for name in archive.namelist():
                  dest = Path(name)
                  payload = archive.read(name)
                  if dest.exists() and dest.read_bytes() != payload:
                      raise SystemExit('Existing R1.5 file differs; refusing overwrite: '+name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(payload)
                  print('R15_RESTORED',name)
