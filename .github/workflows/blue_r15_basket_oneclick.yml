name: BLUE R1.5 AI Smart Basket ONE-CLICK Installer (MANUAL)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE = offline test + build only. TRUE = commit R1.5 module and isolated API/UI integration.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r15-basket-oneclick
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
