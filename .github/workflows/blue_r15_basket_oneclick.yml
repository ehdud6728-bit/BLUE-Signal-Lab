      - name: Test R1.5 AI candidate validation (offline)
        run: node --experimental-strip-types --test tests/test_basket_r15.mjs
      - name: Safely integrate into existing UI and Worker (runner only)
        run: python scripts/blue_r15_basket_install.py --apply
      - name: Check web build
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Check isolated API compilation
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r15-basket-worker-build
      - name: Commit only R1.5 code when explicitly approved
        if: inputs.apply_changes
        shell: bash
        run: |
          git add web/src/SmartBasket.tsx web/src/smart-basket.css worker/src/basket.ts scripts/blue_r15_basket_install.py tests/test_basket_r15.mjs web/src/main.tsx worker/src/index.ts
          if git diff --cached --quiet; then
            echo 'R15_ALREADY_INSTALLED'
          else
            git config user.name 'BLUE R1.5 installer'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'BLUE R1.5: AI smart basket local watchlist and verified EOD AI suggestions'
            git push origin HEAD:main
          fi
      - name: Report next step
        run: |
          echo 'R15_TESTED. When apply_changes=true and committed, deploy existing API Worker using blue_kis_r14_deploy_api.yml.'
