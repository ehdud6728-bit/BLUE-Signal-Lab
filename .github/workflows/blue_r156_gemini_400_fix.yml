name: BLUE R1.5.6 Gemini 3.5 Request Compatibility (MANUAL)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE: validate only. TRUE: commit the verified Gemini request fix to main.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r156-gemini-request-compatibility
  cancel-in-progress: false

jobs:
  verify_and_optional_apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Guard BLUE repository and main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF_NAME" = 'main'

      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch ONLY Gemini 3.5 API requests and their tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          
          def patch(path, before, after):
              p = Path(path)
              if not p.is_file():
                  raise SystemExit('R156_MISSING_FILE ' + path)
              text = p.read_text(encoding='utf-8')
              count = text.count(before)
              if count == 1:
                  p.write_text(text.replace(before, after, 1), encoding='utf-8')
                  print('R156_PATCHED', path)
              elif count == 0 and after in text:
                  print('R156_ALREADY_PATCHED', path)
              else:
                  raise SystemExit(f'R156_ANCHOR_MISMATCH {path} matches={count}')

          # Gemini 3.5 Flash-Lite deprecates custom sampling parameters.
          # Keep the existing output MIME, model, prompt, timeout, security and quotas.
          patch('worker/src/basket.ts',
                "generationConfig:{temperature:0.15,maxOutputTokens:3600,responseMimeType:'application/json'}",
                "generationConfig:{maxOutputTokens:3600,responseMimeType:'application/json'}")
          patch('worker/src/ai.ts',
                "generationConfig:{temperature:0.2,maxOutputTokens:4096}",
                "generationConfig:{maxOutputTokens:4096}")

          # If a 400 remains, report the provider's ENUM status only, not prompts,
          # credentials, HTTP bodies or free-text error descriptions.
          patch('worker/src/basket.ts',
                "   if(!response.ok){\n    const code=response.status===429?'AI_QUOTA':",
                "   if(!response.ok){\n    if(response.status===400){\n     let status='UNKNOWN';\n     try{\n      const upstream=await response.clone().json() as {error?:{status?:unknown}};\n      const code=upstream?.error?.status;\n      if(typeof code==='string' && /^[A-Z_]{3,40}$/.test(code))status=code;\n     }catch{/* No upstream text is logged or returned */}\n     console.warn('BLUE_R156_GEMINI_400',{model,provider_status:status,request_profile:'json_default_sampling'});\n    }\n    const code=response.status===429?'AI_QUOTA':")

          patch('worker/src/basket.ts',
                "AI_BAD_REQUEST:'Gemini 요청 형식이 거부됐습니다. 모델 입력과 JSON 출력 설정을 점검해야 합니다.',",
                "AI_BAD_REQUEST:'Gemini 요청이 거부됐습니다. 기본 샘플링으로도 발생하면 Cloudflare Worker의 BLUE_R156_GEMINI_400 진단 상태와 모델 접근 권한을 확인하세요.',")

          patch('tests/test_basket_r15.mjs',
                "  assert.equal(body.generationConfig.responseMimeType,'application/json');",
                "  assert.equal(body.generationConfig.responseMimeType,'application/json');\n  assert.equal(Object.hasOwn(body.generationConfig,'temperature'),false);")

          basket = Path('worker/src/basket.ts').read_text(encoding='utf-8')
          market = Path('worker/src/ai.ts').read_text(encoding='utf-8')
          assert "generationConfig:{maxOutputTokens:3600,responseMimeType:'application/json'}" in basket
          assert 'temperature:0.15' not in basket
          assert 'generationConfig:{maxOutputTokens:4096}' in market
          assert 'temperature:0.2' not in market
          assert 'BLUE_R156_GEMINI_400' in basket
          print('R156_STATIC_CHECK_PASS: Gemini sampling, JSON MIME, safe error status')
          PY

      - name: Run AI candidate regression tests (no live Gemini request)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/test_basket_r15.mjs

      - name: Build API Worker without deployment or new secrets
        shell: bash
        working-directory: worker
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ../.r156-api-build

      - name: Verify patch is isolated to two API modules and one test
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          allowed={'worker/src/basket.ts','worker/src/ai.ts','tests/test_basket_r15.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if not changed or not changed.issubset(allowed):
              raise SystemExit('R156_UNEXPECTED_MODIFICATIONS '+repr(changed))
          print('R156_CHANGED_FILES_OK',sorted(changed))
          PY

      - name: Commit only if explicitly requested
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BLUE R1.5.6 safe installer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/basket.ts worker/src/ai.ts tests/test_basket_r15.mjs
          if git diff --cached --quiet; then
            echo 'R156_ALREADY_APPLIED'
          else
            git commit -m 'BLUE R1.5.6: remove Gemini 3.x custom temperature and sanitize 400 diagnostics'
            git push origin HEAD:main
          fi

      - name: Report next action
        shell: bash
        run: |
          echo 'R156_TESTS_AND_API_BUILD_PASS'
          echo 'If apply_changes=false, rerun with true to commit. No live Gemini request was made.'
          echo 'After commit, deploy ONLY existing BLUE API Worker workflow. No collector or DB changes.'
