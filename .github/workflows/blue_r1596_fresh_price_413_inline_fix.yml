name: BLUE R1.5.9.6 Fresh Price + 413 Fix + Inline Button (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE: test only. TRUE: commit verified R1.5.9.6 source to main.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r1596-quote-verified
  cancel-in-progress: false

