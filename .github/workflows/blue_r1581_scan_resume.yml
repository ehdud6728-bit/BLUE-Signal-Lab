      - name: Apply exact-anchor scan resume patch
        shell: bash
        run: |
          python scripts/blue_r1581_scan_resume.py
          python - <<'PY_ASSERT'
          from pathlib import Path
          main=Path('web/src/main.tsx').read_text()
          css=Path('web/src/r1581-scan-monitor.css').read_text()
          assert 'R1581_SCAN_RESUME' in main
          assert 'const [watchDate,setWatchDate]=useState(rememberedScanDate)' in main
          assert 'completedDate&&<button' in main
          assert 'visibilitychange' in main and "window.addEventListener('focus',onFocus)" in main
          assert "setDate(e.target.value);setWatchDate('')" not in main
          assert '.r1581-scan-monitor' in css
          print('R1581_SCAN_RESUME_ASSERT_PASS')
          PY_ASSERT
      - name: Build React TypeScript frontend
        working-directory: web
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Restrict modifications to reviewed frontend files
        shell: bash
        run: |
          python - <<'PY_SCOPE'
          import subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed in ({'web/src/main.tsx'},set()), 'R1581_UNEXPECTED_MODIFICATIONS '+repr(sorted(changed))
          assert Path('web/src/r1581-scan-monitor.css').is_file()
          print('R1581_FRONTEND_ONLY_SCOPE_PASS',sorted(changed))
          PY_SCOPE
      - name: Commit tested scan monitoring improvements only when approved
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/blue_r1581_scan_resume.py web/src/main.tsx web/src/r1581-scan-monitor.css
          if git diff --cached --quiet; then
            echo R1581_ALREADY_INSTALLED
          else
            git commit -m 'BLUE R1.5.8.1: restore pending scan monitoring and auto refresh results'
            git push origin HEAD:main
          fi
      - name: Deployment notes
        shell: bash
        run: |
          echo R1581_BUILD_PASS
          echo 'FALSE: verification only, rerun with TRUE to commit.'
          echo 'TRUE: frontend-only change, confirm Cloudflare frontend deployment.'
          echo 'No API, KIS collector, D1 schema, or scan workflow changed.'
