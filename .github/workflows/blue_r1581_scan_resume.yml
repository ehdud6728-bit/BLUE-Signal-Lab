name: BLUE R1.5.8.1 Search Resume and Auto-Refresh (MANUAL)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE = test and build only. TRUE = commit verified scan status recovery to main.'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: blue-r1581-scan-resume
  cancel-in-progress: false
jobs:
