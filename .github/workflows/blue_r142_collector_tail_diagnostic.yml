name: BLUE Collector Runtime Tail Diagnostic (READ ONLY)

on:
  workflow_dispatch:
    inputs:
      capture_minutes:
        description: 'Capture only filtered Worker status lines. Use 7 minutes to include a full five-minute scan.'
        type: choice
        required: true
        default: '7'
        options:
          - '3'
          - '7'

permissions:
  contents: read

concurrency:
  group: blue-collector-tail-readonly
  cancel-in-progress: false

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler and run local filter tests
        working-directory: collector
        run: |
          npm install --no-audit --no-fund --no-package-lock
          node --test test/tail-diagnostic.test.mjs

      - name: Read Cloudflare Worker runtime logs for a bounded period
        working-directory: collector
        shell: bash
        env:
          CAPTURE_MINUTES: ${{ inputs.capture_minutes }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          case "$CAPTURE_MINUTES" in
            3|7) ;;
            *) echo 'ERROR: Unsupported capture duration.'; exit 1 ;;
          esac
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo 'ERROR: Cloudflare credentials are not configured.'; exit 1
          fi
          echo "BLUE_COLLECTOR_TAIL_START worker=blue-market-collector capture_minutes=$CAPTURE_MINUTES"
          echo 'Read-only, live logs only. Raw Worker output is NOT printed.'
          echo 'No D1 SQL, no KIS requests, no Worker deployment, no Turso writes.'
          set +e
          timeout --signal=INT --kill-after=10s "$((CAPTURE_MINUTES*60))s" \
            npx wrangler tail blue-market-collector --format=json 2>&1 \
            | node tools/tail-diagnostic.mjs
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [[ "${statuses[1]}" -ne 0 ]]; then
            echo 'ERROR: Sanitized tail processing failed.'; exit 1
          fi
          if [[ "${statuses[0]}" -ne 0 && "${statuses[0]}" -ne 124 && "${statuses[0]}" -ne 130 ]]; then
            echo 'ERROR: Cloudflare live tail unavailable. Check Worker Tail permission or use the Cloudflare dashboard Logs tab.'; exit 1
          fi
          echo 'BLUE_COLLECTOR_TAIL_COMPLETE: The live capture finished without any D1 SQL.'
