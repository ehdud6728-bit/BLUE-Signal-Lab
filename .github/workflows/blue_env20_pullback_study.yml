name: BLUE ENV20 Inverse Pullback Timing (READ ONLY)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/env20_pullback_study.py'
      - 'research/env20_structural_entry.py'
      - 'research/env20_confluence_entry.py'
      - 'research/env20_technical_room.py'
      - 'research/env20_case_features.py'
      - 'research/test_env20_case_features.py'
      - 'tools/turso/full-universe-export.mjs'
      - 'tools/turso/full-universe-export.test.mjs'
      - 'research/test_env20_technical_room.py'
      - 'research/test_env20_confluence_entry.py'
      - 'research/test_env20_structural_entry.py'
      - 'research/env20_pullback_context.py'
      - 'tools/turso/env20-pullback-factors.test.mjs'
      - 'research/test_env20_pullback_study.py'
      - 'tools/turso/env20-pullback-factors.mjs'
      - '.github/workflows/blue_env20_pullback_study.yml'
permissions:
  contents: read
concurrency:
  group: blue-env20-pullback
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tools/turso --no-audit --no-fund --ignore-scripts --no-package-lock
      - run: npm install --prefix collector --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Offline exact entry and provenance tests
        run: |
          node --test tools/turso/env20-pullback-factors.test.mjs tools/turso/combined-pattern-factors.test.mjs tools/turso/full-universe-export.test.mjs collector/src/market-trends-regime.test.mjs
          python3 research/test_env20_pullback_study.py
          python3 research/test_env20_structural_entry.py
          python3 research/test_env20_confluence_entry.py
          python3 research/test_env20_technical_room.py
          python3 research/test_env20_case_features.py
      - name: Read audited source and compare fixed pullback rules
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ehdud6728-bit/BLUE-Signal-Lab'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          BLUE_BENCHMARK_STATE_FILE: output/full-universe/benchmark.json
        run: |
          set -euo pipefail
          BLUE_CASE_FIELDS=true node tools/turso/full-universe-export.mjs
          node collector/src/market-trends.mjs benchmark_inspect
          node tools/turso/env20-pullback-factors.mjs
          python3 research/env20_case_features.py --source output/full-universe/source.json --benchmark output/full-universe/benchmark.json --factors output/full-universe/pullback-factors.json --out output/full-universe/pullback-report.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ehdud6728-bit/BLUE-Signal-Lab'
        with:
          name: BLUE_ENV20_CASE_FEATURES_V6
          path: |
            output/full-universe/pullback-report.json
            output/full-universe/case-signals.json
            output/full-universe/case-outcomes.json
          if-no-files-found: error
          retention-days: 14
