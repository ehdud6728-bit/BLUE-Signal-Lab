name: BLUE R1.5.10.7 Compact Stop Loss Install (MANUAL SAFE)

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'FALSE = validate only, TRUE = commit 5 frontend/test files to main. Never deploys Cloudflare.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: blue-r15107-compact-stop-loss-source-install
  cancel-in-progress: false

jobs:
  verify_and_optional_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard exact BLUE repo and main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare embedded installer and verify strict source anchors
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/blue_r15107_stop_loss_patch.py" <<'PY_R15107'
          #!/usr/bin/env python3
          """Strict, source-only installer for R1.5.10.7. No API, KIS or D1 edits."""
          from __future__ import annotations
          import argparse
          from pathlib import Path

          ROOT = Path(__file__).resolve().parent

          def replace_one(s: str, old: str, new: str, label: str) -> str:
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f'R15107_ANCHOR_{label}_EXPECTED_1_GOT_{n}')
              if old == new:
                  raise RuntimeError(f'R15107_NO_CHANGE_{label}')
              print('R15107_ANCHOR_OK', label)
              return s.replace(old, new, 1)

          def patch(src: str) -> str:
              s=src
              s=replace_one(s,
                  "import {comparisonKey,fetchCompared,sourceName,type PriceCompare} from './price-compare';",
                  "import {comparisonKey,fetchCompared,sourceName,type PriceCompare} from './price-compare';\nimport StopLossRow from './StopLossRow';\nimport type {StopMethod} from './stop-loss';",
                  'IMPORT_STOP_LOSS')
              s=replace_one(s,
                  '  patternUp10d?:number;patternN10d?:number;patternLabel10d?:string;patternDays10d?:string[]};',
                  '  patternUp10d?:number;patternN10d?:number;patternLabel10d?:string;patternDays10d?:string[];\n  stopMethod?:StopMethod};',
                  'ITEM_OPTIONAL_STOP_METHOD')
              s=replace_one(s,
                  '   (x.patternUp10d===undefined||',
                  "   (x.stopMethod===undefined||(['SUPPORT','ATR','MA20','TRAILING'] as string[]).includes(x.stopMethod))&&\n   (x.patternUp10d===undefined||",
                  'BACKUP_IMPORT_VALIDATION')
              s=replace_one(s,
                  '     <div className="r153-row-state" title={pr?.checked_at||\'\'}>',
                  '''     <StopLossRow active={active} code={it.code} day={it.day} baseline={it.baseline}
                 signals={signalChips} highestObserved={maxHigh} highestDay={maxHighDay}
                 selectedMethod={it.stopMethod} refreshKey={refreshKey}
                 onSelectMethod={(method:StopMethod)=>setItems(old=>old.map(x=>x.id===it.id?{...x,stopMethod:method}:x))}/>
               <div className="r153-row-state" title={pr?.checked_at||''}>''',
                  'COMPACT_STOP_ROW')
              assert 'r15107-stop' not in src
              assert s.count('<StopLossRow ')==1
              return s

          def main():
              args=argparse.ArgumentParser()
              args.add_argument('--check', action='store_true')
              a=args.parse_args()
              f=Path('web/src/SmartBasket.tsx')
              assert f.is_file(), 'Run from repository root'
              altered=patch(f.read_text(encoding='utf-8'))
              files={
                  'web/src/SmartBasket.tsx':altered,
                  'web/src/stop-loss.ts':(ROOT/'stop_loss_r15107.ts').read_text(encoding='utf-8'),
                  'web/src/StopLossRow.tsx':(ROOT/'StopLossRow_r15107.tsx').read_text(encoding='utf-8'),
                  'web/src/r15107-stop-loss.css':(ROOT/'r15107-stop-loss.css').read_text(encoding='utf-8'),
                  'tests/test_stop_loss_r15107.mjs':(ROOT/'test_stop_loss_r15107.mjs').read_text(encoding='utf-8')}
              for name in files:
                  p=Path(name)
                  if name!='web/src/SmartBasket.tsx' and p.exists():
                      raise RuntimeError('R15107_DESTINATION_ALREADY_EXISTS: '+name)
              print('R15107_TARGET_SCOPE_OK',','.join(files))
              if a.check:
                  print('R15107_PREFLIGHT_NO_FILES_WRITTEN')
                  return
              for name,content in files.items():
                  p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
                  print('R15107_WRITTEN',name,len(content))
              print('R15107_PATCH_APPLIED_LOCALLY_ONLY')

          if __name__=='__main__':main()
          PY_R15107
          cat > "$RUNNER_TEMP/stop_loss_r15107.ts" <<'TS_R15107'
          /** R1.5.10.7 – indicative observation levels from verified archived EOD candles.
           * Never infer intraday/live indicators from a discovery-day snapshot.
           */
          export type StopMethod='SUPPORT'|'ATR'|'MA20'|'TRAILING';
          export type StopBar={t:string;o:number;h:number;l:number;c:number};
          export type StopCandidate={method:StopMethod;label:string;basis:string;price:number|null;baselinePct:number|null};

          function finitePositive(v:unknown):v is number{return typeof v==='number'&&Number.isFinite(v)&&v>0;}
          function validBar(v:unknown):v is StopBar{
           if(!v||typeof v!=='object')return false;
           const b=v as Partial<StopBar>;
           return typeof b.t==='string'&&/^20\d{2}-\d{2}-\d{2}$/.test(b.t)&&
            finitePositive(b.o)&&finitePositive(b.h)&&finitePositive(b.l)&&finitePositive(b.c)&&
            b.h>=b.l&&b.h>=b.c&&b.l<=b.c;
          }
          const safeStop=(raw:number|null,baseline:number,canExceed=false):number|null=>{
           if(raw===null||!Number.isFinite(raw)||raw<=0)return null;
           const price=Math.floor(raw);
           return price>0&&(canExceed||price<baseline)?price:null;
          };

          /** Original unadjusted daily OHLC until the discovery date. No future candles. */
          export function calculateStopCandidates(rawBars:unknown,discoveryDay:string,baseline:number,
           observedHigh:number|null=null,observedHighDay:string|null=null):StopCandidate[]{
           const bars=Array.isArray(rawBars)?rawBars.filter(validBar).filter(b=>b.t<=discoveryDay)
            .sort((a,b)=>a.t.localeCompare(b.t)).slice(-180):[];
           const validBase=finitePositive(baseline);
           const candidate=(method:StopMethod,label:string,basis:string,raw:number|null,allowAbove=false):StopCandidate=>{
            const price=validBase?safeStop(raw,baseline,allowAbove):null;
            return {method,label,basis,price,baselinePct:price!==null?100*(price/baseline-1):null};
           };
           // The last 10 *completed previous* sessions are used; don't use the entry signal day's low.
           const prior=bars.filter(b=>b.t<discoveryDay).slice(-10);
           const support=prior.length===10?Math.min(...prior.map(b=>b.l))*0.995:null;
           // 14-session ATR (simple moving average of true ranges) requires 15 daily bars.
           const last15=bars.slice(-15);
           let atr:number|null=null;
           if(last15.length===15){
            let sum=0;
            for(let i=1;i<last15.length;i++){
             const b=last15[i],prev=last15[i-1];
             sum+=Math.max(b.h-b.l,Math.abs(b.h-prev.c),Math.abs(b.l-prev.c));
            }
            atr=sum/14;
           }
           const ma20=bars.length>=20?bars.slice(-20).reduce((sum,b)=>sum+b.c,0)/20:null;
           const trailValid=finitePositive(observedHigh)&&typeof observedHighDay==='string'&&
            observedHighDay>discoveryDay&&observedHigh>baseline;
           return [
            candidate('SUPPORT','최근 저점','발견일 이전 10거래일 저점 −0.5%',support),
            candidate('ATR','ATR 변동성','발견가 − 발견일 ATR(14) × 2.5',atr===null?null:baseline-atr*2.5),
            candidate('MA20','20일선','발견일 20일 이동평균선 −0.5%',ma20===null?null:ma20*0.995),
            candidate('TRAILING','추적 손절선','발견일 ATR(14) × 2.5 · 이후 관측된 최고가 기준(추정)',
             trailValid&&atr!==null?observedHigh-atr*2.5:null,true)
           ];
          }

          export function preferredStopMethod(signals:readonly string[]):StopMethod{
           return signals.some(s=>/^(?:B(?:B|LUE)?(?:20|30|40)(?:_|$)|ENV(?:20|40)(?:_|$))/i.test(s))?'SUPPORT':'ATR';
          }
          TS_R15107
          cat > "$RUNNER_TEMP/StopLossRow_r15107.tsx" <<'TSX_R15107'
          import {useEffect,useMemo,useState} from 'react';
          import {ChevronDown} from 'lucide-react';
          import {calculateStopCandidates,preferredStopMethod,type StopBar,type StopMethod} from './stop-loss';
          import './r15107-stop-loss.css';

          const API=(import.meta.env.VITE_API_BASE||'https://blue-signal-lab-api-v2.ehdud6728.workers.dev').replace(/\/+$/,'');
          const inFlight=new Map<string,Promise<StopBar[]|null>>();
          const pending:Array<()=>void>=[];
          let running=0;
          function schedule<T>(task:()=>Promise<T>):Promise<T>{
           return new Promise((resolve,reject)=>{
            pending.push(()=>{running++;void task().then(resolve,reject).finally(()=>{running--;pending.shift()?.();});});
            if(running<2)pending.shift()?.();
           });
          }
          function loadBars(code:string,day:string,refreshKey:number):Promise<StopBar[]|null>{
           const key=`${code}:${day}:${refreshKey}`;
           const current=inFlight.get(key);if(current)return current;
           if(inFlight.size>300)inFlight.clear();
           const promise=schedule(async()=>{
            const u=new URL(API+'/api/chart');u.searchParams.set('code',code);u.searchParams.set('date',day);
            const r=await fetch(u.toString(),{credentials:'include',cache:'no-store'});
            if(!r.ok)return null;
            const data=await r.json() as {status?:string;chart?:{bars?:StopBar[]}};
            return data.status==='READY'&&Array.isArray(data.chart?.bars)?data.chart.bars:null;
           }).catch(()=>null);
           inFlight.set(key,promise);return promise;
          }
          const money=(price:number)=>Math.floor(price).toLocaleString('ko-KR')+'원';
          const percent=(v:number)=>`${v>0?'+':''}${v.toFixed(2)}%`;

          type Props={active:boolean;code:string;day:string;baseline:number;signals:string[];
           highestObserved:number|null;highestDay:string|null;selectedMethod?:StopMethod;
           onSelectMethod:(method:StopMethod)=>void;refreshKey:number};
          export default function StopLossRow({active,code,day,baseline,signals,highestObserved,highestDay,
           selectedMethod,onSelectMethod,refreshKey}:Props){
           const [bars,setBars]=useState<StopBar[]|null|undefined>(undefined);
           useEffect(()=>{
            if(!active)return;
            let alive=true;setBars(undefined);
            void loadBars(code,day,refreshKey).then(v=>{if(alive)setBars(v);});
            return()=>{alive=false;};
           },[active,code,day,refreshKey]);
           const candidates=useMemo(()=>calculateStopCandidates(bars,day,baseline,highestObserved,highestDay),
            [bars,day,baseline,highestObserved,highestDay]);
           const preferred=selectedMethod||preferredStopMethod(signals);
           const selected=candidates.find(x=>x.method===preferred)||candidates[0];
           const fallback=selectedMethod?selected:candidates.find(x=>x.method===preferred&&x.price!==null)
            ||candidates.find(x=>x.price!==null)||selected;
           const waiting=bars===undefined;
           const readable=waiting?'계산 중':fallback.price===null?'산출 불가':money(fallback.price);
           return <details className="r15107-stop">
            <summary className="r15107-stop-summary">
             <span className="r15107-stop-label">대표 손절선</span>
             <strong className="r15107-stop-number">{readable}</strong>
             {fallback.baselinePct!==null&&<small className="r15107-stop-pct">{percent(fallback.baselinePct)}</small>}
             <span className="r15107-stop-more">더보기 <ChevronDown size={13}/></span>
            </summary>
            <div className="r15107-stop-details">
             <small className="r15107-stop-origin">발견가 {money(baseline)} 대비 · 발견일({day})까지의 저장 일봉 기준</small>
             {candidates.map(row=><button type="button" key={row.method}
              className={'r15107-stop-option'+(row.method===fallback.method?' is-selected':'')}
              aria-pressed={row.method===fallback.method} disabled={waiting||row.price===null}
              onClick={()=>onSelectMethod(row.method)}>
              <span className="r15107-stop-option-name">{row.label}<small>{row.basis}</small></span>
              <span className="r15107-stop-option-value"><b>{waiting?'계산 중':row.price===null?'산출 불가':money(row.price)}</b>
               {row.baselinePct!==null&&<small>{percent(row.baselinePct)}</small>}</span>
             </button>)}
             <small className="r15107-stop-note">대표 기준을 누르면 이 기기의 장바구니에 저장됩니다. 트레일링은 이후 관측 최고가에 발견일 ATR을 적용한 추정치입니다. 실제 주문 호가단위·장중 체결·수정주가는 반영하지 않습니다. 자동 매도나 손절 경고가 아닙니다.</small>
            </div>
           </details>;
          }
          TSX_R15107
          cat > "$RUNNER_TEMP/r15107-stop-loss.css" <<'CSS_R15107'
          /* R1.5.10.7 compact, calculated stop-loss candidates: basket only. */
          .r15107-stop{border-top:1px solid #e7edf5;margin-top:7px;padding-top:5px;min-width:0}
          .r15107-stop-summary{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:29px;cursor:pointer;list-style:none;min-width:0}
          .r15107-stop-summary::-webkit-details-marker{display:none}
          .r15107-stop-label{font-size:12px;font-weight:800;color:#c36753;white-space:nowrap}
          .r15107-stop-number{font-size:13px;font-weight:750;color:#354a61;font-variant-numeric:tabular-nums;white-space:nowrap}
          .r15107-stop-pct{font-size:11px;font-weight:700;color:#b65a4f;font-variant-numeric:tabular-nums;white-space:nowrap}
          .r15107-stop-more{display:inline-flex;align-items:center;gap:3px;margin-left:auto;font-size:10px;font-weight:650;color:#657b96;white-space:nowrap}
          .r15107-stop-more svg{transition:transform .15s}.r15107-stop[open] .r15107-stop-more svg{transform:rotate(180deg)}
          .r15107-stop-details{display:grid;gap:6px;margin:5px 0 6px;padding:8px;background:#fbfcff;border:1px solid #e6ecf5;border-radius:8px}
          .r15107-stop-origin,.r15107-stop-note{font-size:10px;line-height:1.5;color:#74839b}
          .r15107-stop-option{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:7px 8px;border:1px solid #e4eaf2;border-radius:7px;background:#fff;text-align:left;min-width:0;cursor:pointer}
          .r15107-stop-option.is-selected{border-color:#d6927b;background:#fff8f6}
          .r15107-stop-option:disabled{opacity:.65;cursor:default}
          .r15107-stop-option-name{font-size:11px;font-weight:750;color:#a66a50;min-width:0}
          .r15107-stop-option-name small{display:block;font-size:9px;color:#75869c;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
          .r15107-stop-option-value{display:grid;justify-items:end;flex-shrink:0;gap:1px;font-variant-numeric:tabular-nums}
          .r15107-stop-option-value b{font-size:12px;color:#365471}
          .r15107-stop-option-value small{font-size:10px;color:#b65a4f}
          @media(max-width:390px){.r15107-stop-summary{gap:4px}.r15107-stop-label{font-size:11px}.r15107-stop-number{font-size:12px}.r15107-stop-pct{font-size:10px}}
          CSS_R15107
          cat > "$RUNNER_TEMP/test_stop_loss_r15107.mjs" <<'TEST_R15107'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {calculateStopCandidates,preferredStopMethod} from '../web/src/stop-loss.ts';
          const bars=Array.from({length:45},(_,i)=>{
           const d=new Date(Date.UTC(2026,7,1+i));const t=d.toISOString().slice(0,10);
           const c=1000+i;return {t,o:c-1,h:c+10,l:c-10,c};
          });
          const asof=bars.at(-1).t;
          const row=(m,r)=>r.find(x=>x.method===m);
          test('supports genuine 10 prior sessions, ATR14 and MA20',()=>{
           const x=calculateStopCandidates(bars,asof,1044);
           assert.equal(x.length,4);
           assert.ok(row('SUPPORT',x).price<1044);
           assert.ok(row('ATR',x).price<1044);
           assert.ok(row('MA20',x).price<1044);
           assert.equal(row('TRAILING',x).price,null);
          });
          test('future prices are never used for discovery as-of',()=>{
           const a=calculateStopCandidates(bars.slice(0,30),bars[29].t,1029);
           const b=calculateStopCandidates([...bars,{t:'2027-01-05',o:99999,h:100010,l:99990,c:100000}],bars[29].t,1029);
           assert.deepEqual(a,b);
          });
          test('trailing needs a later observed high, not an arbitrary number',()=>{
           assert.equal(row('TRAILING',calculateStopCandidates(bars,asof,1044,1300,asof)).price,null);
           const t=row('TRAILING',calculateStopCandidates(bars,asof,1044,1300,'2026-11-12'));
           assert.ok(t.price>1044);assert.ok(t.baselinePct>0);
          });
          test('missing verified candles never makes up stop prices',()=>{
           const x=calculateStopCandidates(null,'2026-11-12',1000);
           assert.ok(x.every(y=>y.price===null));
          });
          test('invalid or insufficient candle data is rejected',()=>{
           const x=calculateStopCandidates([{t:'2026-11-11',o:1,h:1,l:10,c:2}],asof,1044);
           assert.ok(x.every(y=>y.price===null));
          });
          test('prefers structural stop for B40/ENV but ATR for momentum-only',()=>{
           assert.equal(preferredStopMethod(['B40']),'SUPPORT');
           assert.equal(preferredStopMethod(['BB40']),'SUPPORT');
           assert.equal(preferredStopMethod(['ENV20']),'SUPPORT');
           assert.equal(preferredStopMethod(['MACD_GC']),'ATR');
          });
          TEST_R15107
          python -m py_compile "$RUNNER_TEMP/blue_r15107_stop_loss_patch.py"
          python "$RUNNER_TEMP/blue_r15107_stop_loss_patch.py" --check
      - name: Apply R1.5.10.7 stop-loss changes in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/blue_r15107_stop_loss_patch.py"
          test -s web/src/stop-loss.ts
          test -s web/src/StopLossRow.tsx
          test -s web/src/r15107-stop-loss.css
          test -s tests/test_stop_loss_r15107.mjs
      - name: Run no-lookahead and stop-price unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/test_stop_loss_r15107.mjs
          node --test tests/test_r1593_compare.mjs
      - name: Build production frontend (React TypeScript and Vite)
        shell: bash
        run: |
          set -euo pipefail
          cat >> .git/info/exclude <<'EOF_IGNORES'
          web/node_modules/
          web/dist/
          web/tsconfig.tsbuildinfo
          web/tsconfig.node.tsbuildinfo
          EOF_IGNORES
          npm --prefix web install --no-package-lock --no-audit --no-fund
          npm --prefix web run build
          test -s web/dist/index.html
      - name: Verify changed-file scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- web/src/stop-loss.ts web/src/StopLossRow.tsx web/src/r15107-stop-loss.css tests/test_stop_loss_r15107.mjs
          git diff --check
          python - <<'PY_SCOPE'
          import subprocess
          expected={'web/src/SmartBasket.tsx','web/src/stop-loss.ts','web/src/StopLossRow.tsx',
                    'web/src/r15107-stop-loss.css','tests/test_stop_loss_r15107.mjs'}
          result=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True)
          files={line[3:] for line in result.splitlines() if line.strip()}
          print('BLUE_R15107_CHANGED_FILES', sorted(files))
          if files!=expected:
              raise SystemExit('R15107_SCOPE_MISMATCH: '+repr(files^expected))
          src=open('web/src/SmartBasket.tsx').read()
          assert src.count('<StopLossRow ')==1
          assert "stopMethod?:StopMethod" in src
          assert 'onSelectMethod=' in src
          print('R15107_SOURCE_SCOPE_TEST_OK')
          PY_SCOPE
      - name: Commit source files only after explicit approval
        if: ${{ inputs.apply_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/src/SmartBasket.tsx web/src/stop-loss.ts web/src/StopLossRow.tsx web/src/r15107-stop-loss.css tests/test_stop_loss_r15107.mjs
          git diff --cached --check
          git commit -m "BLUE R1.5.10.7: compact calculated stop-loss candidates in basket"
          git push origin HEAD:main
          echo 'BLUE_R15107_SOURCE_INSTALL_COMMITTED'
      - name: Dry-run result (no GitHub or Cloudflare writes)
        if: ${{ !inputs.apply_changes }}
        shell: bash
        run: |
          echo 'BLUE_R15107_VERIFY_ONLY_OK: no commit, no API/D1/KIS mutations, no web deployment'
