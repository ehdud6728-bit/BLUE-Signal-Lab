name: BLUE Same Origin Gateway (verify only)
on:
  pull_request:
    paths:
      - 'worker/src/gateway-entry.ts'
      - 'worker/src/gateway-policy.mjs'
      - 'worker/src/web-access-jwt.mjs'
      - 'worker/src/index.ts'
      - 'worker/wrangler.jsonc'
      - 'web/gateway.mjs'
      - 'web/wrangler.gateway.jsonc'
      - 'tests/test_web_gateway.mjs'
      - '.github/workflows/blue_web_gateway_verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_web_gateway.mjs
      - working-directory: worker
        run: npm install --no-package-lock --no-audit --no-fund
      - working-directory: worker
        run: npx wrangler deploy --dry-run
      - working-directory: web
        run: npm install --no-package-lock --no-audit --no-fund
      - working-directory: web
        env:
          VITE_API_BASE: https://blue-signal-lab.ehdud6728.workers.dev
        run: npm run build
      - working-directory: web
        run: npx --yes wrangler@4 deploy --config wrangler.gateway.jsonc --dry-run
