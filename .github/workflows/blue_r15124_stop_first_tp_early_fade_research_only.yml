      - name: Unit tests for stop order ambiguous bars gaps and t3 decision
        run: |
          python -B -m unittest discover -s "$RUNNER_TEMP/r15124" -p test_study.py -v

      - name: Run pinned-market 10-day target stop and early-fade research
        run: |
          python -B "$RUNNER_TEMP/r15124/study.py" \
            --input "$RUNNER_TEMP/r15124" \
            --output output/r15124_stop_first

      - name: Audit sample population DBH anchor and required outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o = Path('output/r15124_stop_first')
          files = ('ENV_SIGNAL_TP5_TP10_STOP_FIRST.csv',
                   'ENV_STATE_TP5_TP10_STOP_FIRST.csv',
                   'STOP_FIRST_TP5_TP10_SUMMARY.csv',
                   'EARLY_T3_FADE_RULE_SUMMARY.csv',
                   'DBH_2026-05-21_EXECUTION_AUDIT.csv',
                   'AUDIT.json', 'README_KO.md')
          if any(not (o/f).is_file() or (o/f).stat().st_size < 80 for f in files):
              raise SystemExit('R15124_MISSING_OR_EMPTY_RESULT')
          a = json.loads((o/'AUDIT.json').read_text(encoding='utf-8'))
          if not (a['version'].startswith('R15124_')
                  and a['read_only'] and a['no_d1_write']
                  and a['no_live_or_search_modification'] and a['no_deploy']
                  and a['r15121_population_identical']
                  and a['signal_rows'] > 10000 and a['state_rows'] > 50000
                  and abs(a['dbh_t3_early_fade_next_open_return_pct']-13.5346756152) < .02
                  and abs(a['dbh_anchor']['signal_peak_high_pct']-28.9149888143) < .02
                  and abs(a['dbh_anchor']['signal_final_pct']+11.1856823266) < .02):
              raise SystemExit('R15124_SOURCE_PARITY_OR_DBH_FAILURE')
          print('R15124_PARITY_EXECUTION_ORDER_AND_T3_FADE_VALIDATED')
          PY

      - name: Upload isolated reproducible research artifacts for 30 days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLUE_R15124_TP_STOP_T3_FADE_${{ github.run_id }}
          path: output/r15124_stop_first/
          if-no-files-found: error
          retention-days: 30
