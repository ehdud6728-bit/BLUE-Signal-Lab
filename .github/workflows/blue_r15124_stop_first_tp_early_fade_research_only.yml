# BLUE R1.5.10.24: independent 10-day target-before-stop & t+3 early fade.
# Upload this one YAML to .github/workflows/; keep existing files intact.
# READ-ONLY study. No KIS, D1, deployment, LIVE, SEARCH, or WATCH writes.
name: BLUE R1.5.10.24 TP Stop and T3 Fade (RESEARCH ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_research_only:
        description: 'Enter RESEARCH_ONLY; production is not modified.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blue-r15124-tp-stop-fade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target_stop_fade_research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce pinned repository branch and research-only mode
        env:
          CONFIRM: ${{ inputs.confirm_research_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ehdud6728-bit/BLUE-Signal-Lab'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM" = 'RESEARCH_ONLY'
          echo 'R15124_RESEARCH_ONLY_GUARD_OK'

      - name: Extract checksum-pinned isolated research code
